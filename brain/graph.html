-|---|---|---|\n| LUAR | **0.86** | **0.03** | 0.56\u20130.57 | 0.38 |\n| Wegmann et al. 2022 | 0.77 | 0.22 | 0.56\u20130.57 | 0.39 |\n| StyleDistance | 0.87 | **0.29** | **0.64** | **0.46** |\n\n**The LUAR row is the decision.** 0.86 on STEL and **0.03** on\nSTEL-or-Content means LUAR, asked to choose between a style match and a content\nmatch, takes the content match almost every time. Our generated documents are\nclient-facing feature walkthroughs; our corpus is published blog posts about\nmeasurement and CI. The topics do not overlap. A content-sensitive encoder would\nscore that mismatch as a voice failure. **StyleDistance is the right default for\nus and LUAR is the wrong one**, which is a conclusion neither paper states, but\nit follows directly from the 0.03 against 0.29 and from the register gap\nrecorded in\n[E0005](E0005-markers-are-genre-sensitive-and-the-checker-must.md). Noted as our\ninference, not as a cited result.\n\n## The metric needs a floor and a ceiling or it means nothing\n\nThe most portable methodological lesson in this whole survey is Sawant's\ncalibration: a raw similarity number is uninterpretable. Compute, from the\noperator's own corpus:\n\n- a **ceiling** \u2014 the operator's held-out samples scored against the training\n  samples (their 0.756), which is the best any generation could honestly hope\n  for; and\n- a **floor** \u2014 the operator's samples scored against *other people's* writing\n  in the same register (their 0.626), below which a score carries no\n  author-specific information at all.\n\nAll four of their personalization methods scored 0.484\u20130.508, below the floor.\nA checker reporting \"similarity 0.51\" without those two anchors would have read\nas a pass. We already have the held-out split that the ceiling needs: the 2\nreserved samples, 2,302 words, from\n[E0005](E0005-markers-are-genre-sensitive-and-the-checker-must.md).\n\n## One caution on what the embedding is actually measuring\n\n*Writing Style Similarity Reflects Academic Genealogy* (arXiv\n[2608.14843](https://arxiv.org/html/2608.14843), Manzo) builds a corpus of 5,803\narXiv authors with \u22652 solo-authored papers plus 2,501 ground-truth\nadvisor\u2013student pairs from the Mathematics Genealogy Project, and finds academic\nsiblings \u2014 two students of one advisor who may never have met \u2014 sitting **30.4%\ncloser across 8,360 pairs**, with closed-set attribution errors landing on the\ntrue author's advisor, student, sibling or lab mate **11 times more often than\nchance**. Stylistic similarity tracks shared training, not identity. For a\none-author regression check that is survivable; it is why the cross-author floor\nis not zero.\n\n## Classical stylometry, for completeness\n\nBoth CPU-only and installable in a line, if Burrows' Delta is wanted beside the\nneural scores: [`faststylometry`](https://pypi.org/project/faststylometry/) on\nPyPI (Python, Burrows' Delta) and\n[`stylo`](https://cran.r-project.org/web/packages/stylo/stylo.pdf) 0.6.3 on CRAN\n(R, GPL-3, multiple distance metrics). For interpretable feature counts at\nscale, **Neurobiber** (Alkiek, Wegmann, Zhu & Jurgens, arXiv\n[2502.18590](https://arxiv.org/html/2502.18590v1)v1, 2025-02-25) predicts 96\nBiber-style features at macro-F1 0.97 / micro-F1 0.98 on a held-out set of\n~4 million sequences, 117,000 tokens/sec on one RTX A6000 at batch size 128 and\n**56\u00d7 faster than the CPU-based Multidimensional Analysis Tagger**; checkpoint\n[`Blablablab/neurobiber`](https://huggingface.co/Blablablab/neurobiber), ~0.1B\nparameters. CPU inference is not discussed in the paper or demonstrated on the\ncard \u2014 the examples move the model to CUDA \u2014 but 0.1B parameters is well within\nCPU reach for a handful of documents. This is an upgrade path for our marker\nlayer, not a replacement for it, and note that\n[E0005](E0005-markers-are-genre-sensitive-and-the-checker-must.md) and\n[E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md) already\nestablished that the marker layer is not where the value is.\n\n# 4. Activation steering and style vectors\n\n**Honest answer: unreachable, and not as a matter of difficulty.** Every method\nin this family needs to read or write something the Anthropic API does not\nexpose.\n\n| method | what it needs |\n|---|---|\n| Style Vectors (Konen, Jentzsch, Diallo, Sch\u00fctt, Bensch, El Baff, Opitz & Hecking, [Findings of EACL 2024](https://aclanthology.org/2024.findings-eacl.52/)) | \"recorded layer activations for input texts in a specific style\", then addition into hidden layers during generation |\n| StyleVector (Zhang, Liu, Wang, Liu, Wu, Wang & Chua, arXiv [2503.05213](https://arxiv.org/abs/2503.05213), 2025-03-07) | the LLM's activation space; training-free otherwise. Reports \"a significant 8% relative improvement in personalized generation while reducing storage requirements by 1700 times over PEFT\" |\n| CHAMELEON (Zhang, Adila, Shin & Sala, arXiv [2503.01048](https://arxiv.org/html/2503.01048v3)v3, Findings of NAACL 2025) | embedding editing on MLP outputs of selected decoder layers \u2014 weights and hidden representations |\n| Hypernetwork LoRA / learned steering ([2610.03163](https://arxiv.org/html/2610.03163)) | frozen Qwen3-4B plus hidden-layer activations for injection |\n| Weightless Fine-Tuning (Zhang, Ni, Wang & Dhillon, arXiv [2608.11342](https://arxiv.org/html/2608.11342v1), 2026-08-11) | output logits **and** the ability to enable dropout at inference, i.e. stochastic forward passes through the frozen model |\n\nWeightless Fine-Tuning is the closest near-miss and deserves naming because its\npitch sounds API-compatible: it \"does not require direct access to model weights\nand operates only through stochastic forward passes and output logits\",\napproximates SFT at under 7% of its effective computation, was preferred over\nSFT in **31 of 50** human comparisons, and matches SFT's logit shift at cosine\nsimilarity 0.875 on top-10 tokens, using up to 50 training sequences per author\non LaMP. It still needs logits and runtime dropout control. The Anthropic\nMessages API provides neither.\n\nCHAMELEON is worth one more line for a transferable number: its ablation finds\nperformance degrading at 5 user-history entries and **also** declining at 25+,\nwith an optimum around 10\u201315. That is a second independent signal that the\nuseful exemplar budget is small, consistent with\n[2509.14543](https://arxiv.org/html/2509.14543v1)'s 2-to-10 sweep showing almost\nno movement.\n\nIf we ever want this family, it means running an open-weights model locally,\nwhich is a different project with different constraints. Recorded so nobody\nre-researches it.\n\n# 5. Iterative critique-and-revise with a style judge\n\n**The loop works and is API-only; the specific question the brief asked is\nunanswered in the literature.**\n\n*Iterative Critique-Refine Framework for Enhancing LLM Personalization*\n(\"PerFine\", arXiv [2510.24469](https://arxiv.org/html/2510.24469v1), Maram,\nGandhi, Yao, Akkinapalli, Dernoncourt, Wang, Rossi & Ahmed, 2025-10-28) is\ntraining-free: a generator drafts conditioned on a retrieved user profile, a\nseparate critic LLM \u2014 conditioned on **the same raw retrieved texts, not an\nabstracted description** \u2014 returns structured feedback on tone consistency,\nvocabulary match, sentence structure and topic relevance, and the generator\nrevises. Measured against PGraphRAG on the AgentSociety Challenge data:\n\n| dataset | GEval | METEOR |\n|---|---|---|\n| Yelp | 0.400 \u2192 0.441 (+10.25%) | 0.180 \u2192 0.195 |\n| Goodreads | 0.445 \u2192 0.480 (+7.8%) | 0.206 \u2192 0.216 |\n| Amazon | 0.410 \u2192 0.465 (+13.41%) | 0.190 \u2192 0.204 |\n\n\"Gains accumulate over 3\u20135 refinement rounds before leveling off\"; experiments\nfix T=5.\n\n**But it does not run the ablation we wanted.** Both generator and critic always\nsee retrieved raw samples; there is no condition isolating a sample-conditioned\ncritic against a description-conditioned critic. So \"does a judge holding the\nauthor's samples beat a judge holding a style description\" has no direct\nmeasurement I could find. The adjacent evidence is indirect and points the same\nway: reference-guided LLM judging, where human-written references act as\ncomparison anchors rather than abstract rubric criteria, is reported to mitigate\nlimitations of rubric-only evaluation; and the rubric-artifact literature (e.g.\narXiv [2609.02942](https://arxiv.org/html/2609.02942v1)) finds judges encoding\nlatent priors in rubric formulations. Both are consistent with samples beating\ndescriptions and neither measures authorial voice. Flagging this as the clearest\ngap in the survey, and one we could close ourselves cheaply.\n\nOne more reason to expect a judge to be the weak link: in Sawant's data the\nLLM judge is the metric that *most* rewards the profile (0.542 against 0.433 for\nfew-shot) while the authorship metric does not. A judge given a style\ndescription may be grading how well the output matches the description \u2014 which\nis how our 8-of-8 document came to exist.\n\n**Verbalized Sampling is the one generation-time trick that is both training-free\nand confirmed to work through a plain API.**\n[2510.01171](https://arxiv.org/html/2510.01171v4) replaces \"write X\" with \"write\n5 of X with their corresponding probabilities\"; the authors state it is\ntraining-free and requires \"no logit access\", and they tested it on GPT, Gemini,\nClaude, o3, Llama and Qwen. Measured: semantic diversity (1 \u2212 mean pairwise\ncosine similarity) up **1.6\u20132.1\u00d7** over direct prompting on poem continuation,\nstory generation and joke writing, 100 data points per task, k=5 candidates per\ncall, N=30 samples per prompt; human-rated diversity 2.39 / 3.06 / 3.01\n(poem / story / joke) against direct prompting's 1.90 / 2.74 / 1.83 on a 4-point\nscale, 90 annotators (30 per task), 90 pairs per task, inter-annotator agreement\n0.49\u20130.87, reported as a 25.7% improvement. What it measures is *diversity*, not\nauthorship fidelity. The reason to try it anyway is that the diagnosed failure\nis collapse to a generic register, and this is the cheapest published lever\nagainst that collapse: generate five candidate drafts, then pick with the\nembedding score rather than taking the first.\n\n# What I would try, ranked, against our constraints\n\nOrdered by expected value per unit of work given ~9,000 words, API-only access,\nno GPU, and a plugin as the delivery vehicle.\n\n**1. Run the held-out regeneration diff. It is already in the design and still\nhas not run.** [E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md)\nnamed it as the only check that could have caught either failure, and this survey\nsupports that from the outside: the author-facing verdict correlates with the\nbest automated metric at r = 0.244 (n = 81), and the automated metrics correlate\nwith each other at |r| < 0.07. When every instrument disagrees with the person,\nthe test is to regenerate text the operator already wrote and diff it against\nwhat they actually wrote. Cost: zero new dependencies. It is also the only test\nin the design whose answer the operator cannot dispute, because they wrote the\nanswer key.\n\n**2. Add population-matched verbatim exemplars to the generation prompt, and cut\nthe profile back to what exemplars cannot carry.** Five passages, retrieved by\n*text population* \u2014 headings for headings, paragraph prose for paragraph prose \u2014\nnever by topic. Justification: raw history beats generated profiles on every\nLaMP generation row; the profile method wins the LLM judge and the stylometry\nand loses the authorship metric; topic-similar selection measurably hurts\n(81.28% vs 95.44%); 5 exemplars performs like 10. The profile keeps\n[E0004](E0004-what-the-professional-craft-skill-could-not-say.md)'s uncountable\nseven \u2014 negative space, the hedging floor, what this writer never does \u2014 which\nno sample states. This is also the change that directly fixes\n[E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md) cause 1:\nthe corpus headings were in the training set the whole time, and putting them in\nthe prompt is strictly better than describing them. Measure it against the\nheld-out diff before believing it \u2014\n[2610.03163](https://arxiv.org/html/2610.03163) has three-shot prompting\n*losing* to zero-shot.\n\n**3. Replace the marker gate with a calibrated StyleDistance score, and keep the\nmarkers as diagnostics rather than as the gate.** `StyleDistance/styledistance`,\nroberta-base, HuggingFace, CPU, one script. Compute the ceiling (operator's\n2,302 held-out words against the 5,685 training words) and the floor (operator\nagainst other authors in the same register) once, and report every generated\ndocument as a position between them. Choose StyleDistance over LUAR because\nLUAR scores 0.03 on STEL-or-Content against StyleDistance's 0.29 and our\ngenerated documents are off-corpus-topic by construction; also because LUAR\nneeds an episode and gives no per-document vector. **Promise it as a drift\ntripwire, not an acceptance test** \u2014 r = 0.244 is the honest ceiling on what it\npredicts about the operator's reaction, and\n[E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md) is what\nhappens when a gate gets promoted to a verdict.\n\n**4. Add a critique-and-revise pass whose critic holds corpus passages, not the\nprofile.** PerFine's structure, training-free, API-only, +7.8% to +13.4% GEval,\n3\u20135 rounds then plateau. Two reasons to expect more from it here than the\npublished numbers suggest: both of\n[E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md)'s causes are\nalready stated as mechanical rules \u2014 \"if the short sentence contains a claim the\nparagraph did not make, it is not this writer's landing\", and the three heading\nshapes \u2014 and a critic can check a mechanical rule against the corpus far more\nreliably than a generator can obey a described one. Second, the\ndescription-conditioned judge is the instrument that most flattered our profile\nin Sawant's table, so swapping its context is the cheap experiment. And since\nnobody has published the sample-critic versus description-critic ablation, we\nwould be measuring something new rather than reproducing something known.\n\n**5. Try Verbalized Sampling at the drafting step, and pick with the score from\n(3).** Five candidates with stated probabilities, rank by StyleDistance against\nthe corpus, keep one. Training-free, no logit access, confirmed on Claude,\n1.6\u20132.1\u00d7 diversity. Low confidence it helps *voice* \u2014 the measured outcome is\ndiversity, not authorship \u2014 but it is an afternoon, it attacks the exact failure\nmode the field has diagnosed, and it composes with everything above.\n\n**Not recommended: fine-tuning.** No first-party Anthropic path exists; the\nBedrock path is Claude 3 Haiku in us-west-2 and requires buying Provisioned\nThroughput to serve the result; OpenAI's is closed to new users and ends\n2027-01-06; Fireworks requires a dedicated deployment. On the merits rather than\nthe logistics: the one study at our data scale plateaued at 0.69 for every model\nsize with stylometric improvement of exactly 0.00, ran no human evaluation, and\ncovered one user; and the best-controlled LoRA comparison shows style accuracy\nrising 31.0% \u2192 49.8% while quality preference falls 97.9% \u2192 38.1%. We would be\nbuying the thing our markers already measure and selling the thing the operator\nactually rejected the document for.\n\n**Not available: activation steering.** Hidden-state read/write or logits plus\nruntime dropout, in every variant. The Anthropic API exposes neither. This is a\nboundary, not a backlog item.\n\n# What I could not verify\n\n- **The LUAR paper's own retrieval numbers.** The ACL Anthology PDF extraction\n  returned corrupted text and I did not obtain the R@8 / MRR tables, the\n  per-dataset author counts, or the episode-length ablation. The LUAR numbers\n  reported above (MRR 0.5888, R@1 0.4506) come from\n  [2604.24444](https://arxiv.org/abs/2604.24444)'s own comparison, not from\n  Rivera-Soto et al.\n- **The STEL accuracies in Wegmann et al. 2022.** One PDF extraction produced a\n  table of numbers plus a model name and parameter count that contradicted the\n  model card and the known size of `roberta-base`; I discarded all of it. The\n  Wegmann figures quoted above (STEL 0.77, STEL-or-Content 0.22) are\n  StyleDistance's reported reproduction, not the original paper's own.\n- **The magnitude of RLHF's diversity reduction** in Kirk et al. The abstract\n  says \"significantly reduces... across a variety of measures\" and names no\n  number; I did not reach the results tables.\n- **Numbers from *Can Activation Steering Capture Multidimensional Authorship\n  Style?*** (arXiv [2609.04792](https://arxiv.org/pdf/2609.04792), Tran, Bao &\n  Carpuat). The PDF extraction yielded only qualitative claims. The access\n  requirement \u2014 weights and activations \u2014 is confirmed; the results are not.\n- **Together AI's minimum dataset size.** Their official data-preparation page\n  states that validation checks \"the line count exceeds the minimum\" without\n  saying what the minimum is. The widely repeated \"low hundreds of examples for\n  LoRA\" figure traces to a third-party blog, not to Together's documentation,\n  and is not reported above as fact.\n- **Whether Claude 3 Haiku fine-tuning on Bedrock is still offered in 2026.**\n  The GA announcement is dated 2024-11-01 and is primary; the AWS documentation\n  page listing currently customizable models returned no readable table on\n  fetch, and the claim that it remains the only Claude fine-tuning path appeared\n  only in secondary sources.\n- **A direct sample-conditioned versus description-conditioned style-judge\n  comparison.** I did not find one. The adjacent reference-guided-judging\n  literature points the right way but measures instruction following, not voice.\n- **Any paper testing population-matched exemplar retrieval** (headings\n  retrieved for headings). Topic-matched retrieval has a measured negative\n  result; the population-matched variant appears to be untested, which makes\n  recommendation 2 an experiment rather than an application.\n- **Peer-review status.** 2604.26460, 2608.19746, 2606.05336, 2607.29238,\n  2609.04792, 2610.03163, 2604.24444 and 2608.14843 are arXiv preprints whose\n  venue I could not confirm. 2604.26460 and 2608.19746 are two overlapping\n  papers by one independent researcher and carry more weight in this node than\n  any single unreviewed preprint comfortably should.\n\n# Citations\n\nRead 2026-11-10. Grouped by what they are used for.\n\n**The authorship gap and the method comparison**\n- Sawant, *Theory-Grounded Evaluation Exposes the Authorship Gap in LLM\n  Personalization*, arXiv [2604.26460](https://arxiv.org/abs/2604.26460)\n  (v1 2026-04-29, v2 2026-08-14)\n- Sawant, *PersonalBench: Measuring the Authorship Gap in LLM Personalization*,\n  arXiv [2608.19746](https://arxiv.org/html/2608.19746v1) (2026-08-20)\n- Wang, Tripto, Park, Li & Zhou, *Catch Me If You Can? Not Yet: LLMs Still\n  Struggle to Imitate the Implicit Writing Styles of Everyday Authors*, arXiv\n  [2509.14543](https://arxiv.org/html/2509.14543v1) (2025-09-18; Findings of\n  EMNLP 2025)\n\n**Exemplars, profiles and retrieval**\n- Patel, Andrews & Callison-Burch, *Low-Resource Authorship Style Transfer: Can\n  Non-Famous Authors Be Imitated?*, arXiv\n  [2212.08986](https://arxiv.org/html/2212.08986)v3 (2024-11-04)\n- Ju, Qiu, Zhao & Shah, *Self-supervised User Profile Generation for\n  Personalization*, arXiv [2606.05336](https://arxiv.org/html/2606.05336)\n  (2026-06-03)\n- Salemi, Mysore, Bendersky & Zamani, *LaMP: When Large Language Models Meet\n  Personalization*, arXiv [2304.11406](https://arxiv.org/abs/2304.11406)\n- Richardson et al., *Integrating Summarization and Retrieval for Enhanced\n  Personalization via Large Language Models*, arXiv\n  [2310.20081](https://ar5iv.labs.arxiv.org/html/2310.20081)\n\n**Style embeddings and stylometry**\n- Rivera-Soto, Miano, Ordonez, Chen, Khan, Bishop & Andrews, *Learning Universal\n  Authorship Representations*, [EMNLP 2021](https://aclanthology.org/2021.emnlp-main.70/);\n  code [LLNL/LUAR](https://github.com/LLNL/LUAR); checkpoint\n  [`rrivera1849/LUAR-MUD`](https://huggingface.co/rrivera1849/LUAR-MUD)\n- Wegmann, Schraagen & Nguyen, *Same Author or Just Same Topic? Towards\n  Content-Independent Style Representations*, arXiv\n  [2204.04907](https://arxiv.org/abs/2204.04907) (RepL4NLP 2022); checkpoint\n  [`AnnaWegmann/Style-Embedding`](https://huggingface.co/AnnaWegmann/Style-Embedding)\n- Wegmann & Nguyen, *Does It Capture STEL? A Modular, Similarity-based\n  Linguistic Style Evaluation Framework*,\n  [EMNLP 2021](https://aclanthology.org/2021.emnlp-main.569/)\n- Patel, Zhu, Qiu, Horvitz, Apidianaki, McKeown & Callison-Burch,\n  *StyleDistance: Stronger Content-Independent Style Embeddings with Synthetic\n  Parallel Examples*, arXiv [2410.12757](https://arxiv.org/html/2410.12757v2)v2\n  (2025-02-08); checkpoint\n  [`StyleDistance/styledistance`](https://huggingface.co/StyleDistance/styledistance)\n- Alkiek, Wegmann, Zhu & Jurgens, *Neurobiber: Fast and Interpretable Stylistic\n  Feature Extraction*, arXiv\n  [2502.18590](https://arxiv.org/html/2502.18590v1)v1 (2025-02-25); checkpoint\n  [`Blablablab/neurobiber`](https://huggingface.co/Blablablab/neurobiber)\n- Manzo, *Writing Style Similarity Reflects Academic Genealogy*, arXiv\n  [2608.14843](https://arxiv.org/html/2608.14843)\n- [`faststylometry`](https://pypi.org/project/faststylometry/) (PyPI);\n  [`stylo`](https://cran.r-project.org/web/packages/stylo/stylo.pdf) 0.6.3\n  (CRAN, GPL-3)\n\n**The metric-versus-person gap**\n- Baumler, Bao, Nghiem, Yang, Carpuat & Daum\u00e9 III, *Can You Make It Sound Like\n  You? Post-Editing LLM-Generated Text for Personal Style*, arXiv\n  [2604.24444](https://arxiv.org/abs/2604.24444) (2026-04-27)\n\n**Fine-tuning at small scale, and the hosted paths**\n- Chakravorty, *Small Is Enough: Per-User Style Rewriting of AI-Edited Text via\n  LoRA Adapters*, arXiv [2607.29238](https://arxiv.org/html/2607.29238v1)\n  (2026-07-31)\n- Popp, Liu, Sinhamahapatra & Niehues, *Predicting Steering Vectors and Adapter\n  Weights for Few-Shot Author-Style Transfer*, arXiv\n  [2610.03163](https://arxiv.org/html/2610.03163) (2026-10-02)\n- *Style-Debiased DPO*, arXiv [2609.16532](https://arxiv.org/html/2609.16532v1)\n- OpenAI, [Supervised fine-tuning](https://developers.openai.com/api/docs/guides/supervised-fine-tuning)\n  (official docs)\n- AWS, [Fine-tuning for Anthropic's Claude 3 Haiku model in Amazon Bedrock is\n  now generally available](https://aws.amazon.com/blogs/aws/fine-tuning-for-anthropics-claude-3-haiku-model-in-amazon-bedrock-is-now-generally-available/)\n  (2024-11-01)\n- Fireworks AI, [Supervised Fine-Tuning (SFT) with LoRA](https://docs.fireworks.ai/fine-tuning/supervised-fine-tuning)\n  (official docs)\n- Together AI, [Data preparation](https://docs.together.ai/docs/fine-tuning/data-preparation)\n  (official docs)\n\n**Steering and the access boundary**\n- Konen, Jentzsch, Diallo, Sch\u00fctt, Bensch, El Baff, Opitz & Hecking, *Style\n  Vectors for Steering Generative Large Language Models*,\n  [Findings of EACL 2024](https://aclanthology.org/2024.findings-eacl.52/)\n- Zhang, Liu, Wang, Liu, Wu, Wang & Chua, *Personalized Text Generation with\n  Contrastive Activation Steering*, arXiv\n  [2503.05213](https://arxiv.org/abs/2503.05213) (2025-03-07)\n- Zhang, Adila, Shin & Sala, *Personalize Your LLM: Fake it then Align it*\n  (CHAMELEON), arXiv [2503.01048](https://arxiv.org/html/2503.01048v3)v3\n  (Findings of NAACL 2025)\n- Zhang, Ni, Wang & Dhillon, *Weightless Fine-Tuning: Personalizing LLMs via\n  Logit-Space Transport*, arXiv\n  [2608.11342](https://arxiv.org/html/2608.11342v1) (2026-08-11)\n\n**Critique loops, judges, and mode collapse**\n- Maram, Gandhi, Yao, Akkinapalli, Dernoncourt, Wang, Rossi & Ahmed, *Iterative\n  Critique-Refine Framework for Enhancing LLM Personalization* (PerFine), arXiv\n  [2510.24469](https://arxiv.org/html/2510.24469v1) (2025-10-28)\n- *Judging LLM-as-a-Judge: Concerning Rubric Artifacts in LLM-based Automated\n  Text Generation Evaluation*, arXiv\n  [2609.02942](https://arxiv.org/html/2609.02942v1)\n- Zhang, Yu, Chong, Sicilia, Tomz, Manning & Shi, *Verbalized Sampling: How to\n  Mitigate Mode Collapse and Unlock LLM Diversity*, arXiv\n  [2510.01171](https://arxiv.org/html/2510.01171v4)v4\n- Kirk, Mediratta, Nalmpantis, Luketina, Hambro, Grefenstette & Raileanu,\n  *Understanding the Effects of RLHF on LLM Generalisation and Diversity*, arXiv\n  [2310.06452](https://arxiv.org/abs/2310.06452) (ICLR 2024)\n\n**Style-transfer systems recorded for completeness, all GPU-bound**\n- Khan, Wang, Hager & Andrews, *Learning to Generate Text in Arbitrary Writing\n  Styles* (StyleMC), arXiv\n  [2312.17242](https://arxiv.org/html/2312.17242v2)v2 (2024-03-04) \u2014 ~16 samples\n  averaging 68 words per author; UAR 0.849 against GPT-4's 0.767 and a human\n  reference of 0.852, on 800 Reddit authors; needs token-level logit rescoring,\n  \"commodity hardware (e.g., a single GPU) is sufficient\"\n- Horvitz, Patel, Singh, Callison-Burch, McKeown & Yu, *TinyStyler: Efficient\n  Few-Shot Text Style Transfer with Authorship Embeddings*, arXiv\n  [2406.15586](https://arxiv.org/html/2406.15586v2)v2 (2024-11-07) \u2014 T5-Large,\n  800M parameters, conditions on style embeddings, 16 target examples at\n  inference; authorship-transfer joint 0.69 with reranking against GPT-4's 0.68;\n  checkpoint [`tinystyler/tinystyler`](https://huggingface.co/tinystyler/tinystyler);\n  0.47s per example on an A100\n", "mtime": "2026-11-10T17:06:06+00:00"}, {"path": "knowledge-catalog/reference/E0008-the-profile-did-not-beat-the-control-and.md", "meta": {"id": "E0008", "type": "evidence", "title": "The profile did not beat the control and the operator scored at chance", "description": "First held-out regeneration diff, six blind trials: the profile ranked above the no-guidance control in 2 of 6, the operator identified his own writing 2 of 6, and his own published prose had the worst mean rank of the three arms.", "timestamp": "2026-11-10", "tags": ["voice", "verification", "experiment", "findings"], "status": "active"}, "body": "\nThe check [D0018](../decisions/D0018-a-voice-profile-states-its-claims-checkably.md)\ndesigned and nothing had run. Six blind trials, one operator, 2026-11-10.\n\n# Setup\n\nTwo Codecov articles the generating agents had never seen, written by the\noperator in January 2023. Content-only briefs by a separate agent \u2014 every fact,\nnumber and product term, in order, **no headings and no phrasings**, verified\nmechanically (the first attempt leaked 10 of 13 headings and was rewritten).\n\nThree arms, generated by agents with no exposure to the operator's corpus:\n\n| arm | input |\n|---|---|\n| control | the brief alone |\n| profile | the brief + `voice-professional/SKILL.md` + `professional.md` \u2014 what ships |\n| real | what the operator published |\n\nSix trials: headings-only, opening ~90 words, closing ~90 words, per article.\nEach shuffled independently. Markup normalised across arms. The operator ranked\neach trial *mine / second / worst* with the key sealed until all six were in.\n\n# Result\n\n| arm | mean rank | ranks |\n|---|---|---|\n| control | **1.83** | 3, 1, 1, 3, 1, 2 |\n| profile | 2.00 | 2, 2, 2, 1, 2, 3 |\n| the operator's own writing | **2.17** | 1, 3, 3, 2, 3, 1 |\n\n- **The profile ranked above the control in 2 of 6 trials.** Two-sided exact\n  binomial p = 0.688. No detectable difference, and the direction favours the\n  arm that received no style guidance at all.\n- **The operator identified his own writing in 2 of 6 trials.** Chance is 2 of\n  6.\n- **His own published prose ranked worst in 3 of 6 trials** and carried the\n  worst mean rank of the three arms.\n\n# The one pattern that separated\n\n| trial type | identified own | rank of his real text | mean |\n|---|---|---|---|\n| headings (n = 2) | 1/2 | 1st, 2nd | **1.50** |\n| prose excerpts (n = 4) | 1/4 | 3rd, 3rd, 3rd, 1st | **2.50** |\n\nOn headings he placed his own writing first and second. On 90-word prose\nexcerpts he ranked it last three times in four.\n\nThis agrees with [E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md),\nwhere the rejection of a generated document was delivered as a complaint about\na heading. The working hypothesis it supports: **heading style is legible to\nthis author as his own; prose rhythm at excerpt scale is not.** If that holds,\n\"it sounds like you doing an impression of me\" was substantially a heading\njudgment, and the project has been weighting the wrong signal.\n\nTwo unprompted reasons he gave are worth more than the rankings, because both\nname something no marker measures:\n\n- A version placed worst \"primarily because the bullet points are very long\".\n  The profile has a bullet *share* marker and nothing about bullet *length*.\n- A heading set placed worst on one heading, \"Where to install it and what you\n  need to do\" \u2014 which names two subjects joined by *and*. Every heading in his\n  corpus names one. The profile requires a heading to name its subject and does\n  not require it to name only one.\n\n# What this does and does not support\n\n**It cannot show the profile is useless.** With n = 6 and a null of 0.5, a clean\n6/6 sweep is the *minimum* for one-sided p < 0.05. This run has no power to\ndetect a modest effect. It rules out a large one.\n\n**It does undermine the instrument.** The operator ranked his own writing below\ngenerated text more often than not, which means the question he was answering\nwas not purely \"which is mine\". [E0007](E0007-state-of-the-art-for-reproducing-a-specific.md)\npredicted exactly this from outside: author self-judgment correlates with the\nbest authorship metric at r = 0.244 (n = 81, pre-registered), and in the same\nstudy participants rated post-edited text as *no less* representative of their\nown style than their unassisted writing (p = .9062). This session reproduced\nthat finding on a sample of one.\n\nConfounds named rather than waved off: the test articles are three years old and\nthe voice may have moved; the three trials within an article are not\nindependent, since recognising the content in an opening carries into the\nclosing; excerpts discard whole-document structure, which is part of why the\nheadings trial exists separately.\n\n# Consequences\n\n- No evidence supports [D0013](../decisions/D0013-the-craft-ships-generic-and-the-voice-is.md)'s\n  assumption that a generated *description* is the right artifact. The decision\n  is not overturned on n = 6, but it is now unsupported rather than merely\n  untested, and [T0017](../../tasks/voice/T0017-experiment-population-matched-exemplar-retrieval-versus-a-described.md)\n  becomes the more urgent experiment.\n- Blind operator judgment is not a sufficient primary instrument for prose. It\n  retains value for headings, where it discriminated.\n- Two candidate markers arrived free: maximum bullet length, and one subject per\n  heading.\n\n# Citations\n\n- Trial responses and sealed key, 2026-11-10, recorded before unsealing\n- [T0016](../../tasks/voice/T0016-run-the-held-out-regeneration-diff-against-a.md)\n- [E0007](E0007-state-of-the-art-for-reproducing-a-specific.md) for the\n  r = 0.244 and p = .9062 figures (Baumler et al., arXiv 2604.24444)\n", "mtime": "2026-11-10T17:47:52+00:00"}, {"path": "knowledge-catalog/reference/agent-skills/domain.md", "meta": {}, "body": "# Domain docs\n\nSingle-context. Everything lives in `brain/`. The host repository may carry its own agent-facing\nfiles (`CLAUDE.md`, `CONTEXT.md`); those are the team's and are read, not written, unless asked.\n\n## Before exploring, read\n\n- `brain/knowledge-catalog/glossary.md` \u2014 the project glossary, playing the `CONTEXT.md` role.\n- `brain/knowledge-catalog/decisions/` \u2014 decisions as OKF `decision` files.\n\nIf a file does not exist, proceed silently.\n\n## Where new entries go\n\n- A resolved term \u2192 `brain/knowledge-catalog/glossary.md`, in the `CONTEXT.md` style: term, tight\n  definition, an `_Avoid_` list where a near-synonym would mislead.\n- A decision \u2192 `brain/knowledge-catalog/decisions/NNNN-<slug>.md` from\n  [templates/decision.md](templates/decision.md); next number after the highest present.\n- A spec \u2192 `brain/knowledge-catalog/specs/<slug>.md` from [templates/spec.md](templates/spec.md).\n- Research or a stack fact \u2192 `brain/knowledge-catalog/reference/<slug>.md`, `type: context`.\n- A plan \u2192 `brain/plans/<YYYY-MM-DD>-<slug>.md`, `type: plan`.\n\n## Use the glossary's vocabulary\n\nName domain concepts as the glossary defines them. If a concept is missing, either the language is\nbeing invented \u2014 reconsider \u2014 or there is a gap, so add it.\n\n## Flag conflicts\n\nIf output contradicts a decision in the catalog, say so explicitly rather than silently overriding\nit. A decision that should change is **superseded** on the record, not quietly ignored.\n", "mtime": "2026-11-08T18:32:51+00:00"}, {"path": "knowledge-catalog/reference/agent-skills/index.md", "meta": {}, "body": "# Agent skills\n\nThe adaptation layer. The engineering skills in `.claude/skills/` are written generically against\n\"the issue tracker\" and \"domain docs\"; these three documents say what those mean here, so the\nskills need no local paths baked into them.\n\n* [tracker.md](tracker.md) \u2014 `brain/tasks/` as the tracker: layout, task frontmatter,\n  operations, claims, the frontier\n* [triage-labels.md](triage-labels.md) \u2014 the five triage roles as `status` plus a `wontfix` flag\n* [domain.md](domain.md) \u2014 where a term, decision, spec, plan or research note goes\n* [templates/](templates/) \u2014 the OKF files to start from\n\nSwapping these three documents retargets the whole skill set at a different tracker without\nediting a single skill.\n", "mtime": "2026-11-08T18:03:16+00:00"}, {"path": "knowledge-catalog/reference/agent-skills/tracker.md", "meta": {}, "body": "# The tracker: brain/tasks (local OKF markdown)\n\nTasks live as markdown files under `brain/tasks/`, in Google's Open Knowledge Format: YAML\nfrontmatter plus a markdown body, linked with relative markdown links. The files are the tracker;\nthere is no service behind them.\n\nThe word is **task**, everywhere. \"Ticket\" and \"issue\" are the same thing said two other ways,\nand a project that describes one concept three ways is the thing `/domain-modeling` exists to\ncatch.\n\n## Layout\n\n```\nbrain/tasks/\n\u251c\u2500\u2500 README.md\n\u251c\u2500\u2500 TODO.md                      # the loose to-do list; not a tracker\n\u251c\u2500\u2500 misc/                        # one-off tasks belonging to no initiative\n\u2502   \u2514\u2500\u2500 T0001-<slug>.md\n\u2514\u2500\u2500 <initiative>/                # one folder per planned thing\n    \u251c\u2500\u2500 index.md                 # ordered list of the tasks, with status\n    \u251c\u2500\u2500 map.md                   # optional: wayfinder map\n    \u2514\u2500\u2500 T0002-<slug>.md          # one task per file\n```\n\nIds are **global and flat** (D0003): `T0002` is one task in this brain, wherever it lives.\nAllocate with `brain/bin/new task \"<title>\" --initiative <folder>`; never pick a number by hand.\n\nThe number does **not** encode dependency order \u2014 `blocked_by` carries that, and `brain/bin/status`\ncomputes the frontier from it. The old convention that \"a task's blockers always have lower\nnumbers\" was enforced by nothing and broken by any renumbering. Never put more than one task in\na file.\n\n## Task file\n\nTemplate: [templates/task.md](templates/task.md). Frontmatter:\n\n| Field | Required | Values |\n|---|---|---|\n| `id` | yes | `T` plus four digits, from `brain/bin/new` |\n| `type` | yes | `task` |\n| `title` | yes | short imperative title |\n| `description` | yes | one sentence |\n| `status` | yes | `Not Ready` \u00b7 `Ready for Development` \u00b7 `In Progress` \u00b7 `Testing` \u00b7 `Complete` \u00b7 `Delivered` \u00b7 `Superseded` |\n| `initiative` | yes | the folder name |\n| `blocked_by` | yes | list of relative links to blocking task files, or `[]` |\n| `category` | recommended | `bug` \u00b7 `enhancement` |\n| `wontfix` | optional | `true` when the request was rejected; status stays as it was |\n| `claimed_by` / `claimed_at` | set on claim | worker name as `ListAgents` shows it; ISO 8601 |\n| `spec` | when one exists | relative link to the spec \u2014 this is the task's lineage edge, so a reverse walk cannot reach Intent without it |\n| `wayfinder` | optional | `research` \u00b7 `prototype` \u00b7 `grilling` \u00b7 `task` \u2014 set on map child tickets |\n| `pr` | optional | list of PR URLs |\n| `timestamp` | yes | creation date |\n| `tags` | recommended | short strings |\n\nStatus meanings: **Not Ready** needs triage or more information; **Ready for Development** is\nfully specified and claimable; **In Progress** is claimed; **Testing** has code pushed and is\nunder review; **Complete** is merged; **Delivered** is live; **Superseded** is built and then\nremoved \u2014 the code is in the history and nobody is going to pick it up.\n\n## Who moves a status\n\nEvery transition has exactly one owner (D0007). A transition with no owner does not happen,\nwhich is how `Testing \u2192 Complete` used to require the operator to ask for it by hand.\n\n| Transition | Owner | Trigger |\n|---|---|---|\n| `Not Ready` \u2192 `Ready for Development` | `/triage` | an agent brief is written |\n| `Ready for Development` \u2192 `In Progress` | `/implement` | the claim |\n| `In Progress` \u2192 `Testing` | `/implement` | the branch is pushed |\n| `Testing` \u2192 `Complete` | `/spec-review` | the reverse walk passed |\n| `Complete` \u2192 `Delivered` | the commit hook | merged and deployed |\n| any \u2192 `Superseded` | `/grill-change` or `/audit` | decided |\n\n`brain/bin/reconcile` reports where a status and the repository disagree; `/audit` resolves what\nit cannot judge. Neither changes an inferred status without an answer.\n\nBody headings: `# What to build`, `# Acceptance criteria`, `# Out of scope`, `# Log`. Comments,\ntriage notes and agent briefs append under `# Log` as `## YYYY-MM-DD \u2014 <who>` entries, newest\nlast.\n\n## Operations\n\n- **Create an issue**: write `brain/tasks/<initiative>/NNN-<slug>.md` from the template, add it to\n  the initiative `index.md`.\n- **Read an issue**: read the file. References are paths; \"subcontractors 003\" means\n  `brain/tasks/subcontractors/003-*.md`.\n- **List issues**: `brain/bin/status [initiative]`, or scan frontmatter.\n- **Comment**: append under `# Log`.\n- **Change state**: edit `status`; see [triage-labels.md](triage-labels.md) for the role mapping.\n- **Close**: set `status: Complete`, or add `wontfix: true` with a `# Log` entry giving the reason.\n- **Claim**: read, confirm `Ready for Development` and no `claimed_by`, set `status: In Progress`,\n  `claimed_by`, `claimed_at`, write, then **re-read to confirm**. Claim first, work second. Then\n  open `brain/work/<initiative>/<worker>.md` and journal.\n- **Frontier**: tasks that are `Ready for Development`, unclaimed, and whose every `blocked_by`\n  target is `Complete` or `Delivered`; lowest number first. `brain/bin/status` computes it.\n\n## When a skill says \"publish to the issue tracker\"\n\nWrite the task files. Specs go to `brain/knowledge-catalog/specs/` and the initiative folder links\nto them.\n\n## When a skill says \"fetch the relevant ticket\"\n\nRead the task file at the given path or resolved number.\n\n## Wayfinding operations\n\nFor the `wayfinder` skill, which plans by resolving decisions rather than by slicing a build.\n\n- **Map**: `brain/tasks/<initiative>/map.md`, with the Destination / Notes / Decisions-so-far /\n  Not-yet-specified / Out-of-scope body. `map.md` is reserved \u2014 no frontmatter required.\n- **Child ticket**: a numbered task file with `wayfinder: research | prototype | grilling | task`\n  in its frontmatter and the question under `# Question`.\n- **Blocking**: `blocked_by`. Unblocked when every blocker is `Complete`.\n- **Frontier / claim**: as above.\n- **Resolve**: append the answer under `# Answer`, set `status: Complete`, then add a one-line\n  pointer to the map's Decisions-so-far.\n", "mtime": "2026-11-08T18:03:16+00:00"}, {"path": "knowledge-catalog/reference/agent-skills/triage-labels.md", "meta": {}, "body": "# Triage labels\n\nThe skills speak in five canonical triage roles. There are no labels here; roles map onto the task\nfile's `status` field and a `wontfix` flag.\n\n| Role | In this tracker |\n|---|---|\n| `needs-triage` | `status: Not Ready`, no triage notes in `# Log` yet |\n| `needs-info` | `status: Not Ready`, latest `# Log` entry is a Triage Notes block with open questions |\n| `ready-for-agent` | `status: Ready for Development`, latest `# Log` entry is an Agent Brief |\n| `ready-for-human` | `status: Ready for Development`, `# Log` notes why it cannot be delegated |\n| `wontfix` | `wontfix: true` plus a `# Log` entry giving the reason; status unchanged |\n\nCategory roles (`bug`, `enhancement`) go in the `category` field.\n\nThe remaining statuses \u2014 `In Progress`, `Testing`, `Complete`, `Delivered` \u2014 are lifecycle, not\ntriage. Triage never sets them.\n", "mtime": "2026-11-08T18:03:16+00:00"}, {"path": "knowledge-catalog/reference/index.md", "meta": {}, "body": "# Reference\n\n**Evidence**: how things actually are, as opposed to how they were decided to\nbe. Stack facts, measurements, gotchas, research notes, and what a review or\nan audit found.\n\nAn evidence node that corrects something upstream carries `amends:`; one that\nrecords a looking-back pass carries `reviewed:`; one that was given rather\nthan gathered carries `resource:`. A plain measurement carries none.\n\n| id | Status | Title |\n|---|---|---|\n| [E0004](E0004-what-the-professional-craft-skill-could-not-say.md) | active | What the professional craft skill could not say without knowing the writer |\n| [E0005](E0005-markers-are-genre-sensitive-and-the-checker-must.md) | active | Markers are genre-sensitive and the checker must read paragraph prose |\n| [E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md) | active | The operator rejected a profile that passed every marker |\n| [E0007](E0007-state-of-the-art-for-reproducing-a-specific.md) | active | State of the art for reproducing a specific person's writing voice |\n| [E0008](E0008-the-profile-did-not-beat-the-control-and.md) | active | The profile did not beat the control and the operator scored at chance |\n", "mtime": "2026-11-10T17:47:19+00:00"}, {"path": "knowledge-catalog/specs/index.md", "meta": {}, "body": "# Specs\n\n**Approach.** Feature specs, in the shape `/to-spec` writes and `/to-tasks`\nconsumes. A spec carries `serves:` pointing at the goal it pursues; that edge\nis what lets a reverse walk terminate in Intent.\n\n*(none yet \u2014 `brain/bin/new spec \"<feature>\"`)*\n", "mtime": "2026-11-08T18:03:16+00:00"}, {"path": "plans/index.md", "meta": {}, "body": "# Plans\n\nHow things get built: implementation plans, sequencing, and the reasoning\nbehind an approach. A plan carries `serves:` pointing at the goal it pursues.\n\nPlans are **not** decisions. A decision says what we chose and why; a plan\nsays how we intend to carry it out, and is superseded by what actually\nshipped rather than deleted, so the gap between intent and outcome stays\nvisible.\n\n*(none yet \u2014 `brain/bin/new plan \"<what it builds>\"`)*\n", "mtime": "2026-11-08T18:03:15+00:00"}, {"path": "tasks/README.md", "meta": {}, "body": "# tasks\n\nThe tracker. One OKF `task` file per task, under one folder per initiative.\nIds are global and flat (`T0042`) and are allocated by `brain/bin/new task`;\ndependency order lives in `blocked_by`, not in the number. The conventions are\nin [../knowledge-catalog/reference/agent-skills/tracker.md](../knowledge-catalog/reference/agent-skills/tracker.md).\n\nRun `brain/bin/status [initiative]` for the task table and the claimable\nfrontier.\n\nInitiatives:\n\n* *(none yet \u2014 `brain/bin/new task \"<title>\" --initiative <name>`)*\n\n`TODO.md` is the loose list of things to do. It is not a tracker and nothing\nreads it programmatically.\n", "mtime": "2026-11-08T18:03:28+00:00"}, {"path": "tasks/TODO.md", "meta": {}, "body": "# TODO\n\nLoose list. Promote anything real into a task file under an initiative.\n", "mtime": "2026-11-08T18:03:15+00:00"}, {"path": "tasks/misc/index.md", "meta": {}, "body": "# misc\n\nTasks for the **misc** initiative. `brain/bin/status misc` shows what is claimable now.\n\n*(none yet \u2014 `brain/bin/new task \"<title>\" --initiative misc`)*\n", "mtime": "2026-11-08T18:03:15+00:00"}, {"path": "tasks/voice/T0011-ship-the-plugin-skeleton-so-the-library-installs.md", "meta": {"id": "T0011", "type": "task", "title": "Ship the plugin skeleton so the library installs", "description": "The repository becomes its own Claude Code marketplace, so the register skills can be installed and exercised through the path a real adopter uses.", "status": "Testing", "category": "enhancement", "initiative": "voice", "blocked_by": [], "timestamp": "2026-11-09", "tags": ["plugin", "adoption", "distribution"]}, "body": "\n# What to build\n\nSomeone who has never seen this repository can add it as a marketplace,\ninstall the plugin, and have the register skills present in every project they\nopen \u2014 with nothing copied into any project and no profile required.\n\nConcretely: `.claude-plugin/plugin.json` naming the plugin and listing its\nskill paths, `.claude-plugin/marketplace.json` making the repository its own\nmarketplace, and the three register skill directories the manifest points at.\n\nThe skills may be stubs at this point. The thing being built is the install\npath, and [D0019](../../knowledge-catalog/decisions/D0019-humanize-me-ships-as-a-claude-code-plugin.md)\nmakes it the only one there is \u2014 so it has to work before any content written\nfor it can be exercised the way an adopter will meet it.\n\n# Acceptance criteria\n\n- [x] `.claude-plugin/plugin.json` validates and lists every skill directory\n      that holds a written skill, with no path naming a directory that does not\n      (amended \u2014 see Log)\n- [x] `.claude-plugin/marketplace.json` present, so the repository needs no\n      third-party marketplace to be installable\n- [x] The three register directories exist with the names the manifest will use\n- [x] Nothing is written into any host project: no `.claude/skills` symlink and\n      no copied skill directory, per\n      [D0019](../../knowledge-catalog/decisions/D0019-humanize-me-ships-as-a-claude-code-plugin.md)\n- [x] A README section states the install command\n\n# Out of scope\n\n- The craft content of any register skill. That is\n  [T0012](T0012-write-the-professional-register-craft-skill.md).\n- The generator, the profile format and the marker checker.\n- Publishing to the official marketplace. Self-hosted is the whole point.\n\n# Log\n\n## 2026-11-09 \u2014 built, acceptance criteria amended\n\n`.claude-plugin/plugin.json` and `.claude-plugin/marketplace.json` written and\nvalidated as JSON; `marketplace.json` uses `\"source\": \"./\"`, so the repository\nis its own marketplace with no URL to go stale.\n\n**Criterion amended rather than quietly satisfied.** It originally asked the\nmanifest to list every skill directory *that exists*, and all three to exist.\nBoth halves held, so the manifest would have listed `voice-casual` and\n`voice-research` \u2014 which have no craft written. A stub skill that loads and\nproduces nothing useful is worse than an absent one, and it would have\ncontradicted [D0015](../../knowledge-catalog/decisions/D0015-a-voice-profile-is-optional-and-the-skills.md),\nwhich promises every register skill produces useful prose. So the directories\nexist and carry a `PLACEHOLDER.md` saying what the register is and that the\ncraft is unwritten, and the manifest lists only `voice-professional`. Adding a\nregister is one `SKILL.md` plus one manifest line.\n\n`repository`, `homepage` and `license` are **omitted** from `plugin.json`, and\nthe README's install command is written as `<owner>/humanize-me`. There is no\ngit remote and no LICENSE file, so asserting any of them would have put an\nunchecked claim in a manifest \u2014 which is\n[D0001](../../example/knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)\napplied to packaging. Both need deciding before a first release.\n\n## 2026-11-09 \u2014 licence gap closed, remote still open\n\nThe `license` omission recorded above is resolved by\n[T0014](T0014-license-the-project-mit-and-complete-the-plugin.md): MIT, with a\nfile backing it. `repository` and `homepage` stay omitted \u2014 there is still no\ngit remote, and the README's install command still reads `<owner>/humanize-me`.\n", "mtime": "2026-11-09T17:40:25+00:00"}, {"path": "tasks/voice/T0012-write-the-professional-register-craft-skill.md", "meta": {"id": "T0012", "type": "task", "title": "Write the professional register craft skill", "description": "The first register skill, craft only and profile-free, so the library does something useful before any corpus exists and the profile format has real gaps to be designed against.", "status": "Testing", "category": "enhancement", "initiative": "voice", "blocked_by": [], "timestamp": "2026-11-09", "tags": ["voice", "registers", "craft"]}, "body": "\n# What to build\n\nAn agent asked to write something at professional warrant \u2014 a message that\nstakes the writer's judgment and owes the reader the reasoning behind it \u2014\nproduces prose that reads as a person's considered position rather than as an\nassistant's summary. With no profile present and nothing known about who is\nwriting.\n\nThe substance is the craft: what agent prose does wrong specifically at this\nregister, and what a claim resting on stated judgment has to carry.\n[D0014](../../knowledge-catalog/decisions/D0014-registers-are-organized-by-burden-of-proof-not.md)\nsets the axis \u2014 the failure to fix is uniform unearned confidence, hedging what\nshould be owned and asserting what should be qualified \u2014 not formality.\n\nThis is deliberately the first register written. It is the one where the\nfailure is worst, and writing it is how the profile format gets designed\nagainst real gaps rather than imagined ones: whatever the skill cannot say\nwithout knowing the writer is, by definition, what the profile has to carry.\n\n# Acceptance criteria\n\n- [x] The skill produces usable prose with no profile present, and says which\n      mode it is in, per\n      [D0015](../../knowledge-catalog/decisions/D0015-a-voice-profile-is-optional-and-the-skills.md)\n- [x] It states what a claim at this register rests on before it states any\n      style preference, per\n      [D0014](../../knowledge-catalog/decisions/D0014-registers-are-organized-by-burden-of-proof-not.md)\n- [x] It selects on what the claims require, never on the medium the prose will\n      be sent through\n- [x] It names no particular person and asserts nothing about the operator, per\n      [D0013](../../knowledge-catalog/decisions/D0013-the-craft-ships-generic-and-the-voice-is.md)\n- [x] It declares a human reader, per\n      [D0011](../../knowledge-catalog/decisions/D0011-only-prose-with-a-human-reader-is-in.md)\n- [x] It resolves a profile project-first then user-scope, and proceeds on a\n      miss, per\n      [D0019](../../knowledge-catalog/decisions/D0019-humanize-me-ships-as-a-claude-code-plugin.md)\n- [x] The gaps it could not fill without knowing the writer are written down,\n      as the input to the profile format spec\n\n# Out of scope\n\n- The casual and research registers. Written after this one settles the shape.\n- The profile format itself. This task produces the requirements for it, not\n  the format.\n- The generator and the marker checker.\n\n# Log\n\n## 2026-11-09 \u2014 written\n\n`skills/voice-professional/SKILL.md`, 146 lines, craft only and profile-free.\n\nIt opens on what a claim at this register rests on \u2014 the writer's judgment,\nstated as judgment and owned \u2014 before any style guidance, per\n[D0014](../../knowledge-catalog/decisions/D0014-registers-are-organized-by-burden-of-proof-not.md),\nand its selection section routes on what the claims require with an explicit\nnote that medium and register are independent. Profile resolution is\nproject-then-user per\n[D0019](../../knowledge-catalog/decisions/D0019-humanize-me-ships-as-a-claude-code-plugin.md),\na miss is declared rather than silent per\n[D0015](../../knowledge-catalog/decisions/D0015-a-voice-profile-is-optional-and-the-skills.md),\nand the description names a human reader and excludes agent-facing text per\n[D0011](../../knowledge-catalog/decisions/D0011-only-prose-with-a-human-reader-is-in.md).\n\nTwelve named failures, all one failure underneath \u2014 confidence that floats free\nof warrant \u2014 then seven positive moves and a three-question check.\n\nThe gaps it could not fill without knowing the writer are\n[E0004](../../knowledge-catalog/reference/E0004-what-the-professional-craft-skill-could-not-say.md).\nTwo findings there bear on decisions already on record: the countable half of a\nprofile is the minority of the value, which cautions against reading\n[D0018](../../knowledge-catalog/decisions/D0018-a-voice-profile-states-its-claims-checkably.md)\nas \"countably\" rather than \"checkably\"; and the skill's own conflict rule \u2014\nwarrant beats profile \u2014 is too blunt for hedging *level*, where it would\nflatten every user toward one setting. Neither is resolved here.\n\nLeft for `/spec-review`: whether this skill is any good is a judgment about\nprose, and nothing in it has been exercised against a real writing request yet.\n", "mtime": "2026-11-09T17:19:49+00:00"}, {"path": "tasks/voice/T0013-restate-the-hedging-rules-as-ownership-and-falsifiability.md", "meta": {"id": "T0013", "type": "task", "title": "Restate the hedging rules as ownership and falsifiability", "description": "The professional register skill stops legislating how much a writer hedges and requires only that judgments have a holder and confidences could be wrong.", "status": "Testing", "category": "bug", "initiative": "voice", "blocked_by": [], "timestamp": "2026-11-09", "tags": ["voice", "craft", "registers"]}, "body": "\n# What to build\n\nAn agent following the professional register skill leaves a heavily hedging\nwriter's voice intact while still catching the unowned, unfalsifiable claim\nthat the register exists to fix.\n\nThree places in `skills/voice-professional/SKILL.md` encode the old rule:\n\n- the conflict rule in **Load the voice profile**, which says warrant beats\n  profile and treats hedging as warrant\n- **Hedging what you should own**, which states the prohibition as a surface\n  quantity\n- **Stacked hedges**, which counts qualifiers\n\n[D0020](../../knowledge-catalog/decisions/D0020-craft-governs-ownership-and-falsifiability-a-profile-governs.md)\nreplaces all three.\n\n# Acceptance criteria\n\n- [x] The conflict rule states that craft governs ownership and falsifiability\n      and that hedge quantity and wording belong to the profile\n- [x] No rule in the skill counts hedges or sets a hedging level\n- [x] The failing example is failed for the stated reason \u2014 no holder, nothing\n      falsifiable \u2014 and not for carrying a hedge\n- [x] A hedge naming what the writer is unsure of passes at any quantity, and\n      the skill says so with an example\n- [x] The pre-send check asks the two questions D0020 names\n- [x] `voice-casual` and `voice-research` placeholders record that they inherit\n      this rule before they are written\n\n# Out of scope\n\n- The casual and research craft. They inherit the rule, not the prose.\n- The profile format. [D0020](../../knowledge-catalog/decisions/D0020-craft-governs-ownership-and-falsifiability-a-profile-governs.md)\n  says hedge quantity is a profile concern; how the profile states it is the\n  format spec's problem.\n- [E0004](../../knowledge-catalog/reference/E0004-what-the-professional-craft-skill-could-not-say.md)'s\n  other finding, that the countable half of a profile is the minority of its\n  value. Unresolved and separate.\n\n# Log\n\n## 2026-11-09 \u2014 applied\n\nFive edits to `skills/voice-professional/SKILL.md`:\n\n- the conflict rule now names the two things craft asks of a claim and hands\n  everything else, hedge quantity and wording included, to the profile\n- *Hedging what you should own* became *Claims nobody holds, at confidences\n  nobody could be wrong about*, and says outright that the failure is not the\n  hedge \u2014 with the heavily hedged version of the same claim shown passing\n- *Stacked hedges* became *Qualifiers that leave nothing behind*, failing the\n  example for leaving no falsifiable claim rather than for carrying three\n  qualifiers, and showing three qualifiers that do say something\n- *Over-qualifying the obvious* became *Qualification that doesn't track the\n  uncertainty* \u2014 about tracking rather than amount, so it no longer sets a level\n- the pre-send check is four questions, the first two being the craft, marked\n  as the ones no voice excuses\n\nNothing in the skill counts hedges or sets a hedging level now, checked by\ngrep for the old formulations.\n\nThe `voice-casual` and `voice-research` placeholders each record that they\ninherit [D0020](../../knowledge-catalog/decisions/D0020-craft-governs-ownership-and-falsifiability-a-profile-governs.md)\nbefore their craft is written, so the rule does not have to be rediscovered\ntwice.\n\nOne thing worth noting: the skill's opening section already stated the rule\ncorrectly \u2014 *\"a holder and a confidence you could be wrong about\"* \u2014 and the\nfailure list contradicted it four sections later. The decision was already\nlatent in the skill; what was wrong was the prose written against it.\n", "mtime": "2026-11-09T17:34:33+00:00"}, {"path": "tasks/voice/T0014-license-the-project-mit-and-complete-the-plugin.md", "meta": {"id": "T0014", "type": "task", "title": "License the project MIT and complete the plugin manifest", "description": "The repository carries an MIT LICENSE scoped to its own work, and plugin.json asserts the licence now that there is a file backing the claim.", "status": "Testing", "category": "enhancement", "initiative": "voice", "blocked_by": [], "timestamp": "2026-11-09", "tags": ["plugin", "licensing", "release"]}, "body": "\n# What to build\n\nSomeone who installs or forks this repository can tell what they are allowed to\ndo with it, and the plugin manifest's `license` field is backed by a file\nrather than asserted.\n\n[T0011](T0011-ship-the-plugin-skeleton-so-the-library-installs.md) deliberately\nomitted `license` from `plugin.json` because there was no LICENSE file, and\nrecorded that it needed deciding before a release. The operator has decided:\nMIT.\n\n# Acceptance criteria\n\n- [x] `LICENSE` at the repository root, MIT, naming the copyright holder and\n      year\n- [x] The file holds the licence text and nothing else, so licence detection\n      reads it\n- [x] `plugin.json` carries `\"license\": \"MIT\"`\n- [x] The README states what the licence does and does not cover\n\n# Out of scope\n\n- A git remote, and the `repository` and `homepage` fields that depend on one.\n  Still open from\n  [T0011](T0011-ship-the-plugin-skeleton-so-the-library-installs.md).\n- Chasing the brain template's upstream licence. Noted below; not this task's\n  job to resolve.\n\n# Log\n\n## 2026-11-09 \u2014 licensed, and scoped on purpose\n\nMIT, copyright Eli Hooten, 2026. `LICENSE` holds the licence text alone \u2014\nGitHub and most tooling parse that file to detect a licence, and prepending a\nscope note would have broken detection. The scoping lives in the README\ninstead.\n\n**The scope is narrower than the repository.** `brain/` is forked from an\nupstream template at the revision in\n[config.md](../../config.md), and that upstream carries no LICENSE file and no\nlicence statement anywhere \u2014 checked by searching for a licence file and for\nthe words in `README.md`, `INIT.md` and `config.md`. Its terms are therefore\nunstated, and they are its author's to give. MIT-licensing it here would assert\na grant the operator is not in a position to make, so the README says the\nlicence covers this repository's own work \u2014 the register skills, the manifests,\nthe README and the project record \u2014 and not `brain/bin/`, `brain/skills/` or\nthe scaffolding.\n\nThis is [D0001](../../example/knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)\non a claim that happens to be legal rather than technical: a licence file is a\nclaim about what a reader may do, and one that overreaches costs them more than\nsilence would.\n\nWorth chasing with the template's author, since the template exists to be\nadopted ([G0001](../../example/knowledge-catalog/goals/G0001-a-brain-others-can-adopt.md))\nand an adopter cannot redistribute what has no stated terms. Not a blocker for\nthis project, which is not redistributing the brain.\n", "mtime": "2026-11-09T17:40:25+00:00"}, {"path": "tasks/voice/T0015-build-the-professional-profile-from-real-samples-and.md", "meta": {"id": "T0015", "type": "task", "title": "Build the professional profile from real samples and apply it", "description": "The operator's own professional voice profile, built from published writing and applied to two live client documents, as the first end-to-end exercise of the design.", "status": "Testing", "category": "enhancement", "initiative": "voice", "blocked_by": [], "timestamp": "2026-11-09", "tags": ["voice", "profile", "dogfood"]}, "body": "\n# What to build\n\nA professional voice profile for the operator, at user scope, built from their\nown published writing \u2014 and then used on real documents so the profile-reading\npath is exercised rather than asserted.\n\nThis is the dogfood [D0012](../../knowledge-catalog/decisions/D0012-make-it-adoptable-first-then-dogfood-it-as.md)\nasked for, one step early: it runs without the generator, because\n[D0019](../../knowledge-catalog/decisions/D0019-humanize-me-ships-as-a-claude-code-plugin.md)\nresolves a profile from a file and does not care whether a script or a person\nwrote it. Hand-writing the first one is also the only way to find out what the\nformat needs, which is what the format spec is waiting on.\n\n# Acceptance criteria\n\n- [x] A corpus is gathered from the operator's published writing, with each\n      sample's register declared rather than inferred\n- [x] Samples are held back from the build, and the profile records which,\n      per [D0018](../../knowledge-catalog/decisions/D0018-a-voice-profile-states-its-claims-checkably.md)\n- [x] `~/.claude/voice/profile/professional.md` exists with machine-readable\n      markers and prose sections, and its `verified:` field states honestly\n      what has and has not been checked\n- [x] The profile asserts no marker that the corpus contradicts, and records\n      what the corpus leaves unsettled\n- [x] The profile is applied to at least one real document, and the result is\n      measured against the markers\n- [x] The findings are written down as evidence, including the failures\n\n# Out of scope\n\n- The generator. This profile is hand-written on purpose.\n- The casual and research profiles. The two laid-back samples the operator\n  offered were unreachable, so the casual corpus is short two pieces.\n- The held-out regeneration diff. Reserved samples exist and the check has not\n  run; see [E0005](../../knowledge-catalog/reference/E0005-markers-are-genre-sensitive-and-the-checker-must.md).\n\n# Log\n\n## 2026-11-09 \u2014 built and applied\n\n**Corpus.** Nine sources offered, seven fetched. 8,771 prose words after\nstripping site chrome: 5 training samples (5,685 words) and 2 held out\n(2,302 words). The two Medium posts returned 403 to every attempt, including\nthrough a second fetcher. One source was an interview, so only the operator's\nanswers were taken \u2014 the interviewer's questions and the publication's section\nheadings were excluded by hand, line by line.\n\n**Profile.** `~/.claude/voice/profile/professional.md`, 1,300 words. Eight\ncountable markers in frontmatter, then prose for the moves, the hedging level\n(per [D0020](../../knowledge-catalog/decisions/D0020-craft-governs-ownership-and-falsifiability-a-profile-governs.md)),\nhow a judgment gets owned, diction, measured absences, and an explicitly\n*unstable* section for what the corpus contradicts itself on.\n\nThe hedging entry is the one [D0020](../../knowledge-catalog/decisions/D0020-craft-governs-ownership-and-falsifiability-a-profile-governs.md)\nmade necessary, and the corpus had a clear answer: this writer hedges by\nnarrowing scope, not by softening verbs. Modal mush is nearly absent;\n\"Generally speaking\", \"for our purposes\" and \"maybe a third of the time\" are\neverywhere. A craft rule that counted hedges would have stripped exactly the\nhedges that carry the information.\n\n**Applied** to two client-facing walkthroughs in `smart-labor-management`. The\nmap document passes 8 of 8 markers; the paperwork document passes 7 of 8.\n\n**The one failure is recorded, not fixed.** Sentence median 13 against a 15\u201322\nrange, because that document is mostly numbered UI instructions and the profile\nwas measured on blog prose. Reaching 15 meant padding instructions with\nsubordinate clauses. Declined, and written up as\n[E0005](../../knowledge-catalog/reference/E0005-markers-are-genre-sensitive-and-the-checker-must.md).\n\n**That project is not under version control.** Checked before cleaning up, so\nthe `.bak` files beside each document are the only copies of the originals and\nwere deliberately left in place.\n\n## 2026-11-09 \u2014 what this hands to the format spec\n\nThree requirements the format does not currently have, all from\n[E0005](../../knowledge-catalog/reference/E0005-markers-are-genre-sensitive-and-the-checker-must.md):\n\n- a marker needs a **text population** (paragraph prose, not all visible text),\n  or caption-heavy documents fail spuriously\n- a marker needs a **genre scope**, because a range inherits the genre of the\n  corpus it was measured on\n- a profile needs an **unstable** section, for habits the corpus contradicts\n  itself on \u2014 asserting one would have produced a confident false marker\n\n## 2026-11-09 \u2014 operator review: rejected, and why\n\nShown both documents in a browser beside their originals, the operator rejected\nthe result: *\"i think it sounds like you doing an impression of me.\"*\n\nThe map document had passed 8 of 8 markers. That is the finding\n([E0006](../../knowledge-catalog/reference/E0006-the-operator-rejected-a-profile-that-passed-every.md)):\na full marker pass is not evidence that a profile works.\n\nTwo causes, neither measurable:\n\n- **Headings were never a measured population.** The profile described paragraph\n  moves and nothing else, so paragraph moves were applied to a heading. The\n  corpus had the answer all along \u2014 the operator's headings take three plain\n  shapes and never withhold their subject, and their proposed fix \"Why we built\n  a map\" nearly matches \"Why did Codecov build Impact Analysis?\" already in the\n  training set. Now [D0021](../../knowledge-catalog/decisions/D0021-a-profile-is-derived-per-text-population-not.md).\n- **Landing sentences coined instead of compressed.** The profile named the\n  rhythm correctly and reproduced it wrongly: four inventions arrived at the\n  landing position carrying claims the paragraphs had not made. The rule is now\n  \"compress, never coin\".\n\nFixed in the profile and in both documents. Both still pass their markers, the\nmap at 8 of 8 and the paperwork at 7 of 8 on the genre-bound median.\n\nThis is the evidence that moves the held-out regeneration diff from nice-to-have\nto the next thing worth doing: it is the only check in the design that could\nhave caught either cause, and it still has not run.\n", "mtime": "2026-11-09T18:43:11+00:00"}, {"path": "tasks/voice/T0016-run-the-held-out-regeneration-diff-against-a.md", "meta": {"id": "T0016", "type": "task", "title": "Run the held-out regeneration diff against a pristine test set", "description": "Regenerate pieces the operator already wrote, from content-only briefs, and compare against the real thing \u2014 the only check in the design that could have caught the failure in E0006.", "status": "In Progress", "category": "enhancement", "initiative": "voice", "blocked_by": [], "timestamp": "2026-11-10", "tags": ["voice", "verification", "experiment"]}, "body": "\n# What to build\n\nA blind comparison that answers one question: does the profile make generated\nprose more like the operator's, less like it, or neither?\n\n[D0018](../../knowledge-catalog/decisions/D0018-a-voice-profile-states-its-claims-checkably.md)\ndesigned this check and it has never run.\n[E0006](../../knowledge-catalog/reference/E0006-the-operator-rejected-a-profile-that-passed-every.md)\nestablished that markers pass while the operator rejects, and\n[E0007](../../knowledge-catalog/reference/E0007-state-of-the-art-for-reproducing-a-specific.md)\nfound that no published metric predicts an author's own verdict better than\nr = 0.244 (n = 81). When every instrument disagrees with the person and with the\nother instruments, the test is to regenerate text the operator already wrote.\nThey wrote the answer key.\n\n# Design\n\n**Pristine test set.** Three Codecov posts by the operator that no one on this\nside has read: granular components (705 words), GitHub integration (597), PyPI\npost-mortem (1,843). Extracted by script, never printed.\n[T0015](T0015-build-the-professional-profile-from-real-samples-and.md) failed\nexactly here \u2014 \"held out of the build\" was treated as \"unseen\", and it was not,\nbecause the extraction was done by eye.\n\n**Content-only briefs**, written by a sub-agent that reads the original. The\nbrief carries every fact, number and argument and the order they appear in. It\ncarries **no headings and no phrasings** \u2014 headings especially, since heading\nstyle is the thing [E0006](../../knowledge-catalog/reference/E0006-the-operator-rejected-a-profile-that-passed-every.md)\ncaught us failing, and a brief that leaks them tests nothing.\n\n**Arms.** Generation is done by fresh sub-agents with no exposure to the corpus,\nnot by the session that built the profile \u2014 which cannot un-know the five\ntraining pieces it read, and so cannot write an honest control.\n\n| arm | input |\n|---|---|\n| A control | brief only |\n| B profile | brief + `~/.claude/voice/profile/professional.md` |\n| D real | what the operator actually published |\n\nArm B is production-faithful: the shipped skill reads the profile, never the\ncorpus. The exemplar arm is deliberately absent and belongs to\n[T0017](T0017-experiment-population-matched-exemplar-retrieval-versus-a-described.md).\n\n**Judgment.** The operator, blind and shuffled. Markers computed alongside, as a\ndiagnostic and explicitly not as the verdict.\n\n# Acceptance criteria\n\n- [ ] Test pieces extracted mechanically and never read by the session\n      conducting the comparison\n- [ ] Briefs carry no heading and no phrase from the originals\n- [ ] Each generated arm produced by an agent with no corpus exposure\n- [ ] The operator judges blind, with arm labels withheld until after\n- [ ] The result is recorded whichever way it falls, including \"the profile made\n      no difference\"\n\n# Out of scope\n\n- Rebuilding the profile on the expanded corpus. The current profile is the\n  baseline under test; changing it and the method together would confound the\n  result. The new training material is staged and unused.\n- Exemplar retrieval. [T0017](T0017-experiment-population-matched-exemplar-retrieval-versus-a-described.md).\n- Any style-embedding metric. [E0007](../../knowledge-catalog/reference/E0007-state-of-the-art-for-reproducing-a-specific.md)\n  is clear that it is a drift tripwire, not an acceptance test.\n\n# Log\n\n## 2026-11-10 \u2014 run set up, awaiting the operator's judgment\n\nTwo pieces under test: granular Components (705 real words) and the GitHub\nintegration change (597). The PyPI post-mortem is briefed and held in reserve \u2014\n1,843 words is a lot to ask someone to judge blind in one sitting.\n\n**The leak check earned its place immediately.** The first granular brief\ncarried **10 of its 13 headings verbatim**, plus 51 eight-word phrase overlaps.\nHad it gone through, the heading question \u2014 the one\n[E0006](../../knowledge-catalog/reference/E0006-the-operator-rejected-a-profile-that-passed-every.md)\ncaught us failing \u2014 would have been untestable on that piece, and we would have\nscored ourselves a pass on the thing we are least able to do. Rewritten: 0\nleaked headings on all three. The 12 overlaps that survive in granular are YAML\nfile paths, which no writer invents.\n\nThe check is mechanical and takes a second: candidate headings are lines of\n2\u201312 words under 80 characters with no terminal punctuation; leakage is a\nverbatim lowercase substring match; phrase overlap is shared 8-word shingles.\nWorth keeping as a tool.\n\n**Arms as run.** Control got the brief alone. The profile arm got\n`skills/voice-professional/SKILL.md` plus\n`~/.claude/voice/profile/professional.md` \u2014 what ships, not the profile alone.\nBoth generating agents were forbidden the corpus and the originals, and both\nconfirmed they read nothing outside `briefs/`. Lengths landed within 15% of\ntarget on all four.\n\n**Presentation.** Three versions per piece, shuffled, with markup normalised \u2014\nheadings, lists and paragraphs rendered identically \u2014 so format is not a tell.\nThe key is on disk and unread by the session running the comparison.\n\n**A confound was claimed and then retracted.** This log first recorded that\nboth generations produced *14 headings against the operator's 7*, read as the\nagents over-sectioning. **That was wrong and is withdrawn.** It was an artefact\nof the comparison tool: one heading heuristic was applied to all three versions,\nand it classified YAML lines as headings \u2014 `name: CommentFeature`, bare\nbackticks, config comments. The real counts are **4, 4 and 5** on granular and\n**2, 2 and 1** on the GitHub piece. Heading counts match closely and there is no\nover-sectioning effect.\n\nThe cause is worth keeping: the two generated versions are Markdown, where a\nheading is unambiguously a `#` line and no guessing is needed, while only the\noperator's extracted original requires a heuristic. Applying one rule to both\nmanufactured a finding out of a parser bug. The fixed tool parses Markdown\nstructurally and reserves the heuristic for plain text, excluding fenced code,\nlowercase `key:` lines, indented lines and bare punctuation.\n\nA measurement tool that has not been checked against a known case will invent\nfindings, and this one invented a confident, plausible, specific one.\n\n**One known defect carried into the run.** The profile arm chose em-dashes over\n`--`, correctly following the profile's `Unstable \u2014 do not assert` section. But\nthe sent-mail sweep on 2026-11-10 found `--` in the operator's own unedited\ntyping, which suggests it is a real habit and the published em-dashes were\neditorial. The evidence was in hand and the profile was not updated before the\nrun, so any dash tell in arm B belongs to that omission and not to the method.\n\n## 2026-11-10 \u2014 first six trials judged; result in E0008\n\nThe profile ranked above the no-guidance control in **2 of 6** trials\n(two-sided p = 0.688), and the operator identified his own writing in **2 of 6**\n\u2014 exactly chance. His own published prose carried the worst mean rank of the\nthree arms. Full numbers and the caveats in\n[E0008](../../knowledge-catalog/reference/E0008-the-profile-did-not-beat-the-control-and.md).\n\nThe run is not finished. Three more trials are generating from the PyPI\npost-mortem brief, which takes headings from n = 2 to 3 and prose from n = 4 to\n6. Still underpowered, but the headings-versus-prose split is the most\nactionable thing the first six produced and is currently resting on two trials.\n\nWorth recording about the method rather than the result: the sealed-key\ndiscipline held, the operator's rankings were written down before anything was\nunsealed, and the two most useful findings \u2014 bullet length, one subject per\nheading \u2014 came from reasons he volunteered rather than from the rankings\nthemselves. The free-text reason is carrying more information than the ordinal.\n", "mtime": "2026-11-10T17:48:17+00:00"}, {"path": "tasks/voice/T0017-experiment-population-matched-exemplar-retrieval-versus-a-described.md", "meta": {"id": "T0017", "type": "task", "title": "Experiment: population-matched exemplar retrieval versus a described profile", "description": "Put five verbatim passages of the operator's own writing in the prompt, retrieved by text population rather than topic, and measure it against the described profile on the same briefs.", "status": "Not Ready", "category": "question", "initiative": "voice", "blocked_by": ["T0016"], "timestamp": "2026-11-10", "tags": ["voice", "exemplars", "experiment", "research"]}, "body": "\n# What to build\n\nA third arm for [T0016](T0016-run-the-held-out-regeneration-diff-against-a.md)'s\ncomparison: the same briefs, generated with **five verbatim passages** of the\noperator's writing instead of a description of it, retrieved by **text\npopulation** \u2014 headings to write a heading, paragraph prose to write paragraphs.\n\n# Why this is interesting rather than merely next\n\n[E0007](../../knowledge-catalog/reference/E0007-state-of-the-art-for-reproducing-a-specific.md)\ngathered the evidence for the exemplar side and found the shape of the question\nunresolved:\n\n- Raw history beats a generated profile on every LaMP generation row, and the\n  paper proposing profiles is the one reporting it, explaining that \"any\n  natural-language profile abstracts away exactly that idiolect\".\n- In the head-to-head, five samples with no instruction take the authorship\n  metric (0.508) while the described profile takes the LLM judge (0.542) and the\n  stylometry (0.761). The authorship difference sits inside the error bars, so\n  the **ranking is not established** \u2014 what is established is that a profile has\n  no advantage on the metric that asks \"is this the same author\".\n- Five exemplars performs like ten.\n- **Topic-similar selection measurably hurts**: 81.28% against 95.44% for random\n  selection.\n\nAnd the part worth doing for its own sake: **nobody appears to have published\nthe population-matched variant.** Topic matching has a measured negative result;\nretrieving headings to write headings is untested. It is also exactly what\n[D0021](../../knowledge-catalog/decisions/D0021-a-profile-is-derived-per-text-population-not.md)\nalready requires for deriving a profile, applied one step later at generation\ntime.\n\nSo this arm is a small original experiment rather than an application
