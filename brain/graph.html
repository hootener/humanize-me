s a dated\nattestation when it cannot be repeated.\n\n# Alternatives\n\n- **Markers only** \u2014 rejected as the whole scheme: fully mechanical and fast,\n  but a passage can hit every number and still not sound like the operator.\n  Kept as one of the two halves.\n- **Blind comparison by the operator alone** \u2014 rejected as the whole scheme:\n  honest and needs no infrastructure, but it is a hand judgment every time, so\n  it cannot run unattended and cannot catch a regression. Kept as the shape of\n  the held-out check.\n- **No verification, tune by feel** \u2014 rejected: it is the fastest route to a\n  working first version, and it leaves the library unable to tell an adopter\n  whether their profile is any good, which is the failure\n  [D0001](../../example/knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)\n  exists to prevent.\n\n# Consequences\n\n- The profile format has a parseable section, so it is an interface and not\n  just a document.\n- A checker has to exist for the markers to mean anything, and it must run with\n  no model in the loop.\n- The generator has to hold samples back, which costs profile quality on a\n  small corpus \u2014 and a minimum viable corpus size per register is now an open\n  question.\n- A register's trustworthiness is readable off its own file, which is what\n  lets the thin ones be treated as thin.\n", "mtime": "2026-11-09T16:54:41+00:00"}, {"path": "knowledge-catalog/decisions/D0019-humanize-me-ships-as-a-claude-code-plugin.md", "meta": {"id": "D0019", "type": "decision", "title": "humanize-me ships as a Claude Code plugin and the profile lives at user scope", "description": "The library is its own marketplace and installs once at user scope; the profile sits beside it per user, with a per-register project override for a shared house voice.", "timestamp": "2026-11-09", "tags": ["distribution", "adoption", "plugin", "profile"], "status": "active", "serves": "../goals/G0002-humanize-me-installs-into-another-project-in-one.md", "invariant": "The plugin is the only install path, and a register's profile is resolved from the project first and the user second.", "constrains": [".claude-plugin", "skills", "voice/profile"]}, "body": "\n# Context\n\n[T0010](../../example/tasks/formalize/T0010-decide-whether-the-brain-ships-as-a-claude.md)\nasked this question of the brain and found it genuinely hard, for a reason that\ndoes not apply here. The brain's non-generic half is **per-project** \u2014 a\ncatalog of one project's goals and decisions \u2014 and a user-scoped plugin cannot\ncarry that at all. So the brain had to decide whether to split itself.\n\nhumanize-me splits the other way. Its non-generic half is **per-person**: a\ndescription of how one human writes. User scope is not a limitation for that,\nit is the correct scope. Nearly everything else \u2014 the register skills, the\ngenerator, the marker checker \u2014 is identical in every install.\n\nVerified against the plugins installed on this machine rather than assumed: a\nrepository carrying `.claude-plugin/plugin.json` and\n`.claude-plugin/marketplace.json` is its own marketplace with no third party\ninvolved; it installs to\n`~/.claude/plugins/cache/<marketplace>/<name>/<version>`; and the install\nrecord stamps `\"scope\": \"user\"` alongside the commit it came from, so the\nversion in force is a fact rather than a guess.\n\nThe design before this decision put the profile inside each adopting project.\nThat makes the operator's voice a property of a repository, so it gets copied\ninto every repository they work in and drifts between them. A person's casual\nvoice is not a property of a project.\n\n# Decision\n\nThe library ships as a Claude Code plugin, and that is the only install path.\nThere is no directory copy and no symlink into a project's `.claude/skills`.\n\nA register's profile is resolved per register, project first:\n\n1. `./voice/profile/<register>.md` \u2014 committed to the repository: a team's\n   house voice\n2. `~/.claude/voice/profile/<register>.md` \u2014 the operator's own, in force\n   everywhere\n3. neither \u2014 generic craft only, under\n   [D0015](D0015-a-voice-profile-is-optional-and-the-skills.md)\n\nResolution is **per register rather than per profile**, which is what gets the\ncase that matters: a team commits a shared `professional.md` and `research.md`\nwhile each member's `casual.md` stays their own. Nobody chooses between a house\nvoice and their own voice.\n\n# Alternatives\n\n- **Copy or symlink the skills into each project** \u2014 rejected: it reinstalls\n  per repository, has no version record, and makes every upstream improvement a\n  manual re-copy.\n- **Support both the plugin and a directory install** \u2014\n  rejected on [T0010](../../example/tasks/formalize/T0010-decide-whether-the-brain-ships-as-a-claude.md)'s\n  reasoning: two mechanisms supplying the same skills is a conflict rather than\n  a convenience, and the adopter has to understand both to debug either.\n- **Keep the profile in the project only** \u2014 rejected: the operator's voice\n  then gets duplicated into every repository and drifts, and a new project\n  starts with no voice despite the operator having one.\n- **Keep the profile at user scope only** \u2014 rejected: it forecloses a team\n  sharing a house voice through the repository, which the per-register\n  resolution gets for almost nothing.\n\n# Consequences\n\n- [G0002](../goals/G0002-humanize-me-installs-into-another-project-in-one.md)\n  is satisfied more cheaply than it was written. Its outcome was \"installs in\n  one step without reading the internals\"; under a plugin it installs once and\n  is in force in every project, so the per-project step disappears rather than\n  getting smaller. The goal's wording survives the change because it names an\n  outcome and not a mechanism.\n- The register skills are present in projects where nobody wants them. This is\n  the hazard [T0010](../../example/tasks/formalize/T0010-decide-whether-the-brain-ships-as-a-claude.md)\n  raised, where a globally installed skill fails looking for something that\n  isn't there. It does not bite here: under\n  [D0015](D0015-a-voice-profile-is-optional-and-the-skills.md) a missing\n  profile is a miss, not an error.\n- The skills now update independently of the profile, so the profile format in\n  [D0013](D0013-the-craft-ships-generic-and-the-voice-is.md) becomes a\n  compatibility surface across versions. A format change has to keep reading\n  profiles written by older generators, or say loudly that it cannot.\n- The repository takes on marketplace plumbing: `plugin.json`,\n  `marketplace.json`, a version and a changelog.\n- `voice/profile/` in a project is a committed artifact and must not be\n  confused with a corpus. A corpus is never committed, and under\n  [D0017](D0017-writing-reached-through-mcp-is-distilled-in-flight.md) the\n  personal text behind a casual profile is never written down at all.\n", "mtime": "2026-11-09T16:55:16+00:00"}, {"path": "knowledge-catalog/decisions/D0020-craft-governs-ownership-and-falsifiability-a-profile-governs.md", "meta": {"id": "D0020", "type": "decision", "title": "Craft governs ownership and falsifiability; a profile governs how much", "description": "A craft rule may require that a judgment has a holder and a confidence that could be wrong; it may never legislate the quantity of hedging, which is voice and belongs to the profile.", "timestamp": "2026-11-09", "tags": ["voice", "craft", "profile", "registers"], "status": "active", "serves": "../goals/G0003-an-agent-writes-human-facing-prose-in-the.md", "invariant": "A craft rule constrains ownership and falsifiability only; hedge quantity and wording belong to the profile.", "constrains": ["skills", "voice/profile"]}, "body": "\n# Context\n\n[D0013](D0013-the-craft-ships-generic-and-the-voice-is.md) draws the line\nbetween the two halves of the library: a shipped skill holds craft and knows\nnothing about any person, a profile holds the person and no craft. It does not\nsay where the line falls on a rule that straddles, and hedging straddles.\n\nThe first register skill resolved it the blunt way. It sorted every rule into\nwarrant or taste, filed hedging under warrant, and declared that warrant wins\nwhere the two conflict. Recorded at the time as a gap in\n[E0004](../reference/E0004-what-the-professional-craft-skill-could-not-say.md).\n\nFour sentences carrying the same judgment at the same real confidence show why\nthat fails:\n\n| | |\n|---|---|\n| A | \"It may be worth considering whether the migration should be split.\" |\n| B | \"Split the migration.\" |\n| C | \"I'd split the migration.\" |\n| D | \"I'd probably split the migration, though I haven't looked at the foreign keys.\" |\n\nA is a genuine failure. Nobody holds it, nothing in it could turn out wrong,\nand a reader who has to act cannot. B, C and D all own the judgment and differ\nonly in how much they hedge \u2014 which is voice. D hedges most and is arguably the\nbest of the four, because its hedge carries information: it says which part is\nsoft.\n\nThe skill as written cannot tell D from A, because it states the prohibition\nagainst hedging as a surface quantity. Combined with \"warrant wins\", a profile\ncorrectly recording that someone writes like D loses to the craft, and every\nuser converges on B or C regardless of how they actually write. The library\nwould flatten the voices it exists to preserve.\n\n# Decision\n\nA craft rule may require two things of a claim and no more:\n\n1. **Every judgment has a holder.** Yours, or someone you name.\n2. **Every confidence is something you could be wrong about.**\n\nHedge quantity and hedge wording are voice. The profile governs them, and no\ncraft rule overrides a profile on either.\n\nA hedge that names what the writer is unsure of, or states a likelihood that\ncould turn out false, satisfies the craft rule **at any quantity**. \"It may be\nworth considering\" fails it at quantity one.\n\nThis replaces hedge-counting wherever a register skill does it. The stacked\nhedge is caught by the same rule and for the honest reason: \"this might\npossibly be somewhat slower\" is not wrong because it carries three qualifiers,\nit is wrong because after them no claim remains that could be false.\n\n# Alternatives\n\n- **Keep \"warrant wins\" and let the profile state a personal hedging floor** \u2014\n  the shape [E0004](../reference/E0004-what-the-professional-craft-skill-could-not-say.md)\n  proposed when it raised this. Rejected: it patches the symptom and leaves the\n  craft rule wrong. A floor is also the wrong instrument, since the problem is\n  not that the craft sets the level too low but that it has an opinion about\n  the level at all.\n- **Drop the hedging rules from the craft entirely** \u2014 rejected: A is a real\n  failure and the most common one in agent prose. Removing the rule to fix its\n  overreach would give up the thing the register exists to fix.\n- **Let the profile win every conflict** \u2014 rejected: it makes the craft\n  advisory, and a profile is generated from a corpus that may itself contain\n  unowned judgments. The craft is what stops a profile teaching a bad habit\n  back.\n\n# Consequences\n\n- The professional register skill is rewritten on this rule, which is\n  [T0013](../../tasks/voice/T0013-restate-the-hedging-rules-as-ownership-and-falsifiability.md).\n  The casual and research registers inherit it before they are written.\n- The rule is testable in a way hedge-counting was not: a passage fails if a\n  judgment has no holder or a confidence could not be wrong. That is closer to\n  something [D0018](D0018-a-voice-profile-states-its-claims-checkably.md)'s\n  marker vocabulary can carry than \"hedges too much\" ever was.\n- Banned-opener lists stay legitimate \u2014 \"It may be worth considering\" earns its\n  place by failing the rule, not by being a hedge.\n- A profile may record a writer who hedges heavily, and the skills must honour\n  it. A reader who finds that prose over-qualified is disagreeing with the\n  writer's voice, which is not a defect this library is obliged to fix.\n- It sharpens [D0013](D0013-the-craft-ships-generic-and-the-voice-is.md) rather\n  than contradicting it: the craft/profile boundary now has a stated test for\n  rules that straddle it.\n", "mtime": "2026-11-09T17:33:32+00:00"}, {"path": "knowledge-catalog/decisions/D0021-a-profile-is-derived-per-text-population-not.md", "meta": {"id": "D0021", "type": "decision", "title": "A profile is derived per text population, not from paragraphs alone", "description": "Headings, captions, list items and paragraphs are measured and described separately, because a move that is characteristic in one is wrong in another.", "timestamp": "2026-11-09", "tags": ["voice", "profile", "method"], "status": "active", "serves": "../goals/G0003-an-agent-writes-human-facing-prose-in-the.md", "invariant": "Every text population a profile's register will produce is measured from the corpus separately, and a profile states which populations it covers.", "constrains": ["voice/profile", "skills"]}, "body": "\n# Context\n\nThe first real profile was built from paragraph prose: sentence rhythm,\npunctuation rates, diction, hedging, rhetorical moves. Headings, captions and\nlist items were filtered out of the measurement as noise \u2014 correctly, for the\nmarkers being computed, since a figure caption is not a sentence.\n\nNothing then put them back. The profile described the operator's paragraph\nmoves and said nothing about any other population, so when a document needed a\nheading, the paragraph moves were the only guidance available and they were\napplied there.\n\nThe result was rejected by the operator as an impression of their voice while\npassing 8 of 8 markers\n([E0006](../reference/E0006-the-operator-rejected-a-profile-that-passed-every.md)).\nThe corpus had the answer \u2014 the operator's headings take three plain shapes and\nnever withhold their subject \u2014 and it went unread because headings were not in\nthe population being measured.\n\n# Decision\n\nA profile is derived per text population. At minimum: **paragraphs, headings,\nlist items, captions.**\n\nEach population is measured from the corpus on its own, and a profile states\nwhich populations it covers. A population the corpus cannot speak to is named as\nuncovered rather than left to be filled in by the nearest available guidance.\n\nA rhetorical move is recorded **against the population it was observed in**. A\nmove characteristic of this writer's paragraphs is not thereby licensed in their\nheadings, and a profile that does not say where a move belongs will have it\napplied everywhere.\n\n# Alternatives\n\n- **Derive from paragraph prose and let the craft skill handle the rest** \u2014\n  what happened by default, and it failed. The craft skill cannot hold the\n  answer, because heading style is personal: it is exactly the kind of fact\n  [D0013](D0013-the-craft-ships-generic-and-the-voice-is.md) forbids a shipped\n  skill from carrying.\n- **One undifferentiated measurement over all text** \u2014 rejected on the\n  measurement evidence: counting captions and UI labels as sentences moved the\n  median two full words and produced a spurious failure\n  ([E0005](../reference/E0005-markers-are-genre-sensitive-and-the-checker-must.md)).\n  Separating the populations is what makes either measurement meaningful.\n- **Headings as a one-off addition, no general rule** \u2014 rejected: the same gap\n  exists for captions and list items, and the casual and research registers\n  would each hit it again. One correction per population per register is three\n  times the cost of a rule.\n\n# Consequences\n\n- The profile format needs a population dimension, alongside the text\n  population and genre scope that\n  [E0005](../reference/E0005-markers-are-genre-sensitive-and-the-checker-must.md)\n  already asked for. All three land on the format spec.\n- Corpus extraction has to preserve structure rather than flatten to text.\n  The first build flattened HTML to plain text early, which is why headings were\n  unavailable without going back to the sources.\n- A profile that covers only paragraphs is **incomplete, not merely thin**, and\n  should say so where a reader will see it.\n- The casual and research profiles inherit this before they are built, which is\n  the whole reason it is a decision and not a note on one profile.\n", "mtime": "2026-11-09T18:42:25+00:00"}, {"path": "knowledge-catalog/decisions/index.md", "meta": {}, "body": "# Decisions\n\nChoices made, with the alternatives considered and the evidence behind them.\nNumbered in the `D` sequence, which **principles share** \u2014 a principle is a\ndecision with no alternatives and no expiry. Superseded, never deleted.\n\n| id | | Title |\n|---|---|---|\n| [D0010](D0010-brain-tasks-replaces-an-external-tracker.md) | decision | brain/tasks replaces an external tracker |\n| [D0011](D0011-only-prose-with-a-human-reader-is-in.md) | decision | Only prose with a human reader is in scope |\n| [D0012](D0012-make-it-adoptable-first-then-dogfood-it-as.md) | decision | Make it adoptable first, then dogfood it as an end user |\n| [D0013](D0013-the-craft-ships-generic-and-the-voice-is.md) | decision | The craft ships generic and the voice is a generated profile |\n| [D0014](D0014-registers-are-organized-by-burden-of-proof-not.md) | decision | Registers are organized by burden of proof, not formality |\n| [D0015](D0015-a-voice-profile-is-optional-and-the-skills.md) | decision | A voice profile is optional and the skills degrade without one |\n| [D0016](D0016-the-corpus-is-sorted-into-per-register-folders.md) | decision | The corpus is sorted into per-register folders by hand |\n| [D0017](D0017-writing-reached-through-mcp-is-distilled-in-flight.md) | decision | Writing reached through MCP is distilled in flight and never stored |\n| [D0018](D0018-a-voice-profile-states-its-claims-checkably.md) | decision | A voice profile states its claims checkably |\n| [D0019](D0019-humanize-me-ships-as-a-claude-code-plugin.md) | decision | humanize-me ships as a Claude Code plugin and the profile lives at user scope |\n| [D0020](D0020-craft-governs-ownership-and-falsifiability-a-profile-governs.md) | decision | Craft governs ownership and falsifiability; a profile governs how much |\n| [D0021](D0021-a-profile-is-derived-per-text-population-not.md) | decision | A profile is derived per text population, not from paragraphs alone |\n", "mtime": "2026-11-09T18:41:33+00:00"}, {"path": "knowledge-catalog/glossary.md", "meta": {"type": "glossary", "title": "Glossary", "description": "Shared vocabulary for this project.", "timestamp": "2026-11-08", "tags": ["glossary"], "status": "active"}, "body": "\n# Glossary\n\nThe vocabulary this project is described in. If a concept is missing, either the language is\nbeing invented \u2014 reconsider \u2014 or there is a real gap, so add it. Each term: a tight definition,\nand an `_Avoid_` list where a near-synonym would mislead.\n\n## Task\n\nOne unit of work, one file under `brain/tasks/<initiative>/`, with an id like `T0042`. The only\nnode type in the **Action** category, and the only one that is executable.\n\n_Avoid_: **ticket**, **issue**, **story**, **card**. All four name the same thing, and the type\nis `task`, the folder is `tasks/`, the template is `task.md`. One concept, one word.\n\n## Frontier\n\nTracker term. The tasks that are `Ready for Development`, unclaimed, and whose every blocker is\ndone. `brain/bin/status` computes it.\n\n## Lineage\n\nThe chain from a task back to the intent that asked for it: task \u2192 spec \u2192 goal, with decisions\nconstraining the route. `brain/bin/ancestry` walks it. A lineage that does not reach a goal or a\nprinciple is **unterminated**, which means work shipped with no recorded intent.\n\n_Avoid_: **provenance** (which is about where a fact came from \u2014 that is `resource:` on an\nevidence node), **history** (which is git's).\n\n## Drift vs omission\n\n**Drift** is building something subtly different from what was asked. **Omission** is never\nbuilding part of it. The reverse walk finds drift; only the forward walk\n(`brain/bin/ancestry <id> --forward`) finds omission, and a green test suite hides it best.\n", "mtime": "2026-11-08T18:03:28+00:00"}, {"path": "knowledge-catalog/goals/G0002-humanize-me-installs-into-another-project-in-one.md", "meta": {"id": "G0002", "type": "goal", "title": "humanize-me installs into another project in one step", "description": "Another project can take this library's voice skills and have them in force without reading how the library is built.", "timestamp": "2026-11-08", "tags": ["adoption", "voice", "skills"], "status": "active"}, "body": "\n# Goal\n\nSomeone with an unrelated repository can drop humanize-me's voice skills into\nit and have an agent in that repository write human-facing prose differently \u2014\nwithout first understanding how humanize-me is put together.\n\n# Why\n\nThe voice work and the packaging are separable, and the operator has settled\nthe order between them: make it adoptable first, then use the adopted version\nto build their own voice setup \"like any other end user would\"\n([D0012](../decisions/D0012-make-it-adoptable-first-then-dogfood-it-as.md)).\n\nAdoptability first is what makes that dogfooding real. A voice setup built\nin-tree would be exercised through paths no end user has, so the install\nwould stay untested exactly where it is most likely to be wrong.\n\n# Signals\n\n- A project that has never seen this repository installs the skills and its\n  agent's human-facing prose changes, with no step that required reading\n  humanize-me's internals.\n- The operator's own voice setup is built through the adopted path, not in-tree.\n- The install instructions are followed by someone who did not write them,\n  and nothing has to be improvised.\n", "mtime": "2026-11-08T18:09:39+00:00"}, {"path": "knowledge-catalog/goals/G0003-an-agent-writes-human-facing-prose-in-the.md", "meta": {"id": "G0003", "type": "goal", "title": "An agent writes human-facing prose in the operator's own voice", "description": "Prose an agent writes for a person to read sounds like the person who installed the library, at the right level of warrant for what the prose is doing.", "timestamp": "2026-11-09", "tags": ["voice", "registers", "profile"], "status": "active"}, "body": "\n# Goal\n\nAn agent working in a project writes prose for human readers that sounds like\nthe operator rather than like an agent \u2014 and picks the right register for what\nthe prose is being asked to do, rather than writing everything at one pitch.\n\nThis is the other half of the project. [G0002](G0002-humanize-me-installs-into-another-project-in-one.md)\nis about the library arriving; this is about what arriving is worth.\n\n# Why\n\nAn agent's prose fails in a particular way, and it is not a failure of\nformality. It asserts everything at the same temperature: it hedges claims that\nshould be stated flatly and states claims that should be hedged, because it has\nno model of what a given claim is resting on. A reader notices the uniformity\nbefore they notice any individual word.\n\nFixing that needs two things the library has to keep apart. One is craft, the\nsame for everyone \u2014 what to stop doing, and how much warrant a claim at this\npitch has to carry. The other is the operator, who is not the same as anyone\nelse and cannot be guessed at from first principles. Only the second needs\ntheir writing to exist; the first is worth having on its own\n([D0015](../decisions/D0015-a-voice-profile-is-optional-and-the-skills.md)).\n\nScope is set by [D0011](../decisions/D0011-only-prose-with-a-human-reader-is-in.md):\nprose with a human reader. Agent-facing text is left alone.\n\n# Signals\n\n- The operator can read a passage the agent wrote and not flinch at it.\n- Asked for a Slack reply and a post-mortem on the same subject, the agent\n  produces prose that differs in what its claims rest on, not merely in\n  whether it used contractions.\n- A reader who knows the operator's writing, shown generated prose alongside\n  their real writing, cannot reliably sort them.\n- A register's profile says how well grounded it is, so a thin one is visible\n  as thin rather than passing as settled\n  ([D0018](../decisions/D0018-a-voice-profile-states-its-claims-checkably.md)).\n", "mtime": "2026-11-09T16:53:07+00:00"}, {"path": "knowledge-catalog/goals/index.md", "meta": {}, "body": "# Goals\n\nWhat done looks like, and the signals that say so. A goal is an outcome, never\nan implementation; the plans and specs that pursue it name it in their\n`serves:` field, and every lineage walk terminates here.\n\n| id | Status | Title |\n|---|---|---|\n| [G0002](G0002-humanize-me-installs-into-another-project-in-one.md) | active | humanize-me installs into another project in one step |\n| [G0003](G0003-an-agent-writes-human-facing-prose-in-the.md) | active | An agent writes human-facing prose in the operator's own voice |\n", "mtime": "2026-11-09T16:52:43+00:00"}, {"path": "knowledge-catalog/howto.md", "meta": {}, "body": "# How to use the knowledge catalog\n\nThe durable record of goals, decisions, plans and findings for this project.\nEvery entry is markdown plus YAML frontmatter in Google's Open Knowledge Format\n(OKF), organized as a cross-linked graph.\n\n## How it's used\n\nAn agent **searches this catalog before making a significant decision**\n(`brain/bin/relevant`, `brain/bin/constraints`) and surfaces the relevant\nentries, with followable links, as justification. During normal work it\n**passively captures** durable decisions here and reports what it wrote at the\nend of the session.\n\n## If you're hand-editing these files, you're probably doing it wrong\n\nThe intended path is through the skills \u2014 `/grill-change` before a change,\n`/to-spec` and `/to-tasks` to plan, `/spec-review` after, `/audit` to reconcile.\nThey handle the format, the taxonomy, the ids and the cross-linking;\n`bin/new` keeps the indexes, the change log and the graph in step, and\n`bin/index` rebuilds any folder index from the nodes present.\n\nYou *can* hand-edit; it is only markdown. If you do, run `brain/bin/lint`. It\nblocks malformed entries, and everything below is something it checks.\n\n## The four categories\n\nEvery node belongs to exactly one, and they run left to right\n([D0002](../example/knowledge-catalog/decisions/D0002-four-categories.md)):\n\n| Category | Types | Answers |\n|---|---|---|\n| **Intent** | `goal`, `decision`, `principle` | what we are trying to do, and what we have settled |\n| **Approach** | `plan`, `spec` | how we mean to do it |\n| **Action** | `task` | what gets done |\n| **Evidence** | `evidence` | what we observed, and what it corrects |\n\n`glossary` sits outside the four: it is definitional, not a claim about the\nwork.\n\n**Nothing cites a node newer than itself.** Intent \u2192 Approach \u2192 Action is the\nusual order because intent usually comes first, but a goal written today may\ncite evidence an earlier effort produced. What is forbidden is editing that\nearlier node to point at the new one, because a reader would then see a\njustification that did not exist when it was written. Two edges are sanctioned\nexceptions \u2014 `superseded_by` and `amends` \u2014 because a reader who reaches a\nstale node must be carried to what replaced it.\n\n## Ids\n\nA type letter plus four digits, flat and global\n([D0003](../example/knowledge-catalog/decisions/D0003-identifiers.md)):\n\n`G` goal \u00b7 `D` decision *and* principle \u00b7 `P` plan \u00b7 `S` spec \u00b7 `T` task \u00b7 `E` evidence\n\nThe id lives in the frontmatter **and** as the filename prefix, and the linter\nchecks they agree. `brain/bin/new <type>` allocates it; never pick one by hand,\nand never renumber except with `brain/bin/renumber` to resolve a collision.\n\n## Types and their body headings\n\n| Type | Headings |\n|---|---|\n| `goal` | `# Goal` \u00b7 `# Why` \u00b7 `# Signals` |\n| `decision` | `# Context` \u00b7 `# Decision` \u00b7 `# Alternatives` \u00b7 `# Consequences` |\n| `principle` | `# Principle` \u00b7 `# Rationale` \u00b7 `# Implications` |\n| `plan` | `# Goal` \u00b7 `# Approach` \u00b7 `# Sequence` \u00b7 `# Risks` |\n| `spec` | see [templates/spec.md](reference/agent-skills/templates/spec.md) |\n| `task` | `# What to build` \u00b7 `# Acceptance criteria` \u00b7 `# Out of scope` \u00b7 `# Log` |\n| `evidence` | free-form prose, optionally `# Citations` |\n\n`index.md`, `log.md`, `howto.md`, `README.md`, `TODO.md`, `map.md` and the\nthree agent-skills configuration files are reserved \u2014 no `type`, no `id`.\n\nTemplates for each live in\n[reference/agent-skills/templates/](reference/agent-skills/templates/).\n\n## Status\n\nTwo vocabularies, disjoint by type. A `task` uses the tracker's lifecycle\n(`Not Ready` \u2192 `Ready for Development` \u2192 `In Progress` \u2192 `Testing` \u2192\n`Complete` \u2192 `Delivered`, plus `Superseded`). Everything else uses the document\nlifecycle: `draft`, `active`, `amended`, `superseded`, `deprecated`. `amended`\napplies only to a decision or a principle, and exists so a decision corrected\nin detail does not read as untouched.\n\n## Conventions\n\n- **Supersede, don't delete.** When a decision changes, set\n  `status: superseded`, link the replacement in the body, and record it in\n  [log.md](log.md). Hard-delete only genuinely erroneous entries.\n- **An Approach node names the goal it serves.** `serves:` on a plan or a spec\n  is what lets a reverse walk terminate in Intent. Without it, `bin/ancestry`\n  stops at the spec and the review has no why to check against.\n- **A decision declares what it governs.** `invariant:` is one sentence a\n  change could violate; `constrains:` lists the paths it covers. That is how\n  `bin/constraints` finds it without guessing at vocabulary.\n- **A running record carries `append_only: true`.** A project log, an\n  open-questions list, a state snapshot: its content legitimately runs ahead\n  of its timestamp, so the direction rule leaves it alone. A `task` gets this\n  for free \u2014 it has a `# Log` by construction.\n- **An import dates a node by its origin, never by the import.** Stamping\n  today's date on a document written in July makes every decision that cites\n  it look like a violation. Take the date from the filename, or from git's\n  first-commit date \u2014 which is why an import uses `git mv`.\n- **A running record is dated when it was opened, not when it was last\n  appended.** Each entry carries its own date; the frontmatter carries the\n  file's. Re-dating on every append would invalidate every citation of it,\n  because the direction rule would correctly see an older node citing a newer\n  one.\n- **Cite a node with a link, never in backticks.** A backticked citation is a\n  lost edge: invisible to the graph, unfollowable by a reader, and unchecked\n  by anything, so it rots the first time something is renamed. `bin/relink`\n  converts them. A bare file *name* in prose \u2014 `config.md` \u2014 is not a citation\n  and should stay as it is.\n- **Anything measured records the measurement**, with its denominator and its\n  date, so a future reader can re-check it rather than believe it.\n- **A stale note that reads as current is worse than no note.** Correct in\n  place and say what changed. `brain/bin/stale` catches the countable cases;\n  `brain/bin/reconcile` catches status against the repository.\n- **Source material is quoted, analysis is linked.** The brief lives verbatim\n  under `brain/brief/` as `evidence` with a `resource:`; anything derived from\n  it says so and shows the arithmetic.\n- **Quote any frontmatter value containing `#` or `: `.** Unquoted, a ` #`\n  opens a YAML comment and silently truncates the value, and a `: ` is a hard\n  parse error. The linter catches both.\n- **Use relative links** (`./sibling.md`, `../decisions/x.md`). A link starting\n  with `/` resolves from the repo root on GitHub and 404s; the linter errors on\n  those.\n- **A blocker is a node, not a sentence** (a blocker is a node). Another task, a whole plan\n  (which clears when its initiative is finished), or \u2014 for anything external \u2014\n  the actionable task hiding inside it, which is usually an email. A reason\n  that is neither is a constraint or a note, not a blocker.\n- **An open question that blocks work is a task** with `category: question`\n  (an open question is a task). One that blocks nothing stays evidence. There is no type for a\n  question.\n- **A fix lands with its check.** Anything a real adoption reports and that\n  changes code gets a named case in `bin/selftest`'s regression layer. Four\n  rounds of feedback produced roughly twenty changes and five checks, and the\n  same three classes \u2014 a parser, a laundering path, an install recipe \u2014 each\n  came back twice. A finding without a check is a finding you will be told\n  about again.\n- **A handoff is a projection, not a node.** `bin/handoff` renders one from\n  the graph plus a hand-written half under `plans/<initiative>/handoff/`. What\n  gets recorded is the *event* \u2014 handed to whom, when, promising what \u2014 as an\n  `append_only` evidence node, one per audience. Append when the document got\n  better; supersede when the promise changed. **Nothing ever requires a\n  handoff to exist.**\n- **Link liberally.** A link to a document not yet written is a valid marker of\n  future work.\n", "mtime": "2026-11-08T19:09:03+00:00"}, {"path": "knowledge-catalog/index.md", "meta": {"okf_version": "0.1"}, "body": "\n# Knowledge Catalog\n\nDurable knowledge about this project \u2014 the *why* that points at the code, not a\nrestatement of it. See [howto.md](howto.md) before editing by hand.\n\n## The four categories\n\n| Category | Lives in |\n|---|---|\n| **Intent** | [goals/](goals/index.md), [decisions/](decisions/index.md) \u2014 including principles |\n| **Approach** | [specs/](specs/index.md), and [../plans/](../plans/index.md) outside this catalog |\n| **Action** | [../tasks/](../tasks/README.md) |\n| **Evidence** | [reference/](reference/index.md), and [../brief/](../brief/README.md) for what was given |\n\n## Reference\n\n* [Glossary](glossary.md) \u2014 the shared vocabulary for this domain\n* [Change log](log.md) \u2014 what was written when\n", "mtime": "2026-11-08T18:03:16+00:00"}, {"path": "knowledge-catalog/log.md", "meta": {}, "body": "# Change log\n\nNewest first. `**Creation**` / `**Update**` / `**Supersession**`.\n\n## 2026-11-10\n\n**Creation** \u2014 [E0008](reference/E0008-the-profile-did-not-beat-the-control-and.md) The profile did not beat the control and the operator scored at chance\n\n**Creation** \u2014 [T0017](../tasks/voice/T0017-experiment-population-matched-exemplar-retrieval-versus-a-described.md) Experiment: population-matched exemplar retrieval versus a described profile\n\n**Creation** \u2014 [T0016](../tasks/voice/T0016-run-the-held-out-regeneration-diff-against-a.md) Run the held-out regeneration diff against a pristine test set\n\n**Creation** \u2014 [E0007](reference/E0007-state-of-the-art-for-reproducing-a-specific.md) State of the art for reproducing a specific person's writing voice\n\n## 2026-11-09\n\n**Creation** \u2014 [E0006](reference/E0006-the-operator-rejected-a-profile-that-passed-every.md) The operator rejected a profile that passed every marker\n\n**Creation** \u2014 [D0021](decisions/D0021-a-profile-is-derived-per-text-population-not.md) A profile is derived per text population, not from paragraphs alone\n\n**Creation** \u2014 [E0005](reference/E0005-markers-are-genre-sensitive-and-the-checker-must.md) Markers are genre-sensitive and the checker must read paragraph prose\n\n**Creation** \u2014 [T0015](../tasks/voice/T0015-build-the-professional-profile-from-real-samples-and.md) Build the professional profile from real samples and apply it\n\n**Creation** \u2014 [T0014](../tasks/voice/T0014-license-the-project-mit-and-complete-the-plugin.md) License the project MIT and complete the plugin manifest\n\n**Creation** \u2014 [T0013](../tasks/voice/T0013-restate-the-hedging-rules-as-ownership-and-falsifiability.md) Restate the hedging rules as ownership and falsifiability\n\n**Creation** \u2014 [D0020](decisions/D0020-craft-governs-ownership-and-falsifiability-a-profile-governs.md) Craft governs ownership and falsifiability; a profile governs how much\n\n**Creation** \u2014 [E0004](reference/E0004-what-the-professional-craft-skill-could-not-say.md) What the professional craft skill could not say without knowing the writer\n\n**Creation** \u2014 [T0012](../tasks/voice/T0012-write-the-professional-register-craft-skill.md) Write the professional register craft skill\n\n**Creation** \u2014 [T0011](../tasks/voice/T0011-ship-the-plugin-skeleton-so-the-library-installs.md) Ship the plugin skeleton so the library installs\n\n**Creation** \u2014 [D0019](decisions/D0019-humanize-me-ships-as-a-claude-code-plugin.md) humanize-me ships as a Claude Code plugin and the profile lives at user scope\n\n**Creation** \u2014 [D0018](decisions/D0018-a-voice-profile-states-its-claims-checkably.md) A voice profile states its claims checkably\n\n**Creation** \u2014 [D0017](decisions/D0017-writing-reached-through-mcp-is-distilled-in-flight.md) Writing reached through MCP is distilled in flight and never stored\n\n**Creation** \u2014 [D0016](decisions/D0016-the-corpus-is-sorted-into-per-register-folders.md) The corpus is sorted into per-register folders by hand\n\n**Creation** \u2014 [D0015](decisions/D0015-a-voice-profile-is-optional-and-the-skills.md) A voice profile is optional and the skills degrade without one\n\n**Creation** \u2014 [D0014](decisions/D0014-registers-are-organized-by-burden-of-proof-not.md) Registers are organized by burden of proof, not formality\n\n**Creation** \u2014 [D0013](decisions/D0013-the-craft-ships-generic-and-the-voice-is.md) The craft ships generic and the voice is a generated profile\n\n**Creation** \u2014 [G0003](goals/G0003-an-agent-writes-human-facing-prose-in-the.md) An agent writes human-facing prose in the operator's own voice\n\n## 2026-11-08\n\n**Creation** \u2014 [D0012](decisions/D0012-make-it-adoptable-first-then-dogfood-it-as.md) Make it adoptable first, then dogfood it as an end user\n\n**Creation** \u2014 [D0011](decisions/D0011-only-prose-with-a-human-reader-is-in.md) Only prose with a human reader is in scope\n\n**Creation** \u2014 [D0010](decisions/D0010-brain-tasks-replaces-an-external-tracker.md) brain/tasks replaces an external tracker\n\n**Creation** \u2014 [G0002](goals/G0002-humanize-me-installs-into-another-project-in-one.md) humanize-me installs into another project in one step\n\n", "mtime": "2026-11-10T17:47:19+00:00"}, {"path": "knowledge-catalog/reference/E0004-what-the-professional-craft-skill-could-not-say.md", "meta": {"id": "E0004", "type": "evidence", "title": "What the professional craft skill could not say without knowing the writer", "description": "Thirteen gaps found by writing the professional register skill craft-first, and the finding that most of them are not countable \u2014 which bears on the marker emphasis in D0018.", "timestamp": "2026-11-09", "tags": ["voice", "profile", "craft", "findings"], "status": "active", "resource": "../../../skills/voice-professional/SKILL.md"}, "body": "\nThe professional register skill was written craft-first and profile-free, on\npurpose: whatever it could not say without knowing the writer is, by\ndefinition, what a voice profile has to carry. These are the gaps that showed\nup, recorded while writing rather than reconstructed afterwards.\n\n# The gaps\n\nThirteen, grouped by whether a script could measure them.\n\n**Countable.** A checker can measure these in generated output with no model\nin the loop, which is what [D0018](../decisions/D0018-a-voice-profile-states-its-claims-checkably.md)\nasks for.\n\n| Gap | What the skill had to leave open |\n|---|---|\n| Sentence rhythm | Length distribution and variance \u2014 short and punchy, or long and subordinated |\n| Paragraph shape | Whether one-sentence paragraphs are a habit or a jolt |\n| Punctuation habits | Em-dashes, semicolons, parentheticals. Pure idiolect; the craft has no business having a view |\n| Bullet tolerance | Where this writer's own line falls between prose and list |\n| Habitual openers and closers | Which moves they actually make, as opposed to which ones are available |\n| Formality surface | Contractions, greetings, sign-offs, whether the reader gets named |\n\n**Not countable.** No script reaches these, and they are the ones that decide\nwhether a passage sounds like the person.\n\n| Gap | What the skill had to leave open |\n|---|---|\n| Diction | Which concrete words this person reaches for, and which they would never use. The skill says \"prefer the concrete\" and cannot say concretely *what* |\n| How a judgment gets owned | \"I think\" / \"my read is\" / \"I'd bet\" / stated flat with no marker at all. The skill lists the options; a person uses one or two |\n| How confidence gets calibrated | The actual phrases \u2014 \"probably\", \"two to one\", \"I'd be surprised if\", \"I've hit this twice\" |\n| How disagreement lands | The craft says disagree in the declarative. How hard a given person's declarative is, it cannot say |\n| Jargon tolerance | Domain shorthand versus spelling it out, which varies by writer more than by reader |\n| Self-undercutting | Whether this writer ever breaks their own register, and how |\n| What they never do | The negative space. Named in the design as the most diagnostic part of a voice and the least guessable |\n\n# Two findings beyond the list\n\n**The countable half is the minority of the value.** Six gaps are measurable\nand seven are not, and the seven are the ones that decide whether a reader\nrecognises the writer. This does not contradict\n[D0018](../decisions/D0018-a-voice-profile-states-its-claims-checkably.md) \u2014\ncountable markers are still the only thing a checker can test unattended \u2014 but\nit does caution against reading \"states its claims checkably\" as \"states its\nclaims countably\". The prose half of a profile is the larger half, and the\nheld-out comparison is the only check that reaches it.\n\n**Craft and profile can legitimately conflict on hedging level, and the skill's\nconflict rule is too blunt for it.** The skill resolves conflicts by saying the\nwarrant rules win and a profile governs only matters of taste. That is right\nfor ownership and falsifiability. It is wrong for *how much* a person hedges:\nthe craft tells a writer to stop over-hedging, and some writers authentically\nhedge more than others above that floor. Applied as written, the rule flattens\nevery user toward one hedging level \u2014 the opposite of the point. The profile\nformat needs a way to state a personal floor that the craft rules do not\noverride.\n\n# Citations\n\n- `skills/voice-professional/SKILL.md`, written 2026-11-09 \u2014 the gaps are the\n  places that file states a general rule where a specific one was wanted\n- [T0012](../../tasks/voice/T0012-write-the-professional-register-craft-skill.md),\n  whose last acceptance criterion asked for this list\n", "mtime": "2026-11-09T17:19:20+00:00"}, {"path": "knowledge-catalog/reference/E0005-markers-are-genre-sensitive-and-the-checker-must.md", "meta": {"id": "E0005", "type": "evidence", "title": "Markers are genre-sensitive and the checker must read paragraph prose", "description": "Measurements from building the first real profile and applying it to two client documents: the marker scheme needs a genre scope and a defined text population, and first-person ownership did more than every marker combined.", "timestamp": "2026-11-09", "tags": ["voice", "profile", "markers", "verification", "findings"], "status": "active"}, "body": "\nFindings from the first end-to-end run of the design: a professional profile\nbuilt from seven published pieces by the operator, then applied to two\nclient-facing feature walkthroughs in an unrelated project.\n\nNumbers below are measured, not estimated. The corpus was 8,771 prose words:\n5 training samples (5,685 words) and 2 held out (2,302 words), per\n[D0018](../decisions/D0018-a-voice-profile-states-its-claims-checkably.md).\n\n# The checker has to define its text population\n\nThe first marker run on the rewritten paperwork document reported a median\nsentence of 12.0 words against a profile range of 15\u201322, and a short-sentence\nshare of 38% against a 15% floor. Both were partly artefacts: the measurement\nswept up figure captions, UI labels and headings as \"sentences\". \"Paperwork is\nthe new entry.\" is a caption, not prose.\n\nRe-measuring over paragraph-length blocks only \u2014 matching how the profile's own\nmarkers were derived \u2014 moved the median to 12.5. So the artefact was real but\nsmall, and the failure survived it.\n\n**A marker is meaningless without a stated population.** The profile's ranges\nwere computed over paragraph prose; a checker that measures all visible text\nwill fail documents that are merely caption-heavy. This has to be part of the\nmarker format, not a convention in whoever writes the checker.\n\n# Markers are genre-sensitive, and the profile knows it\n\nFinal measurements, same profile, same markers, two documents:\n\n| | paperwork | map |\n|---|---|---|\n| prose words | 639 | 906 |\n| sentence median (target 15\u201322) | **13 \u2014 fail** | 17 \u2014 pass |\n| short share (floor 0.15) | 0.33 | 0.21 |\n| semicolons /1k (max 0.2) | 0.0 | 0.0 |\n| exclamations /1k (max 0.0) | 0.0 | 0.0 |\n| parentheticals /1k (2\u20136) | 4.69 | 2.21 |\n| contractions /1k (min 15) | 34.4 | 21.0 |\n\nSeven of eight pass on the paperwork document and eight of eight on the map.\nThe single failure is the sentence median, and it tracks genre rather than\nvoice: the paperwork document is mostly numbered UI instructions, which are\nintrinsically short, while the map document carries more argument.\n\nThe fix was available and was **declined**. Reaching 15 would have meant\npadding instructions with subordinate clauses \u2014 a better number and a worse\ndocument, which is the exact failure\n[E0004](E0004-what-the-professional-craft-skill-could-not-say.md) predicted\nwhen it found the countable half of a profile to be the minority of its value.\n\nThe profile already carries the explanation in its own `gaps:` field: every\nsource was a published blog post or interview, so there is no instructional or\ncorrespondence writing in the corpus at all. **A marker range inherits the\ngenre of the corpus it was measured on**, and the format needs somewhere to say\nso \u2014 either a genre scope per marker, or a marker set per genre.\n\n# What actually changed the documents\n\nRanked by effect on the prose, not by measurability:\n\n1. **First-person ownership.** Both originals contained zero instances of \"I\".\n   Every judgment was unattributed \u2014 \"Those are the next steps\", \"it can be\n   turned off\". The rewrites own them: \"I set the consent date two weeks out on\n   purpose\", \"It's the piece I'm least sure about\". This is the largest change\n   and no marker measures it.\n2. **Specific limitations.** The paperwork original admitted \"Those are the\n   next steps\" and nothing more. The rewrite says what you will and will not\n   know, and adds a third limitation the original omitted entirely: nothing\n   reads the uploaded document, so a stale W-9 sends as cheerfully as a current\n   one. The map original was already strong here \u2014 \"in one measured case by\n   about seven miles\" is the operator's own voice arriving unassisted.\n3. **Contractions.** 0 before, 34.4 and 21.0 per 1,000 words after. Mechanical,\n   measurable, and the single cheapest change.\n4. **Closing on a position.** Both originals ended on \"Reply to the email this\n   came with\". Both now end on what the operator most wants back from the\n   review, and why.\n5. **Semicolons removed.** Three in the map document, none in the corpus.\n\nItems 3 and 5 are countable. Items 1, 2 and 4 are not, and they are the ones a\nreader would notice.\n\n# Corpus gaps worth recording\n\n- **Two of nine sources were unreachable.** Both Medium posts returned 403 to\n  every fetch attempt. They were the operator's laid-back-audience pieces, so\n  the loss falls on the casual register rather than this one \u2014 but it means a\n  corpus cannot be assumed fetchable, and the generator will need a path for\n  writing the operator supplies directly.\n- **Dash style is unsettled in the corpus itself.** The 2026 post uses `--`\n  31 times and the em-dash never; the 2024 post inverts it exactly. Recorded in\n  the profile as unstable rather than asserted as a habit. A generator reading\n  this corpus naively would have produced a confident false marker.\n- **The corpus skews old on bullets.** The 2021 sample is 50% bullet lines at a\n  23-word median; the 2024 and 2026 samples run 15\u201316 words with far fewer.\n  The profile weights recent work and says so, which is a judgment a script\n  would not have made.\n\n# Not yet done\n\nThe held-out regeneration diff has not run. Two samples (2,302 words) were\nreserved for it and remain unread by the profile. Until it runs, this profile\nis verified by markers only, and its own `verified:` field says exactly that.\n\n# Citations\n\n- `~/.claude/voice/profile/professional.md`, built 2026-11-09\n- `smart-labor-management/brain/plans/subcontractor-paperwork/handoff.html` and\n  `smart-labor-management/brain/plans/subcontractors/map-handoff.html`,\n  rewritten 2026-11-09; originals preserved as `.bak` beside each, that project\n  being outside version control\n- [T0015](../../tasks/voice/T0015-build-the-professional-profile-from-real-samples-and.md)\n", "mtime": "2026-11-09T18:02:58+00:00"}, {"path": "knowledge-catalog/reference/E0006-the-operator-rejected-a-profile-that-passed-every.md", "meta": {"id": "E0006", "type": "evidence", "title": "The operator rejected a profile that passed every marker", "description": "A document scoring 8 of 8 on the profile's own markers was rejected by the operator as an impression of their voice; the two causes were headings and invented landing sentences, neither of which any marker measures.", "timestamp": "2026-11-09", "tags": ["voice", "profile", "verification", "findings"], "status": "active", "amends": ["E0005-markers-are-genre-sensitive-and-the-checker-must.md"]}, "body": "\nThe map handoff rewritten under the first real voice profile passed **8 of 8**\ncountable markers ([E0005](E0005-markers-are-genre-sensitive-and-the-checker-must.md)).\nShown it in a browser beside the original, the operator's verdict:\n\n> \"i think it sounds like you doing an impression of me. headings like ''what a\n> column of addresses can't tell you'' sounds pretty weird, it's not something\n> i'd write as an opening heading. I'd probably say something like 'Why we built\n> a map'.\"\n\nThis is the single most useful measurement the project has taken, because it\nsettles something that was previously an argument: **a full marker pass is not\nevidence that a profile works.** Every number was inside its range and the prose\nwas still wrong.\n\n# Cause 1 \u2014 headings were never a measured population\n\nThe profile measured sentences, punctuation, diction, hedging and rhetorical\nmoves, all derived from paragraph prose. It said nothing about headings. So the\nrhetorical moves found in the operator's *paragraphs* \u2014 reframing, negation\nconstructions like \"The problem isn't that models want to lie\" \u2014 were applied to\na *heading*, where the operator never uses them.\n\nChecked against the corpus afterwards, which should have happened first.\nTraining-set headings take three shapes and nothing else:\n\n| Shape | From the corpus |\n|---|---|\n| Noun phrase naming the subject | \"Background Information\", \"The Optimization Loop\", \"The LLM-as-Judge Problem\", \"Bash Uploader Deprecation Plan\" |\n| Plain question, usually from the reader's side | \"Why did Codecov build Impact Analysis?\", \"How do I Use the New Uploader?\", \"How Can Impact Analysis Help Me?\" |\n| \"What X\" naming what follows | \"What We Measure (and Why Accuracy Comes First)\", \"What the Pipeline Actually Looks Like\" |\n\nPlus one imperative to close: \"Start with Measurement\".\n\n**Not one of the corpus headings withholds its subject.** And the operator's\nproposed fix, \"Why we built a map\", is a near-exact match for a heading already\nin their corpus \u2014 \"Why did Codecov build Impact Analysis?\" Their instinct\nmatched their own writing; the generated heading matched neither. The evidence to\nget this right was sitting in the training set, unexamined because headings were\nnot in the population being measured.\n\n# Cause 2 \u2014 landing sentences coined instead of compressed\n\nThe profile named the operator's strongest rhythm feature correctly \u2014 a long\nanalytical build ending on a short declarative \u2014 and then reproduced it wrongly.\n\nIn the corpus, these landings **restate or label what the paragraph just\nestablished**: \"We test what we ship.\" follows a description of the deployed\nagent. \"Build them first.\" follows the whole argument. \"That's a feature, not a\nbug.\" labels a limit just described.\n\nThe rewrites instead **coined new material** at the landing position: \"That last\npart is the one that costs you later\" (introduces a cost the paragraph never\nmentioned), \"If it's misbehaving in front of a client, that's the lever\" (a\nmetaphor arriving from nowhere), \"exactly as cheerfully as a current one\" (a\nflourish), \"the half that turns this from a sending tool into a record\" (a\nreframe the paragraph had not earned).\n\nEach is defensible in isolation. Together they are the impression: a flourish\nappearing where the operator would have restated something plainly. **The\ndistinction is mechanical enough to state as a rule** \u2014 if the short sentence\ncontains a claim the paragraph did not make, it is not this writer's landing.\n\n# What this says about the verification design\n\n[D0018](../decisions/D0018-a-voice-profile-states-its-claims-checkably.md) is\nnot wrong, but the weight it implies is. Markers caught real things here \u2014\ncontractions 0 to 21 per 1,000 words, three semicolons removed from a corpus\nthat contains one in 5,685 words \u2014 and all of it was invisible to the reader\ncompared with two failures no marker can see.\n\n[E0004](E0004-what-the-professional-craft-skill-could-not-say.md) predicted the\nratio from the other direction, counting seven uncountable gaps against six\ncountable ones. This is the same finding arriving as a measurement instead of a\nprediction, and it raises the priority of the held-out regeneration diff, which\nis the only check in the design that could have caught either cause. **It has\nstill not been run.**\n\n# Fixes applied\n\n- The profile gained a **Headings** section derived from the corpus, stating the\n  three shapes, the prohibition on withholding, the \"Why we built X\" form, and\n  Title Case as a default that defers to the destination's house style.\n- The landing rule became \"compress, never coin\", with the four rejected\n  inventions named so the failure is recognisable.\n- Both documents were corrected: headings to \"Why we built a map\" and \"Why we\n  built the packet\", and every coined landing cut or made plain.\n- The profile's `verified:` field now records that the operator reviewed it,\n  that markers passed, and that the prose was rejected anyway.\n\n# Citations\n\n- Operator review, 2026-11-09, in session \u2014 both documents shown in a browser\n  beside their originals\n- `~/.claude/voice/profile/professional.md`, revised the same day\n- [T0015](../../tasks/voice/T0015-build-the-professional-profile-from-real-samples-and.md)\n", "mtime": "2026-11-09T18:42:25+00:00"}, {"path": "knowledge-catalog/reference/E0007-state-of-the-art-for-reproducing-a-specific.md", "meta": {"id": "E0007", "type": "evidence", "title": "State of the art for reproducing a specific person's writing voice", "description": "A literature survey of exemplars, fine-tuning, authorship-verification metrics, activation steering and critique loops, with the measured numbers and what each needs; the published failure modes match E0006's exactly, and no automated metric correlates well with an author's own verdict.", "timestamp": "2026-11-10", "tags": ["voice", "profile", "verification", "research", "findings", "metrics"], "status": "active"}, "body": "\nResearch done 2026-11-10 against the question: what beats a hand-written\ndistilled style profile at making a model write like one named person, and what\ncan measure whether it worked.\n\nThe short version is that the literature has already measured our failure.\n[E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md) found that a\nprofile can pass every countable marker and still read as an impression. Two\nindependent 2026 preprints find the same thing with denominators attached: a\ndistilled profile is the *best* of the inference-time methods on\ndescription-shaped metrics and on function-word stylometry, and is **not** the\nbest on authorship-verification metrics, and none of the methods clear the floor\nset by two different humans writing about the same thing.\n\nEqually important and less comfortable: the best-validated automated metric in\nthis area correlates with writers' own judgments of \"does this sound like me\" at\n**r = 0.244** (n = 81). There is no metric here that would have predicted the\noperator's rejection. That bounds what any checker we build can promise.\n\nA note on provenance. Everything below was read at its primary source \u2014 arXiv\nabstract or full text, ACL Anthology, model card, or official vendor\ndocumentation. Several of the most on-point papers are 2026 arXiv preprints with\nno venue I could confirm, and two of them share a single independent author;\nthose are flagged where they are load-bearing. Three PDF extractions returned\nunusable or implausible text, and the numbers they would have supplied are\nlisted in *What I could not verify* rather than reported.\n\n# Why the imitation fails in the first place\n\nThis belongs first because it reframes the other sections. The failure is not\nthat the model ignores the profile. The failure is that it obeys the profile\n*inside its own style space*.\n\n**The generated text is author-discriminable and still not author-like.**\n*Theory-Grounded Evaluation Exposes the Authorship Gap in LLM Personalization*\n(arXiv [2604.26460](https://arxiv.org/abs/2604.26460), Sawant, v1 2026-04-29,\nv2 2026-08-14) and its companion *PersonalBench*\n([2608.19746](https://arxiv.org/html/2608.19746v1), same author, 2026-08-20)\nmeasure 50 authors and 1,000 generations from the Blog Authorship Corpus\n(104K training posts, 26K test posts, mean post length 207 words), generating\nwith Qwen3-32B and validating on GLM-4-32B. Within the generated text, LUAR\ntells the 50 target authors apart at **AUC 0.918**. Comparing generated text to\nthe real authors' text, it manages **AUC 0.632**. The model does change its\nstyle per author; the change lands somewhere else.\n\n**And the language is explicit about where.** *Catch Me If You Can? Not Yet*\n(arXiv [2509.14543](https://arxiv.org/html/2509.14543v1), Wang, Tripto, Park,\nLi & Zhou, 2025-09-18; also Findings of EMNLP 2025) tests 400+ real authors\nwith 50\u2013150 samples each across Enron email, Blog, CCAT50 news and Reddit, with\nGPT-4o, GPT-4o-mini, Gemini-2.0-Flash, Gemma-3-27B, DeepSeek-V3 and\nLlama-4-Maverick, 40,000+ generations per model. Their diagnosis of the failing\ndomains is that models \"default to an average, generic tone\". Five-shot\nauthorship-verification accuracy (higher is better imitation; the authors state\n\"we assume that LLM-generated samples and the corresponding test set samples are\nfrom the same authors, so the accuracy is the higher the better\"):\n\n| domain | 5-shot AV accuracy | top-5 attribution |\n|---|---|---|\n| CCAT50 (news) | 95\u201397% | 86\u201393% |\n| Enron (email) | 95\u201397% | 56\u201362% |\n| Reddit (forum) | 50\u201366% | 27\u201336% |\n| Blog | 16\u201321% | 39\u201344% |\n\nAgainst a human-text baseline of 87\u201391%. The structured, conventional registers\nwork; the personal ones collapse. GPTZero identified the generations as human\n\"always below 55% and often less than 20%\". **Our register \u2014 published blog\nposts \u2014 is the one that collapses.**\n\n**There is a measured mechanism for the flattening.** *Verbalized Sampling*\n(arXiv [2510.01171](https://arxiv.org/html/2510.01171v4), Zhang, Yu, Chong,\nSicilia, Tomz, Manning & Shi, v4 dated 2026-07-15) attributes mode collapse to\ntypicality bias in preference data rather than to the RL algorithm: annotators\nprefer text with higher base-model log-probability beyond task correctness. They\ndecompose reward with a Bradley-Terry model over 6,874 correctness-matched\nresponse pairs from HelpSteer and report a typicality coefficient of\n**\u03b1\u0302 = 0.57 \u00b1 0.07 and 0.65 \u00b1 0.07, both p < 10\u207b\u00b9\u2074**. Earlier and more\nconservatively, Kirk et al., *Understanding the Effects of RLHF on LLM\nGeneralisation and Diversity* (arXiv\n[2310.06452](https://arxiv.org/abs/2310.06452), ICLR 2024) report that \"RLHF\nsignificantly reduces output diversity compared to SFT across a variety of\nmeasures\" over two base models on summarisation and instruction following. The\nabstract states no magnitude and I did not extract one.\n\nSo the attractor is not a bug in our profile. It is in the weights, it was put\nthere by the preference data, and prompting fights it rather than removing it.\n\n# 1. In-context exemplars versus a distilled description\n\n**Head-to-head, at our scale, exemplars edge out the profile on the authorship\nmetric and lose to it on every description-shaped metric.** This is the Sawant\nresult and it is worth reading carefully, because it is our\n[E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md) in table\nform. Four inference-time methods, same 50 authors and 1,000 generations\ndescribed above; few-shot used **5 author samples with no explicit\ninstruction**; \"profile extraction\" is an abstract style description, i.e. our\nmethod; \"contrastive\" adds quantitative style signals, i.e. our markers:\n\n| method | LUAR similarity | LLM-judge trait match | function-word stylometry |\n|---|---|---|---|\n| non-personalized | 0.484 \u00b1 .019 | 0.384 \u00b1 .058 | 0.741 \u00b1 .011 |\n| few-shot (5 samples) | **0.508 \u00b1 .020** | 0.433 \u00b1 .061 | 0.749 \u00b1 .011 |\n| profile extraction | 0.502 \u00b1 .019 | **0.542 \u00b1 .060** | **0.761 \u00b1 .010** |\n| contrastive w/ features | 0.494 \u00b1 .020 | 0.447 \u00b1 .059 | 0.752 \u00b1 .011 |\n\nHuman ceiling (same author, held-out text) **0.756**; cross-author floor (two\ndifferent authors) **0.626**. Every method scores below the *floor*. And the\nthree metrics have **near-zero pairwise correlation, |r| < 0.07** \u2014 the authors'\nwords: \"they measure different constructs\".\n\nRead the profile row. It wins the LLM judge and it wins the stylometry, by\nmargins outside the error bars, and it does not win the authorship metric. That\nis a document that passes 8 of 8 markers and gets rejected by its author.\n\nCaveats, stated because this paper carries a lot of weight here: single\nindependent author, two overlapping preprints, no venue I could confirm, one\ncorpus, English blogs only, 32B-scale models only, and the few-shot/profile\ndifference on LUAR (0.508 vs 0.502) is inside the reported standard errors. The\n*ranking* is not established. The *absence of a profile advantage on the\nauthorship metric* is.\n\n**Raw history beats a generated profile on surface fidelity, and the authors say\nwhy.** *Self-supervised User Profile Generation for Personalization* (arXiv\n[2606.05336](https://arxiv.org/html/2606.05336), Ju, Qiu, Zhao & Shah,\n2026-06-03), with a Qwen3-4B-Instruct LoRA backbone on the LaMP generation\ntasks:\n\n| task | metric | raw history | BUMP (profile) | BUMP+ |\n|---|---|---|---|---|\n| LaMP-4 (news headline) | ROUGE-1 | **0.210** | 0.197 | 0.199 |\n| LaMP-5 (scholarly title) | ROUGE-1 | **0.498** | 0.490 | 0.494 |\n| LaMP-7 (tweet paraphrase) | ROUGE-1 | **0.542** | 0.530 | 0.536 |\n\nTheir explanation is the useful part: \"ROUGE rewards n-gram surface overlap with\nthe user's prior outputs, which raw history preserves verbatim, while any\nnatural-language profile \u2014 ours or otherwise \u2014 abstracts away exactly that\nidiolect.\" ROUGE is a poor proxy for voice, and this is a paper proposing\nprofiles reporting that its own profiles lose; both facts cut the same way.\n\n**In-context learning is the strongest thing anyone has got working from ~500\nwords.** *Low-Resource Authorship Style Transfer: Can Non-Famous Authors Be\nImitated?* (arXiv [2212.08986](https://arxiv.org/html/2212.08986)v3, Patel,\nAndrews & Callison-Burch, 2024-11-04) deliberately restricts to **16 posts,\n\u2248500 words** per target author, against prior work that used over 100,000 words\nfor famous authors. Their in-context method Styll scores a joint metric of\n0.29 (GPT-3) / 0.40 (BLOOM) on the Single split and 0.30 / 0.36 on Diverse,\nagainst 0.25 / 0.19 for combined hand-written linguistic rules and 0.00 / 0.04\nfor STRAP (fine-tuned GPT-2). Their own verdict: \"current approaches do not yet\nachieve mastery of this challenging task.\" We have eighteen times their corpus.\n\n**Two findings that constrain how we'd use exemplars, and both are negative.**\n\n- **More exemplars barely help.** [2509.14543](https://arxiv.org/html/2509.14543v1)\n  sweeps 2, 4, 6, 8, 10: \"including more writing examples in the prompt affects\n  the four metrics very little\", with \"limited gains in stylistic alignment\".\n  Five is as good as ten. Budget accordingly.\n- **Topic-similar retrieval makes it worse.** Same paper: \"Content-based\n  exemplar selection (+Sim ctrl) surprisingly reduces attribution performance,\n  especially in Enron, Reddit, and Blog\" \u2014 **81.28% AV accuracy against a\n  95.44% random-selection baseline on Enron**. Their reading is that narrowing\n  to a topic cluster strips stylistic range. Length-aligned selection gave\n  \"modest gains in attribution\" but lowered style-model accuracy.\n\nSo the retrieval idea in the brief \u2014 nearest corpus passages at generation time\n\u2014 has a measured negative result against it *when nearness means topical\nnearness*. Nearness by **text population** (headings retrieved for headings,\ninstructional prose for instructional prose) is a different proposal, is what\n[D0021](../decisions/D0021-a-profile-is-derived-per-text-population-not.md)\nalready asks for, and is exactly what would have caught\n[E0006](E0006-the-operator-rejected-a-profile-that-passed-every.md)'s heading\nfailure. I found no paper that tests it; it is unmeasured, not refuted.\n\n**A contrary data point on exemplars.** *Predicting Steering Vectors and Adapter\nWeights for Few-Shot Author-Style Transfer* (arXiv\n[2610.03163](https://arxiv.org/html/2610.03163), Popp, Liu, Sinhamahapatra &\nNiehues, 2026-10-02) finds three-exemplar prompting **worse than zero-shot** on\nstyle accuracy over 203 seen authors: 28.1% versus 31.0%, with quality\npreference also dropping (91.5% vs 97.9%). Their explanation: instruction\nfollowing pulls the output toward a generic register. Three scientific-paper\nabstracts is a thin and unusual exemplar budget, and this is a single preprint,\nbut it means exemplars-beat-descriptions is not a safe prior. It has to be\nmeasured on the operator's own documents.\n\n**Retrieval plus summary, rather than either.** *Integrating Summarization and\nRetrieval for Enhanced Personalization via Large Language Models* (arXiv\n[2310.20081](https://ar5iv.labs.arxiv.org/html/2310.20081), Richardson et al.)\nreports that an offline LLM-generated summary plus **one** retrieved sample\nmatched or exceeded a four-sample retrieval baseline on LaMP tasks 3\u20137 \u2014 75%\nfewer retrieved samples for equal or better scores; on task 1, 0.743 accuracy\nagainst 0.709 at k=4; on task 2, 0.814 F1 against 0.574. The original LaMP\nbenchmark (arXiv [2304.11406](https://arxiv.org/abs/2304.11406), Salemi,\nMysore, Bendersky & Zamani) reports retrieval augmentation giving \"a relative\naverage improvement of 12.2%\" zero-shot and \"23.5% across the benchmark\"\nfine-tuned, with more retrieved items generally better. These are preference and\nROUGE tasks, not voice tasks, so treat the direction as suggestive and the\nnumbers as off-target.\n\n**What this says for us.** Keep the profile; stop asking it to do the work\nexemplars do better. The profile's remaining job is precisely\n[E0004](E0004-what-the-professional-craft-skill-could-not-say.md)'s uncountable\nlist \u2014 negative space, the personal hedging floor, what the writer never does \u2014\nnone of which a sample of five passages can state. Add verbatim exemplars drawn\nfrom the same text population as the thing being written, about five of them,\nchosen for population match rather than topic match.\n\n# 2. Fine-tuning, LoRA and DPO on ~9,000 words\n\nThree questions: is the data enough, is there a path without a GPU, and does it\ncost anything that matters. The answers are \"possibly\", \"not really any more\",\nand \"yes, text quality\".\n\n**At our data scale, one study exists and it is a single-user case study.**\n*Small Is Enough: Per-User Style Rewriting of AI-Edited Text via LoRA Adapters*\n(arXiv [2607.29238](https://arxiv.org/html/2607.29238v1), Chakravorty,\n2026-07-31) trains per-user adapters from **487 paragraphs drawn from ~36\nscientific papers by one author** \u2014 414 source paragraphs expanded to 1,242\ntraining pairs by paraphrasing each through three helper models, 73 paragraphs\nand 219 pairs held out. Qwen2.5 at 0.5B/1.5B/3B/7B, 4-bit NF4 QLoRA, rank 8,\n\u03b1 16, dropout 0.05, all linear layers, 3 epochs, effective batch 16, 2,048\ntokens, lr 2\u00d710\u207b\u2074. Training took 9.53 minutes (0.5B) to 67.73 minutes (7B) on\none laptop GPU.\n\nThe composite score **plateaued at 0.69 for every model size and both decoding\nmodes**. The 7B greedy component breakdown is the interesting bit:\n\n| component | score |\n|---|---|\n| content similarity | 0.93 |\n| target similarity | 0.89 |\n| authorship | 0.53 |\n| AI-tell reduction | 0.50 |\n| **stylometric improvement** | **0.00** |\n\nLLM judges rated the rewrites 5.34 on perceived AI-ness against 6.85 for their\nhelper-model inputs (0\u201310 scale), \"22% lower\". One user, synthetic training\npairs, no human evaluation (\"No completed human-participant ratings are\navailable\"), eight source paragraphs behind the 400 judge ratings, and no\noverfitting or forgetting analysis at all. The author's own limitation: the\nexperiments \"cannot establish generalization across users, languages or amounts\nof available writing.\"\n\nNote what fine-tuning did *not* buy: stylometric improvement 0.00. Our markers\nwould not have moved.\n\n**Fine-tuning buys style and sells quality, measurably.**\n[2610.03163](https://arxiv.org/html/2610.03163) runs LoRA fine-tuning beside\ninference-time methods on the same 203 seen authors (Qwen3-4B-Instruct-2507):\n\n| method | style accuracy | quality preference rate |\n|---|---|---|\n| zero-shot | 31.0% | 97.9% |\n| few-shot prompt (3 ex.) | 28.1% | 91.5% |\n| **LoRA fine-tuning** | **49.8%** | **38.1%** |\n| manual contrastive steering | 34.5% | 94.3% |\n| learned steering | 35.0% | 89.6% |\n| hypernetwork LoRA | 36.5% | 91.3% |\n\nLoRA is the only method that moves style substantially, and it is the only\nmethod whose output people stop preferring. A 38.1% preference rate against\n97.9% is not a tradeoff we would accept on client-facing documents.\n\n**Reported minima, from official documentation.** The commonly repeated\n\"100\u2013500 examples\" figure traces to vendor guidance and blog posts, not to a\nstudy; here is what the vendors actually document.\n\n| path | documented dataset size | access needed | status |\n|---|---|---|---|\n| OpenAI SFT | minimum **10** examples; \"start with 50 well-crafted demonstrations\"; improvements at \"50\u2013100\" | API only | **Closing.** \"OpenAI is winding down its fine-tuning platform; new users cannot access it, and eligible existing customers can only create training jobs until January 6, 2027.\" |\n| Claude 3 Haiku on Bedrock | training 32\u201310,000 lines, validation 32\u20131,000, sum \u2264 10,000 | AWS account, us-west-2 | GA 2024-11-01; **requires purchasing Provisioned Throughput to serve the customized model** |\n| Fireworks SFT/LoRA | \"one JSON object per line, from 3 to 3 million lines\" | API + rented GPU | on-demand dedicated deployment is \"the only supported method for serving trained models\" \u2014 no serverless |\n| Together AI | no minimum stated in the data-preparation docs | API | see *could not verify* |\n\nAnthropic's first-party API offers no fine-tuning; the only documented Claude\npath is Claude 3 Haiku SFT on Bedrock. Supported models for OpenAI SFT are\n`gpt-4.1`, `gpt-4.1-mini`, `gpt-4.1-nano` \u2014 and that door is shutting for anyone\nnot already through it.\n\n**DPO on a corpus this small has a named failure mode.** *Style-Debiased DPO*\n(arXiv [2609.16532](https://arxiv.org/html/2609.16532v1)) describes DPO pushing\ndown rejected responses that differ from the chosen one only in style, and\nreports that the naive form lowers accuracy when the corpus is small \"because\nthe phrasings are not diverse and the distribution is narrow\". I read this from\nthe paper's own framing of related work rather than from a controlled experiment\nat 9k words, so treat it as a flag rather than a measurement.\n\n**Verdict for us.** The data might be enough, the hosted paths are closing or\ncarry standing infrastructure cost, the one study at our scale moved no\nstylometry and ran no human evaluation, and the best-measured LoRA result trades\naway two thirds of its quality preference. And a fine-tuned model is not a\nClaude Code plugin \u2014 it is a model, which breaks\n[D0019](../decisions/D0019-humanize-me-ships-as-a-claude-code-plugin.md) by\nconstruction.\n\n# 3. Authorship verification and style embeddings as the metric\n\nThis was the high-priority ask and it has the most useful answer, plus the most\nimportant bad news.\n\n## The bad news first: no metric here predicts the author's verdict\n\n*Can You Make It Sound Like You? Post-Editing LLM-Generated Text for Personal\nStyle* (arXiv [2604.24444](https://arxiv.org/abs/2604.24444), Baumler, Bao,\nNghiem, Yang, Carpuat & Daum\u00e9 III, 2026-04-27) is a pre-registered study,\n**n = 81**, in which people post-edited LLM drafts for tasks where personal\nstyle mattered to them \u2014 wedding vows, apology letters, eulogies, condolence\nletters, six of eight tasks each. LUAR-MUD was the primary metric, chosen for\nscoring highest on their authorship-identification comparison (MRR 0.5888,\nR@1 0.4506). Findings:\n\n- Post-editing raised similarity to the writer's own unassisted writing\n  (p = .0002, Hedges' g = 0.55, 95% CI 0.38\u20130.71) and lowered similarity to the\n  LLM text (g = \u22120.41).\n- Post-edited text nonetheless stayed **closer to the LLM than to the writer's\n  own control text, g = \u22121.43**, and was more stylistically homogeneous than\n  unassisted human writing (g = 1.42).\n- The one that matters most: LUAR similarity against the writers' *own*\n  perception of stylistic similarity is \"significantly positive but weakly\n  calibrated correlation (H3, **r = 0.244 \u00b1 0.076, p < .0001**)\".\n- Participants rated their post-edited text as **no less representative of their\n  personal style than their own unassisted writing** (p = .9062, g = 0.01),\n  while the embedding still saw LLM traces.\n\nSo the metric and the author disagree, in both directions, and the disagreement\nis the normal case rather than an edge case. Add the |r| < 0.07 between LUAR,\nLLM-judge and stylometry from [2604.26460](https://arxiv.org/abs/2604.26460) and\nthe picture is four measuring instruments that do not agree with each other or\nwith the person. **An embedding score is a regression tripwire, not an acceptance\ntest.** It will catch a document drifting away from the corpus. It will not tell\nus the operator will accept it.\n\n## What is runnable, and which model to pick\n\nAll three of these are RoBERTa-scale encoders in the 82M\u2013125M parameter range on\nHuggingFace \u2014 trivially CPU-runnable, and small enough to vendor into a plugin's\nlocal script.\n\n**LUAR** \u2014 *Learning Universal Authorship Representations*, Rivera-Soto, Miano,\nOrdonez, Chen, Khan, Bishop & Andrews,\n[EMNLP 2021](https://aclanthology.org/2021.emnlp-main.70/). Contrastively\ntrained to score whether two *collections* of documents share an author; zero-\nshot transfer tested across Amazon reviews, fanfiction and Reddit comments, with\nthe abstract reporting variable success by domain pair. Checkpoint\n[`rrivera1849/LUAR-MUD`](https://huggingface.co/rrivera1849/LUAR-MUD),\n**82.5M parameters**, Apache-2.0, `trust_remote_code=True`, trained on the\nReddit Million User Dataset; code at [LLNL/LUAR](https://github.com/LLNL/LUAR),\nApache-2.0. **It consumes \"episodes\" \u2014 several documents presumed to share an\nauthor \u2014 and gives no per-document vector**, which is why the genealogy paper\nbelow had to exclude it from a per-document analysis. For us that means scoring\na single generated document requires deciding what its episode is.\n\n**Wegmann style embeddings** \u2014 *Same Author or Just Same Topic? Towards\nContent-Independent Style Representations*, Wegmann, Schraagen & Nguyen, arXiv\n[2204.04907](https://arxiv.org/abs/2204.04907), RepL4NLP 2022. The contribution\nis a variation of the authorship-verification training task that **controls for\ncontent using conversation or domain labels**, because \"as the same author might\ntypically write about certain topics, representations trained on AV might also\nencode content information instead of style alone\". Their finding, verbatim:\n\"representations trained by controlling for conversation are better than\nrepresentations trained with domain or no content control at representing style\nindependent from content.\" Checkpoint\n[`AnnaWegmann/Style-Embedding`](https://huggingface.co/AnnaWegmann/Style-Embedding),\n`roberta-base`, a sentence-transformers model producing 768-dimensional\nvectors \u2014 so it *does* give a per-document vector, unlike LUAR.\n\n**StyleDistance** \u2014 Patel, Zhu, Qiu, Horvitz, Apidianaki, McKeown &\nCallison-Burch, arXiv [2410.12757](https://arxiv.org/html/2410.12757v2)v2,\n2025-02-08. Trained on SynthStel: ~320,000 contrastive triplets over 40 style\nfeatures in 7 linguistic categories, from 100 GPT-4-generated parallel pairs per\nfeature where style varies and meaning is held constant. `roberta-base` with\nLoRA r=8. Checkpoint\n[`StyleDistance/styledistance`](https://huggingface.co/StyleDistance/styledistance).\nTheir reported comparison on the STEL framework and its content-controlled\nvariant (Wegmann & Nguyen, *Does It Capture STEL?*,\n[EMNLP 2021](https://aclanthology.org/2021.emnlp-main.569/) \u2014 1,830 tasks across\n4 style dimensions):\n\n| model | STEL | STEL-or-Content | AV ROC-AUC (avg) | style-transfer eval |\n|---|--
