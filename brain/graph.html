<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>humanize-me · brain</title>
<style>
/* Console palette. Cyan is the chrome accent because every other terminal
   colour is already spoken for by a status ring — yellow is draft, amber is
   In Progress, blue is Ready, green is Complete. */
:root{--bg:#f3f3f1;--panel:#fbfbfa;--chrome:#eceeef;--ink:#16181d;--muted:#6b7280;--line:#d2d5da;--edge:#bdc2c9;--accent:#0e7490;
      --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#141922;--chrome:#0a0e14;--ink:#d7dde5;--muted:#7d8795;--line:#232a35;--edge:#2b3341;--accent:#22d3ee}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
/* Two fixed rows: controls, then legend. Neither wraps — the legend scrolls
   sideways instead, which is what the old single flex row did badly. */
header{background:var(--chrome);border-bottom:1px solid var(--line);font-family:var(--mono)}
.bar{display:flex;align-items:center;gap:14px;padding:7px 12px;white-space:nowrap}
header h1{font-size:12px;margin:0;font-weight:600;letter-spacing:.02em;color:var(--ink)}
header h1::before{content:'▸ ';color:var(--accent)}
header .meta{color:var(--muted);font-size:11px;letter-spacing:.01em}
.spacer{margin-left:auto}

/* [ ] / [x] instead of a native checkbox — cheap, and it reads as a console. */
.toggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle::before{content:'[ ]';font-family:var(--mono);letter-spacing:-.5px}
.toggle:has(input:checked){color:var(--accent)}
.toggle:has(input:checked)::before{content:'[x]'}
.toggle:has(input:disabled){opacity:.35;cursor:default}
.toggle:not(:has(input:disabled)):hover{color:var(--ink)}

#searchwrap{position:relative;display:inline-flex;align-items:center}
#searchwrap::before{content:'/';position:absolute;left:8px;color:var(--accent);font-family:var(--mono);font-size:12px;pointer-events:none}
#search{font-family:var(--mono);font-size:11.5px;padding:5px 24px 5px 19px;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);width:300px}
#search:focus{outline:none;border-color:var(--accent)}
#search::placeholder{color:var(--muted);opacity:.7}
#clear{position:absolute;right:4px;width:15px;height:15px;padding:0;border:0;border-radius:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
#clear:hover{color:var(--accent)}
/* display:flex above beats the hidden attribute's display:none, so the
   clear button was showing with nothing to clear. */
#clear[hidden]{display:none}
#matches{min-width:62px;text-align:right}

/* One row per group, stacked. Twenty entries on one line overflowed at any
   realistic width; each group fits comfortably on its own, and still scrolls
   sideways rather than reflowing if the window gets very narrow. */
#legend{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 12px 6px;font-size:10.5px;color:var(--muted)}
#legend span{display:inline-flex;align-items:center;gap:4px}
#legend i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
#legend i.ring{background:transparent;border:2px solid var(--line);box-sizing:border-box}
.legend-group{display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.legend-group::-webkit-scrollbar{height:4px}
.legend-group::-webkit-scrollbar-thumb{background:var(--line)}
/* Fixed label column so the swatches line up between the two rows. */
.legend-group b.key{flex:none;width:auto;color:var(--accent);font-weight:600;letter-spacing:0;text-transform:none;font-size:inherit;opacity:1}
.legend-group>b{flex:none;width:56px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;opacity:.8}
#stage{position:relative;overflow:hidden}svg{width:100%;height:100%;display:block;cursor:grab}svg:active{cursor:grabbing}
.link{stroke:var(--edge);stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.node circle{stroke:var(--bg);stroke-width:1.5}
.node.selected circle{stroke:var(--accent)!important;stroke-width:3px!important;stroke-dasharray:none!important}
.node text{font-family:var(--mono);font-size:9.5px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.node.dim{opacity:.18}.link.dim{opacity:.08}
#panel{position:absolute;top:0;right:0;height:100%;width:min(560px,92vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel .top{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
#panel .top .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);word-break:break-all}
#panel .top h2{margin:6px 0 10px;font-size:18px;line-height:1.25}
#panel .top .path,#panel .chips,#panel .kv,#hint,.chip{font-family:var(--mono)}
#panel .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 7px;border-radius:0;font-size:11px;background:var(--bg);border:1px solid var(--line)}
.chip b{font-weight:600}.chip.status{color:#fff;border-color:transparent}
.chip--tag,.chip--filter{cursor:pointer}
.chip--tag:hover,.chip--filter:hover{border-color:var(--accent);color:var(--accent)}
.chip.status.chip--filter:hover{color:#fff;border-color:var(--ink)}
.legend-group span[data-filter]{cursor:pointer;padding:1px 3px;border-radius:3px}
.legend-group span[data-filter]:hover{background:var(--bg);color:var(--ink)}
header #matches{min-width:72px;text-align:right}
#panel .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin-top:12px;font-size:12px}
#panel .kv dt{color:var(--muted)}#panel .kv dd{margin:0;word-break:break-word}#panel .kv a{color:var(--accent)}
#panel .kv a.internal{text-decoration:underline dotted;cursor:pointer}
#panel .kv details.linkgrp{display:inline-block;margin-right:14px;vertical-align:top}
#panel .kv details.linkgrp li{display:flex;align-items:baseline;gap:6px}
/* The dot is the node's own fill, so a link reads the same way the graph does. */
#panel .kv .ldot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;display:inline-block;transform:translateY(-1px)}
/* A task's status, bordered rather than filled: it sits beside a link and must
   not compete with it for the eye. */
#panel .kv .lstatus{flex:0 0 auto;font-style:normal;font-size:9px;letter-spacing:.04em;
  text-transform:uppercase;border:1px solid;border-radius:2px;padding:0 3px;opacity:.85}
#panel .kv details.linkgrp>summary{cursor:pointer;color:var(--accent);list-style:none;display:inline-block}
#panel .kv details.linkgrp>summary::-webkit-details-marker{display:none}
#panel .kv details.linkgrp>summary::before{content:'\25b8';font-size:9px;margin-right:4px;display:inline-block}
#panel .kv details.linkgrp[open]>summary::before{content:'\25be'}
/* The coloured dot *is* the bullet now. A disc beside it would be two markers
   doing one job, and the second one carries no information. */
#panel .kv details.linkgrp ul{margin:6px 0 2px;padding:0 0 0 2px;list-style:none}
#panel .kv details.linkgrp li{margin:3px 0;line-height:1.4}
#panel .kv details.linkgrp li::marker{color:var(--muted)}
/* A dozen dotted-underlined links in a column reads as a wall. Bullets carry
   the list structure, so the links drop their underline until hovered. */
#panel .kv details.linkgrp li a{text-decoration:none}
#panel .kv details.linkgrp li a:hover{text-decoration:underline}
#panel .kv .muted{color:var(--muted);margin-right:14px}
#panel .close{position:absolute;top:12px;right:12px;border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer}
#panel .body{padding:16px 20px;overflow:auto;flex:1}
.md h1,.md h2,.md h3{margin:18px 0 8px;line-height:1.25}.md h1{font-size:18px}.md h2{font-size:15px}.md h3{font-size:14px}
.md p,.md li{font-size:13.5px}.md code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);padding:1px 4px;border-radius:4px}
.md pre{background:var(--bg);padding:10px;border-radius:6px;overflow:auto}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;font-size:12.5px}.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md a{color:var(--accent)}.md a.internal{text-decoration:underline dotted}
.md input[type=checkbox]{margin-right:6px}
#hint{position:absolute;left:12px;bottom:10px;font-size:10px;color:var(--muted);opacity:.8;font-family:var(--mono)}
#hint b{color:var(--accent);font-weight:600}

const DATA = {"generated": "2026-11-10T17:48:17+00:00", "nodes": [{"path": "CLAUDE.md", "meta": {}, "body": "# Working with this brain\n\nThe project's reasoning lives here as linked markdown with YAML frontmatter \u2014\na graph of typed nodes, no database and no service. The files are the ground\ntruth, which is what makes them equally legible to a person, a diff and you.\n\n**One principle underneath everything**\n([the principle that claims must be checkable](example/knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)): the\nrecord is only worth keeping if its claims are checkable. An absent note costs\na reader nothing \u2014 they go and look. A confident, stale note costs them the\nthing they would have found by looking.\n\n## The shape\n\nFour categories, left to right. Implementation runs forward; review runs back\nand amends what it finds false.\n\n| Category | Types | Goes in |\n|---|---|---|\n| **Intent** | `goal` `decision` `principle` | `knowledge-catalog/goals/`, `knowledge-catalog/decisions/` |\n| **Approach** | `plan` `spec` | `plans/`, `knowledge-catalog/specs/` |\n| **Action** | `task` | `tasks/<initiative>/` |\n| **Evidence** | `evidence` | `knowledge-catalog/reference/`, `brief/` |\n\nPlus `glossary` \u2014 definitional, outside the four.\n\n**Nothing cites a node newer than itself.** A goal written today may cite\nevidence from last quarter; editing that older node to point back at the new\ngoal is rewriting history. `superseded_by` and `amends` are the sanctioned\nexceptions, because a reader who reaches a stale node must be carried to its\nreplacement.\n\n**Ids** are a type letter plus four digits, flat and global: `G` goal, `D`\ndecision *and* principle, `P` plan, `S` spec, `T` task, `E` evidence. Always\nallocate with `bin/new`; never pick a number by hand.\n\n## Reflexes \u2014 these fire without being asked\n\n- **Before any significant change**: `bin/relevant \"<the change>\"` **and**\n  `bin/constraints <paths>`. The first searches by term and misses what the\n  record words differently; the second lists decisions that declared they\n  govern those paths.\n- **Before writing code for a task**: `bin/ancestry <id> --claims`. If it says\n  `\u26a0 UNTERMINATED`, the task has no recorded intent \u2014 say so before building.\n  If an ancestor says `\u26a0 SUPERSEDED`, build against the replacement.\n- **A contradicted decision is stated, never silently overridden.** Two exits\n  only: amend it, or proceed against it with the id in the task's `# Log`.\n- **Supersede, don't delete.** A decision quietly edited to match what got\n  built teaches the reader that the record is written afterwards.\n- **When you learn something the record doesn't know**, write it down then \u2014\n  `bin/new evidence`, or an entry in\n  [the running record of what the brain has caught](example/knowledge-catalog/reference/E0001-brain-in-practice.md).\n\n## Tools\n\n| | |\n|---|---|\n| `bin/lint` | the gate: taxonomy, ids, links, direction, frontmatter hazards |\n| `bin/doctor` | is the install sound |\n| `bin/status [initiative]` | task table and the claimable frontier |\n| `bin/relevant \"<change>\"` | what the record already says about a proposal |\n| `bin/constraints <paths>` | which decisions govern these files |\n| `bin/ancestry <id> [--claims]` | walk back to the intent that asked for it |\n| `bin/ancestry <id> --forward` | walk on to what that intent asked for |\n| `bin/reconcile [initiative]` | task status against the repository |\n| `bin/new <type> \"<title>\"` | allocate an id and scaffold the node |\n| `bin/stale` | countable claims that no longer match the files |\n| `bin/index` | rebuild folder indexes (`bin/new` calls it) |\n| `bin/graph-build` | rebuild `graph.html` |\n| `bin/handoff <init> --for <who>` | a self-contained page for someone outside the brain |\n\n## Skills, by where they sit on the picture\n\n**Forward** \u2014 `/grill-change` \u2192 `/to-spec` \u2192 `/to-tasks` \u2192 `/implement`\n**Back** \u2014 `/spec-review` (owns `Testing \u2192 Complete`), `/audit`\n**Off the rails** \u2014 `/interrogate` (ask the brain anything), `/triage`,\n`/wayfinder`, `/research`, `/domain-modeling`, `/code-review` (the artifact,\nnot the graph)\n\n## Don't\n\n- Hand-edit an index or a log where a skill would write it.\n- Renumber anything. Ids are cited from journals, logs and commit messages.\n  `bin/renumber` exists only to resolve a collision.\n- Write into the host repository's own `CLAUDE.md`, `CONTEXT.md` or\n  `docs/adr/`. Those are the team's: read and respect them.\n- Put code in the brain, or a restatement of the code. This holds the *why*\n  that points at the code.\n- Fill a gap with something decision-shaped. \"We didn't decide that\" is an\n  answer.\n\nDepth lives in [knowledge-catalog/howto.md](knowledge-catalog/howto.md) and\n[knowledge-catalog/reference/agent-skills/](knowledge-catalog/reference/agent-skills/index.md).\n", "mtime": "2026-11-08T19:09:03+00:00"}, {"path": "INIT.md", "meta": {}, "body": "# Filling a new brain\n\n**Run this once, in the session that installed the brain.**\n\n`bin/adopt` put the files in place; this puts the project in them. It is a\ndocument rather than a skill on purpose\n([why this is a document and not a skill](knowledge-catalog/decisions/D0010-init-is-a-document.md)): Claude Code\ndiscovers skills when a session *starts*, so a skill created by `bin/adopt`\ncannot be called by the session that just ran it. Three adoptions proved that\nthree times. Read this and follow it.\n\n`bin/adopt` installed the brain. This fills it\n([the placement and install decision](example/knowledge-catalog/decisions/D0004-placement-and-install.md)).\n\nThey are separate because they fail differently: `adopt` is mechanical and runs\nonce, this needs judgement and runs again whenever another repository is\nadopted. If `brain/config.md` does not exist, stop and say to run `bin/adopt`\nfirst.\n\n**Two paths, and you must pick one before step 1.**\n\n```bash\nls brain/knowledge-catalog/decisions/ brain/knowledge-catalog/goals/   # a brain already?\ngit -C <repo> log --oneline | head -1                                  # code history?\nls <repo>/docs <repo>/CONTEXT.md                                       # docs?\n```\n\n**Ask about the brain first.** Three rounds running, a test that looked only at\nthe repository gave a confident wrong answer: no commits and no docs said\n*greenfield* to a catalog already holding four nodes. The branches are about\nwhat is already in the brain; the repository is the second question, not the\nfirst.\n\n**Step 3 runs whichever branch you are on. Always.** Conversation history is\nindependent of code history, and the branch test below does not look at it. A\nrepository with no commits and no docs had **five transcripts holding two real\ndecisions**, and the branch told its adopter those steps were no-ops. Run\n`bin/utterances` before you conclude there is nothing to import \u2014 it\ncosts one command and it is the one place that had anything.\n\n**Greenfield** \u2014 no commits, no docs. Steps 2 and 4 are no-ops; step 3 is not.\nGo to \"Greenfield\" at the end and come back for step 5. The first adopter ran all four against an empty project, got\n`fatal: your current branch 'main' does not have any commits yet`, and found\nthe real material was in the conversation they were already having.\n\n**In flight** \u2014 a codebase with history, decisions living in people's heads,\nand docs in four places. That is the rest of this skill.\n\n**Re-adoption** \u2014 **the catalog already holds nodes.** That is the whole\ntest, and it comes before the other two. Neither branch fits: there is nothing to import that is not\nalready here, and mining the transcripts surfaces *the previous run's own\nwork*, which a second adopter duly filed as fresh findings. **Which of the steps below apply:**\n\n| Step | On a re-adoption |\n|---|---|\n| 1 \u00b7 ask the four things | **Skip 1\u20133.** `config.md` already holds them. Ask question 4 only if no goal exists. |\n| 2 \u00b7 import existing docs | **Skip.** Anything importable is already imported; re-importing duplicates it. |\n| 3 \u00b7 mine the transcripts | **Run, bounded.** See below \u2014 most of what is there is the previous run's own work. |\n| 4 \u00b7 mine git history | Run if there are commits since the last node. |\n| 5 \u00b7 report | **Run.** Say what changed and what you left alone. |\n\nRead what is already in the catalog **first**, ask the operator what has\nchanged since, and write only that. Bounding it by date does not work: everything a re-adoption produces is dated\ntoday, so `--since` returns what no filter returns. **The bound is already in\nthe catalog** \u2014 every imported node names the session it came from in\n`resource:`. Read those first, and treat any utterance from a session already\ncited as covered.\n\n## The rule that governs everything here\n\n**Date every imported node by its origin, never by the import.** Stamping\ntoday on a document written in July makes every decision citing it look like\nit cites the future, and the direction rule will say so \u2014 twenty-eight times,\nin the first real adoption. Take the date from the filename where it carries\none, and from `git log --follow --format=%ad --date=short` otherwise, which is\nthe reason to move files with `git mv` rather than copy them.\n\n**Mark running records `append_only: true`** \u2014 a project log, an open-questions\nlist, a state snapshot. Their content runs ahead of their open date by design.\n\n**Everything imported lands as `status: draft` with a `resource:` pointing at\nwhere it came from.** You are reconstructing, and a reconstruction that reads\nas a decided decision is worse than no brain at all\n([the principle that claims must be checkable](example/knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)).\n`bin/lint` reports the draft count, so the operator can see exactly how much is\nstill guesswork.\n\nNever promote a draft to `active` yourself. That is the operator confirming it,\nand it is the whole value of the import being visible.\n\n## Step 1 \u2014 ask the four things you cannot infer\n\n1. ~~Which repository?~~ **Do not ask.** `bin/adopt` already wrote it to\n   `brain/config.md` as `repos:`. Asking invites an answer that contradicts\n   the file.\n2. Where do docs already live \u2014 `docs/`, `docs/adr/`, a `CONTEXT.md`, a wiki,\n   an exported Notion space? \u2192 **write it to `docs:` in `config.md`.**\n3. What issue tracker is in use, and should `brain/tasks/` mirror it or replace\n   it? \u2192 **this is a decision, not a preference.** It has alternatives (mirror\n   / replace) and a consequence (two places to keep in step). Write it with\n   `bin/new decision`, and record the choice in `config.md` as `tracker:`.\n4. **What is this project trying to achieve?** One sentence. \u2192 a `goal` node.\n\nThe first adopter answered all four and had somewhere to put one of them.\nQuestions 2 and 3 went into the change log because nothing else fitted.\n\n**Do not proceed without the fourth.** Without a goal there is nothing for a\nlineage walk to terminate at, `/spec-review` has no intent to check against,\nand every Approach node you write will fail `serves:`. If the answer is \"a lot\nof things\", take the two that matter most this quarter and write those.\n\nWrite it: `bin/new goal \"<the outcome>\"`.\n\n## Step 2 \u2014 import what already exists\n\nIn descending order of certainty, so the most trustworthy material lands first:\n\n- **Existing ADRs** (`docs/adr/`, `docs/decisions/`) \u2192 `bin/new decision`,\n  one per ADR, `status: draft`, `resource:` the original. Keep their words; do\n  not improve them.\n- **`CONTEXT.md`, a glossary, a data dictionary** \u2192 seed\n  `brain/knowledge-catalog/glossary.md`, including the `_Avoid_` notes, which\n  are usually the most valuable part and the first thing lost.\n- **A README's architecture section** \u2192 an `evidence` node, not a decision. It\n  describes how things are, which is Evidence; what it does not say is *why*,\n  which is what a decision is for.\n\nThe host repository's own `CLAUDE.md` and `CONTEXT.md` are the team's: read\nthem, do not write to them.\n\n## Step 3 \u2014 mine the transcript history\n\nThis is the step nothing else can do, and it is usually the richest.\n\n```bash\nbin/utterances            # what the operator said, across every session\nbin/utterances --repeated # said more than once \u2014 the strongest signal\n```\n\n**Use the tool. Do not read the `.jsonl` yourself.**\n\nAn answer to `AskUserQuestion` is stored as a `tool_result` block inside a\nuser-role envelope, **not** as message text. Walk the transcript keeping\nuser-role entries with string content \u2014 the obvious approach \u2014 and you drop\nevery decision the operator made in answer to a direct question. What you find\nin their place is the **assistant's paraphrase**, in assistant text.\n\nQuote that, cite the transcript as `resource:`, and you have manufactured an\noperator decision out of the previous agent's prose with provenance that looks\nsound. `bin/utterances` reads both places and labels which is which.\n\n**The signal is not \"decision-shaped sentences\".** Those are noise, and an\nagent hunting them will manufacture a decision record out of ordinary chat.\nThe signal is:\n\n- **The same correction, made more than twice.** The operator telling Claude\n  the same thing in three different sessions is a decision or a principle that\n  was never written down. This is the highest-value extraction available\n  anywhere in this skill \u2014 it is precisely the knowledge the brain exists to\n  stop re-deriving, and nothing else in the toolchain can see it.\n- **Reversals** \u2014 \"actually, don't do that\", \"we tried that and it broke\".\n  Those are Evidence.\n- **Standing constraints** \u2014 \"never touch X\", \"always go through Y\". Candidate\n  principles.\n\nPresent candidates in batches with the quoted source, and let the operator\naccept or reject each. Do not write them unaccepted.\n\n**Quote the operator, never a summary of them.** A line tagged `[typed]` or\n`[answered]` by `bin/utterances` is theirs. Anything else in the transcript is\nan agent talking, including an agent accurately describing what they said \u2014\nand a `resource:` pointing at a transcript that contains only the paraphrase\nis a citation that cannot be checked by the person who would notice.\n\n## Step 4 \u2014 mine the git history\n\n- `git log --grep='revert\\|hotfix\\|actually'` \u2192 candidates for\n  [the running record of what the brain has caught](example/knowledge-catalog/reference/E0001-brain-in-practice.md), which\n  `/grill-change` reads first and which otherwise starts empty.\n- `CODEOWNERS` \u2192 who owns what, for `owner:` on plans and specs later.\n- Directories with the most churn \u2192 where the project's real complexity is, and\n  therefore where decisions are most likely to be undocumented.\n\n## Greenfield \u2014 when there is no history to mine\n\nSteps 2, 3 and 4 find nothing. **The live conversation is the only source of\ndecisions that exists**, and it is a good one: the first greenfield adoption\nproduced two real decisions, both lifted from chat messages, and one arrived\nsideways in the answer to a different question.\n\nApply step 3's signal discipline to the conversation instead of the\ntranscripts. You are looking for the same things:\n\n- **A constraint stated in passing.** *\"We do not care about prose that will\n  be consumed by agents\"* is a decision with alternatives and consequences,\n  dropped into an opening message as an aside.\n- **An ordering the operator has already settled.** *\"The goal here is to make\n  this an adoptable project, then we'll use the adoptable version to make our\n  own voice setup, like any other end user would\"* \u2014 a real sequencing\n  decision, arriving in a reply to a clarifying question about something else.\n- **A thing ruled out.** Anything the operator has said no to, and why.\n\nQuote the operator's words back when proposing each one, the way you would\nquote a transcript. They are the citation.\n\n**Do not invent a decision to make the record look fuller.** A greenfield\nbrain with one goal and two real decisions is in better shape than one with\neight plausible ones.\n\n**Nothing is a sanctioned outcome \u2014 but only after step 3.** The exit below is\nscoped to *this conversation*; what it gates is scoped to *the project*. Take\nit without having run `bin/utterances` and you can write a true sentence and\nreach a false conclusion, with nothing feeling wrong. A conversation about\n*evaluating* a tool contains no decisions about the project, and a session\nthat produced none, **with no older transcripts holding any either**, should\nsay so and stop:\n\n> Nothing in this conversation settles anything durable about the project. No\n> decisions written. The first one will arrive when you make it.\n\nReported by the second cold adopter, whose session contained zero project\ndecisions while the skill told them the live conversation was a good source.\nAn agent told material is there will find material. That is the manufacturing\nthis skill forbids two paragraphs up, and forbidding it without offering an\nexit is what makes it happen.\n\n**Same-day forward references are fine.** Everything written during init\ncarries today's date, so the direction rule cannot fire among these nodes \u2014\na goal may link a decision written minutes later. Do not order your writes\naround it or back-date anything to force a sequence. The rule is about\n*imported* nodes, which carry origin dates.\n\n## Step 5 \u2014 report what you did and what is still guesswork\n\n```bash\nbin/lint && bin/doctor && bin/graph-build\n```\n\nThen say plainly: how many nodes were imported, how many are `draft`, what you\ncould not find, and what the operator should confirm first. **The gaps are the\nuseful half of this report** \u2014 a brain that claims to have captured a project\nit has only skimmed is the failure this whole skill is shaped to avoid.\n", "mtime": "2026-11-08T19:09:03+00:00"}, {"path": "README.md", "meta": {}, "body": "# brain\n\nEverything that is **about** the work rather than part of it: the goals, the\ndecisions, the plans, the tracker and what you learned afterwards \u2014 as linked\nmarkdown with YAML frontmatter, in Google's\n[Open Knowledge Format](https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf).\n\nNo database and no service. The files are the ground truth, which is what makes\nthem equally legible to a person, a diff and an agent.\n\n<picture>\n  <source media=\"(prefers-color-scheme: dark)\" srcset=\"docs/lineage-dark.svg\">\n  <img src=\"docs/lineage.svg\" alt=\"Four dashed regions left to right: Intent holding a goal and a decision, Approach holding a plan and two specs, Action holding four tasks, and Evidence holding two evidence nodes. Arrows run from intent through approach and action to evidence. Beneath, one arrow labelled IMPLEMENTATION runs left to right and one labelled REVIEW / AMEND runs right to left.\">\n<\/picture>\n\n## The one idea\n\n**The record is only worth keeping if its claims are checkable.**\n\nAn absent note costs a reader nothing \u2014 they go and look. A confident, stale\nnote costs them the thing they would have found by looking, because they stop\nlooking. So the value of this is not how much it holds; it is the probability\nthat what it holds is true. Everything below exists to protect that probability\nwith a tool rather than with vigilance.\n\n## The four categories\n\nEvery node is in exactly one, and they run left to right:\n\n| Category | Types | Answers |\n|---|---|---|\n| **Intent** | `goal` `decision` `principle` | what we're trying to do, and what we've settled |\n| **Approach** | `plan` `spec` | how we mean to do it |\n| **Action** | `task` | what gets done |\n| **Evidence** | `evidence` | what we observed, and what it corrects |\n\nTwo traversals, and both are a skill:\n\n- **Implementation** runs forward. `/grill-change` interrogates a proposal\n  against what's already decided, `/to-spec` and `/to-tasks` turn it into work,\n  `/implement` builds it.\n- **Review / amend** runs back. `/spec-review` walks from the shipped change to\n  the intent that asked for it, asks whether it still serves that intent \u2014 and\n  **amends what the build made false**, which is why the rail is one arrow and\n  not two. The amend is the output of the review, not a separate journey.\n\nNodes carry an id: a type letter and four digits, flat and global. `G` goal,\n`D` decision *and* principle, `P` plan, `S` spec, `T` task, `E` evidence.\n\n**Nothing cites a node newer than itself.** A goal written today may cite\nevidence an earlier effort produced; editing that earlier node to point at the\nnew goal is rewriting history. The linter checks it.\n\n## Getting started\n\n**Fork this repository.** Then install it one of two ways, and the difference\nmatters more than it looks.\n\n### Embedded \u2014 the brain lives inside your repo (the default)\n\n**Copy the files, do not clone.** A clone puts a `.git` inside the brain, and\nyour repo then tracks a *gitlink* it cannot resolve \u2014 one entry instead of\neighty files. Your knowledge would be invisible to the repo it is supposed to\nbe versioned with, which is the whole point of embedding it.\n\n```bash\ncd <project> && git init             # if it is not a repo yet; adopt requires one\ngit clone https://github.com/<you>/brain.git /tmp/brain-template\ncp -R /tmp/brain-template <project>/brain\nrm -rf <project>/brain/.git          # \u2190 the important line\ncd <project>/brain\nbin/adopt                            # add --with-ci to install the workflow\n```\n\n`bin/doctor` fails if you skip the `rm -rf`, so you will not get this wrong\nquietly.\n\n**Keeping `example/` reserves the ids it holds**, so your first decision is\n`D0010` rather than `D0001`. That is deliberate \u2014 the template's own record is\nrelocated, not deleted, and its ids are still in the tree, so reissuing them\nwould put two `D0001`s in one brain. `bin/adopt --bare` removes the example\nand starts you at `D0001`.\n\n**Updating later**: the brain splits into the generic half (`bin/`, `skills/`,\n`hooks/`, `templates/`, `.github/`) and yours (`knowledge-catalog/`, `tasks/`,\n`brief/`, `work/`, `config.md`). Upstream only ever changes the first, so an\nupdate is re-copying the generic directories over the top \u2014 `bin/`, `skills/`,\n`hooks/`, `docs/` and `.github/` \u2014 plus\n`knowledge-catalog/reference/agent-skills/templates/`, which lives inside your\nhalf of the tree but is ours. Everything else is yours. No remotes, no\nsubtree.\n\n```bash\nbrain/bin/update --from https://github.com/<you>/brain.git\nbrain/bin/update --list        # exactly what counts as generic\n```\n\nIt was a shell recipe here, and a recipe nobody runs rots: it pulled a clone\nin `/tmp`, looped over directories only \u2014 so `INIT.md`, a top-level file,\nnever arrived \u2014 and the commit that introduced the hole edited this README in\nfive other places and left the recipe byte-identical. `bin/selftest` runs the\ntool.\n\n### Sibling \u2014 the brain is its own repo in a workspace\n\nHere a clone is exactly right, because the brain **is** the repository:\n\n```bash\ncd <workspace>                       # holds the brain and your project repos\ngit clone https://github.com/<you>/brain.git brain\ncd brain && bin/adopt --sibling\ngit remote add template https://github.com/hootener/brain.git   # for upstream fixes\n```\n\n### Then, either way\n\nIn the same session:\n\n> read `brain/INIT.md` and follow it\n\nA document rather than a skill, deliberately. Claude Code discovers skills when\na session *starts*, so one `bin/adopt` has just created cannot be called by the\nsession that ran it \u2014 and \"restart Claude Code\" is no instruction at all when\nthe reader *is* the session ([why this is a document and not a skill](knowledge-catalog/decisions/D0010-init-is-a-document.md)).\n\n`bin/adopt` **installs** \u2014 links the skills so Claude Code can see them, stamps\nthe dates, records the layout, runs the checks. `INIT.md` **fills** \u2014 reads\nyour repository, imports the ADRs and glossary you already have, mines the\nClaude transcript history for decisions nobody wrote down, and asks for the\nfirst goal. They are separate because one is mechanical and one needs\njudgement.\n\n**It works on a project already in flight**, which is the case it is built for.\nEverything imported lands as `status: draft` with a pointer to where it came\nfrom, so you can see exactly how much is still reconstruction.\n\n### Where to put it\n\n**Embedded (`<repo>/brain/`) is the default**, because co-versioning is the\nonly thing that makes \"this decision was true at this commit\" checkable rather\nthan asserted. The decision and the code it governs move in one commit, and the\nreviewer meets it in the pull request.\n\n**Sibling** is fully supported and required in two cases you'll hit: you don't\ncontrol the repo (client work, a shared company project, an outside\ncontribution), or one brain serves several repos.\n\nSibling means a **workspace**: the brain and the project repos side by side in\na plain folder, and you run Claude Code from the folder.\n\n```\nworkspace/\n\u251c\u2500\u2500 .claude/skills -> ../brain/skills\n\u251c\u2500\u2500 brain/                  # its own git repo \u2014 hooks and CI live here\n\u2514\u2500\u2500 acme-api/               # the project. Never written to.\n```\n\n**Nothing is written into the project repos.** Not `.claude/`, not `.github/`,\nnot `.git/hooks`. They're recorded in `config.md`'s `repos:` and read. That's\nthe entire reason to pick sibling \u2014 a shared repo stays clean, and nobody else\non it ever sees a file they didn't ask for.\n\nThe one cost, stated plainly: **start Claude Code in the workspace, not in the\nproject folder.** That's what keeps the project clean *and* what makes the\n`brain/...` prefix every skill uses resolve. `bin/adopt` prints it on the way\nout.\n\n## So what do I actually type first?\n\n**It depends on how clear the work is**, and picking wrong is cheap:\n\n| You have | Start with |\n|---|---|\n| A clear idea of what to build | `/to-spec` |\n| A proposal you want stress-tested first | `/grill-change` |\n| Something too big or too foggy to spec | `/wayfinder` |\n| A question about the project, not a change | `/interrogate` |\n\n`/grill-change` on a brand-new brain will honestly tell you it's unexamined\nground, because it is. That's worth knowing but it isn't where the value is on\nday one. **The value shows up the second time** \u2014 see below.\n\n### Day one \u2014 building something\n\nSay `INIT.md` gave you one goal: *a venue gets a usable quote in under a\nminute* (`G0001`). You want to cache the rate lookup.\n\n```\n/to-spec\n```\n\nIt asks the record first, resolves which goal this serves, and writes the\nspec as `S0001`, with `serves:` pointing at the goal. If nothing\nfits, it says so and writes the goal rather than inventing one to fill the\nfield.\n\n```\n/to-tasks\n```\n\nCuts the spec into vertical slices, each with its blocking edges, each citing\nthe decisions it carries out. Then:\n\n```console\n$ brain/bin/status pricing\ntask                                             status                 waits on  title\npricing/T0001-cache-rate-lookups-for-the-life\u2026   Ready for Development  -         Cache rate lookups for the life of a request\npricing/T0002-invalidate-the-cache-when-a-rate\u2026  Ready for Development  T0001     Invalidate the cache when a rate changes\n\nfrontier (claimable now): pricing/T0001-cache-rate-lookups-for-the-life-of-a.md\n```\n\nThen `/implement`, which reads the lineage before writing a line:\n\n```console\n$ brain/bin/ancestry T0001\nAncestry of T0001-cache-rate-lookups-for-the-life-of-a.md\n  4 document(s) upstream\n\n  terminates at: G0001 A venue gets a usable quote in under a minute\n\n  \u2500\u2500 ACTION \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     What did neighbouring work establish that this depends on?\n\n  T0001 Cache rate lookups for the life of a request\n      brain/tasks/pricing/T0001-cache-rate-lookups-for-the-life-of-a.md  \u00b7 Ready for Development\n\n  \u2500\u2500 APPROACH \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Did we take the route we said, or did it widen without being argued?\n\n  S0001 Cache the rate lookup\n      brain/knowledge-catalog/specs/S0001-cache-the-rate-lookup.md  \u00b7 active  \u00b7 via spec\n      promises: Rate lookups repeat within a quote; cache them for the life of the request.\n\n  \u2500\u2500 INTENT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Is every claim here still true, and does the change still serve it?\n\n  D0001 Prices come from the rate table, never from the model\n      brain/knowledge-catalog/decisions/D0001-prices-come-from-the-rate-table.md  \u00b7 active  \u00b7 via link\n      promises: Every figure in a proposal is looked up in the rate table; the model\n                may phrase a price but never invent one.\n```\n\nThat `terminates at:` line is the one to read. It means the work has a recorded\nintent to be checked against. If it says `\u26a0 UNTERMINATED`, nothing upstream\nexplains why this is being built \u2014 which is a finding, not a formality.\n\nThen `/spec-review`, which walks the same chain backwards, asks whether what\nshipped still serves it, lists the upstream documents the build made false, and\nmoves the task to `Complete`.\n\n### Three weeks later \u2014 where it pays back\n\nSomeone (possibly you, possibly an agent) proposes: *when no rate matches, let\nthe model estimate one so the quote still goes out.* Reasonable on its face,\nand it serves the sixty-second goal.\n\n```console\n$ brain/bin/relevant \"let the model estimate a price when the rate is missing\"\nBrain hits for: let the model estimate a price when the rate is missing\n  matched on: let, model, estimate, price, rate, missing\n\n  [decision] Prices come from the rate table, never from the model\n      brain/knowledge-catalog/decisions/D0001-prices-come-from-the-rate-table.md  \u00b7 active\n      \u201c- **Let the model infer a price from similar deals** \u2014 rejected: it produced\n        confident figures with no basis, and a wrong price is worse than a slow one.\u201d\n```\n\nThe exact proposal, already rejected, with the reason \u2014 found in the\n*Alternatives* section, which is where the reasoning usually lives. And because\nthe decision declared what it governs:\n\n```console\n$ brain/bin/constraints app/pricing/RateLookup.php\n  D0001  Prices come from the rate table, never from the model\n      brain/knowledge-catalog/decisions/D0001-prices-come-from-the-rate-table.md\n      must hold: No price reaches a proposal without a matching rate-table row.\n      matched:   app/pricing/RateLookup.php\n\n  A change that contradicts one of these needs a recorded exit:\n  amend the decision, or proceed against it with the id in the\n  task's `# Log`. Noting it and moving on is not one of them.\n```\n\n`/grill-change` puts that to you with the path attached, so you can check it\nrather than take its word. **Two exits, and \"noted\" isn't one**: amend `D0001`\non the record, or proceed against it with the id logged so the next reader\nfinds a deliberate exception instead of an accident.\n\nThat's the whole return on day one's bookkeeping \u2014 and it's why the first pass\nfeels like overhead and the second doesn't.\n\n### Checking an initiative is actually finished\n\n```console\n$ brain/bin/ancestry G0001 --forward\n  [task] T0001 Cache rate lookups for the life of a request  \u2190 outstanding\n  [task] T0002 Invalidate the cache when a rate changes  \u2190 outstanding\n  [spec] S0001 Cache the rate lookup\n  [decision] D0001 Prices come from the rate table, never from the model\n\n  2 of these are not done. An intent is complete when nothing\n  it asked for is outstanding \u2014 omission, not drift, and a green\n  test suite will not show it.\n```\n\nA reverse walk finds **drift** \u2014 building something subtly different from what\nwas asked. Only the forward walk finds **omission** \u2014 the spec nobody got to,\nthe task left at `Not Ready` while the initiative was called done. `/audit`\nruns both and asks you about whatever it can't judge on its own.\n\n## CI\n\nStrongly recommended, and **opt-in** \u2014 `.github/` is your team's directory, so\n`bin/adopt` describes the workflow and installs it only on `--with-ci`.\n\n`bin/lint` and `bin/stale` are what keep the record honest between reviews, and\nCI is the only place they run without somebody remembering to. The workflow\n(`.github/workflows/brain.yml`) locates the brain itself, so one file works\nembedded or sibling, and needs no setup step \u2014 every tool is stdlib Python 3.\n\n| Step | Fails the build? |\n|---|---|\n| `bin/lint` | **yes** on errors; warnings never fail \u2014 an unresolved link is a valid marker of future work |\n| `bin/stale` | **yes** \u2014 a countable claim contradicting the repo is a false statement a reader will meet |\n| `bin/doctor` | **yes** \u2014 a broken install makes everything else meaningless |\n| graph is current | **yes** \u2014 `graph.html` is generated *and committed*, so it drifts silently. `bin/graph-build --check` compares everything except the build stamp; a plain rebuild-and-diff would fail on every run, since each build stamps a fresh time into a single-line payload |\n| decisions in force | no \u2014 printed to the run summary on a PR |\n| `bin/selftest` | **yes** \u2014 a fresh install must be silent, and the foreign-content fixture must behave as designed |\n| `bin/reconcile` | no \u2014 an ambiguous status is a question for a person |\n\n> **Forking does not enable Actions.** GitHub disables workflows on a fork by\n> default; open the Actions tab once and confirm.\n\n## Skills\n\nThirteen, grouped by where they sit on the picture above.\n\n**Forward \u2014 implementation**\n\n| | |\n|---|---|\n| `/grill-change` | Interrogates a proposal against what the record already decided, measured and got wrong. Every challenge cites a path, so it's checkable rather than decision-shaped. A contradiction has two exits \u2014 amend the decision, or proceed against it with the id logged \u2014 and \"noted\" isn't one. |\n| `/to-spec` | Turns the conversation into a spec. Resolves the goal it serves first, and if none fits, says so and writes the goal rather than inventing one to fill the field. |\n| `/to-tasks` | Breaks a spec into tracer-bullet tasks with their blocking edges. Each task cites the decisions it carries out, which is the edge that makes the intent layer reachable at all. |\n| `/implement` | Builds it \u2014 after reading the lineage and the constraints. Claims the task, journals as it goes, hands off at `Testing`. |\n\n**Back \u2014 review and amend**\n\n| | |\n|---|---|\n| `/spec-review` | The reverse walk. Checks the change still serves its intent, walks *forward* to catch what the intent asked for and nobody built, and produces the list of upstream documents the build made false. Owns `Testing \u2192 Complete`. |\n| `/audit` | Reconciles a subgraph's statuses against what the repository shows, batches what's unambiguous, and asks about the rest \u2014 stating what it checked before it asks. Surfaces work done with no node at all. |\n\n**Off the rails**\n\n| | |\n|---|---|\n| `/interrogate` | The way *in*. Ask the brain a question and get an answer, not a tour \u2014 for an interviewer, a teammate, or you six weeks later asking why your own project is like this. |\n| `/triage` | Moves tasks through the triage states and writes agent-ready briefs. |\n| `/wayfinder` | For work too big to plan in one session: a map of decision tickets, resolved one at a time until the route is clear. Each resolution becomes a real decision node. |\n| `/research` | Investigates against primary sources and files the findings as evidence \u2014 after checking whether the brain already answers the question. |\n| `/domain-modeling` | Sharpens the glossary and the domain model as you design. |\n| `/code-review` | The artifact, not the graph: correctness, security, performance, standards, as parallel sub-agents. Works in a repo with no brain. |\n| `/handoff` | Builds a self-contained HTML page for whoever is picking the work up \u2014 designer, engineer, exec, analyst. Composes what the graph knows with a hand-written walkthrough. Never required. |\n\n## Tools\n\n```bash\nbin/adopt                      # install into a project\nbin/doctor                     # is the install sound\nbin/lint                       # the gate: taxonomy, ids, links, direction, frontmatter\nbin/status [initiative]        # task table and the claimable frontier\nbin/relevant \"<change>\"        # what the record already says about a proposal\nbin/constraints <paths>        # which decisions govern these files\nbin/ancestry <id> [--claims]   # walk back to the intent that asked for it\nbin/ancestry <id> --forward    # walk on to what that intent asked for\nbin/reconcile [initiative]     # task status against the repository\nbin/new <type> \"<title>\"       # allocate an id and scaffold the node\nbin/renumber <old> <new>       # the one sanctioned reason to change an id\nbin/relink                     # backticked citations of nodes become real links\nbin/handoff <init> --for <who> # a self-contained HTML page for someone outside the brain\nbin/stale                      # countable claims that no longer match the files\nbin/index                      # rebuild every folder index from the nodes present\nbin/utterances                 # what the operator actually said, from Claude Code's transcripts\nbin/selftest                   # a fresh install, and a corpus not written for this brain\nbin/graph-build                # rebuild graph.html\nbin/diagram                    # rebuild the picture at the top of this file\n```\n\nNo dependencies anywhere \u2014 stdlib Python 3.\n\n## The graph\n\n`bin/graph-build` writes `graph.html`: a browser-only force graph of every\nmarkdown file here. Nodes are files, edges are the links between them. **Fill\nis the node's `type`; the ring is its `status`.** Click a node for its metadata\nand rendered contents.\n\nThe filter bar takes `#tag`, `@type` / `@status` and plain text, ANDed. Every\nlegend entry is clickable and carries a bracketed keyboard key. **Focus**\nremoves non-matching nodes, **linked** widens by one hop, `Esc` clears.\n\n## Layout\n\n| Directory | Holds | Lifecycle |\n|---|---|---|\n| `knowledge-catalog/` | goals, decisions, specs, evidence, glossary | keep \u2014 supersede, don't delete |\n| `plans/` | how things get built | superseded by what shipped |\n| `tasks/` | the tracker. One `task` file per ticket | churns |\n| `work/` | per-worker journals, `<initiative>/<worker>.md` | kept while the initiative is open |\n| `brief/` | source material the project answers, verbatim | fixed |\n| `skills/` | the agent skills, symlinked into `.claude/skills` | generic \u2014 edit here |\n| `bin/` | the tools above | \u2014 |\n| `example/` | after `bin/adopt`: this template's own record, as a worked example | delete when you don't need it |\n| `docs/` | generated diagrams the README embeds | rebuilt by `bin/diagram` |\n| `hooks/` | the post-commit hook `bin/adopt` installs | generic \u2014 edit here |\n| `feedback/` | raw inbound: transcripts, reports. **Not in git** | delete once the findings are written |\n\n", "mtime": "2026-11-08T19:05:13+00:00"}, {"path": "brief/README.md", "meta": {}, "body": "# brief\n\n**Evidence, given rather than gathered.** Source material the project answers, as received.\nVerbatim \u2014 not analysis. Analysis lives in the knowledge catalog and links back here.\n\nA brief is an `evidence` node with a `resource:` and no `amends:` or `reviewed:` \u2014 the three\nedges are what distinguish what was given, what was measured, and what a review corrected.\n\n| File | What it is |\n|---|---|\n| *(none yet)* | Put the assignment, brief or spec here as `type: evidence`, with a `resource:` pointing at the original |\n", "mtime": "2026-11-08T18:03:15+00:00"}, {"path": "config.md", "meta": {"title": "How this brain is installed", "description": "The layout this brain was installed with, recorded rather than inferred, so the tools stop guessing where the repository root is.", "timestamp": "2026-11-08", "tags": ["brain", "config", "install"], "status": "active", "mode": "embedded", "repos": ["humanize-me"], "brain_revision": "f3ec7ca", "tracker": "brain/tasks", "docs": []}, "body": "\n# How this brain is installed\n\n`mode` is one of:\n\n| mode | Means | Repository root is |\n|---|---|---|\n| `embedded` | the brain is a `brain/` directory inside a host repository \u2014 the default ([D0004](example/knowledge-catalog/decisions/D0004-placement-and-install.md)) | the brain's parent |\n| `sibling` | the brain is its own repository inside a workspace folder, beside the project repos it describes | the brain itself |\n| `template` | this is the unadopted template; `bin/adopt` has not run | the brain itself |\n\nIn **both** modes `.claude/skills` is linked into the brain's *parent*, because\nthat is the directory Claude Code is run from and the only one where the\n`brain/...` prefix every skill uses resolves. In sibling mode that parent is a\nplain workspace folder \u2014 **the project repos listed in `repos:` are read and\nnever written to**, which is the entire reason to choose sibling.\n\n`brain_revision` is the upstream commit the generic half came from, stamped by\n`bin/adopt` at install and by `bin/update` afterwards. Without it there was no\nway to tell what you were running, whether an update had landed, or what it\nchanged \u2014 the first re-adopter had to diff two trees by hand to discover that\na file had stopped existing.\n\n`tracker` records where issues actually live, and `docs` where the project's\nexisting documentation does. `bin/adopt` stubs both empty and `INIT.md`\nfills them \u2014 before that they were questions it asked with nowhere to put the\nanswers.\n\n`repos` lists the repository folders this brain describes. In `embedded` mode\nthat is the one it lives in; in `sibling` mode it is every git repository\nbeside the brain in the workspace, and the list is a record of what this brain\nis *about* \u2014 not a list of things it may modify.\n\n# Why this is written down rather than detected\n\n`bin/stale` used to compute the repository root as `../..` and scan paths\nbeginning `brain/`, which is correct **only** when the brain is one level down\n*and* the directory happens to be called `brain`. The template passed its own\nchecks by coincidence of its folder name. Recording the mode is what turns that\ncoincidence into a fact, which is [D0001](example/knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)\napplied to the tooling itself.\n", "mtime": "2026-11-08T19:09:03+00:00"}, {"path": "knowledge-catalog/decisions/D0010-brain-tasks-replaces-an-external-tracker.md", "meta": {"id": "D0010", "type": "decision", "title": "brain/tasks replaces an external tracker", "description": "The brain's task files are the only tracker this project has; nothing is mirrored to GitHub Issues.", "timestamp": "2026-11-08", "tags": ["brain", "tracker", "process"], "status": "active", "serves": "../goals/G0002-humanize-me-installs-into-another-project-in-one.md", "invariant": "A unit of work on this project exists as a file under brain/tasks/ and nowhere else.", "constrains": ["brain/tasks", "brain/config.md"]}, "body": "\n# Context\n\n`/brain-init` asks where issues live and whether `brain/tasks/` should mirror\nthat or replace it. This project has no external tracker in use yet: the\nrepository has no commits and no issues, so there is nothing to mirror and the\nquestion is genuinely open rather than inherited.\n\nThe forces are that a mirror has to be kept in step by hand, and that the\nblocking edges `/to-tasks` writes only mean anything where the tool can read\nthem.\n\n# Decision\n\n`brain/tasks/` is the tracker. Work on this project is a task file in the\nbrain, and there is no second system holding the same ticket.\n\n# Alternatives\n\n- **GitHub Issues as canonical, `brain/tasks/` mirroring it** \u2014 rejected: two\n  places holding the same ticket have to be kept in step by somebody\n  remembering to, which is the class of upkeep this brain exists to replace\n  with a tool.\n- **GitHub Issues replacing `brain/tasks/`** \u2014 rejected: the lineage edges\n  would then live outside the brain, so `bin/status`, the claimable frontier\n  and the forward walk would all go quiet. The tracker would work and the\n  thing that makes the tracker worth having would not.\n\n# Consequences\n\n- `config.md` records `tracker: brain/tasks`.\n- `bin/status` and `bin/reconcile` are the whole picture of outstanding work;\n  there is nowhere else to check.\n- If this project ever takes outside contributors, this decision is the one to\n  revisit first \u2014 an external contributor cannot file a task they cannot push.\n", "mtime": "2026-11-08T18:11:59+00:00"}, {"path": "knowledge-catalog/decisions/D0011-only-prose-with-a-human-reader-is-in.md", "meta": {"id": "D0011", "type": "decision", "title": "Only prose with a human reader is in scope", "description": "The voice skills govern prose written to be read by a person; text written for another agent to consume is explicitly out of scope.", "timestamp": "2026-11-08", "tags": ["scope", "voice", "imported"], "status": "draft", "resource": "~/.claude/projects/-Users-hootener-Source-hootener-humanize-me/fd429e6f-6113-4db7-b8d7-43a91509d077.jsonl (operator utterance, [typed], via bin/utterances)", "invariant": "A voice skill in this library applies only where the output has a human reader.", "constrains": ["skills"]}, "body": "\n# Context\n\nReconstructed from the operator's own words in an earlier session, not written\nat the time. Quoted verbatim:\n\n> \"this repo is intended to be a repository of skills that we'll include into\n> other projects to help coding agents sound less like coding agents and more\n> like a human when they're writing prose _intended to be ingested by humans_.\n> We do not care about prose that will be consumed by agents.\"\n\nThe force is that an agent writes a great deal of text, and most of it is read\nby another agent \u2014 tool arguments, structured output, intermediate notes.\nTreating all of it as prose to be humanized would make the library both\nenormous and wrong, since agent-facing text benefits from exactly the\nflat explicitness this library is trying to remove.\n\n# Decision\n\nA voice skill in this library applies only to prose with a human reader.\nText written to be consumed by another agent is out of scope and does not need\nto sound like anyone.\n\n# Alternatives\n\n- **Govern all prose an agent emits** \u2014 rejected by the operator in the same\n  breath as the scope was set: \"We do not care about prose that will be\n  consumed by agents.\"\n\n# Consequences\n\n- Every skill in this library has to be able to say who its reader is, and a\n  skill that cannot is probably the wrong shape.\n- Agent-to-agent output is left alone deliberately, so its flatness is not a\n  defect this project is obliged to fix.\n\n# Log\n\nStill `draft`. This is a reconstruction from a transcript, accepted by the\noperator for the record but not yet confirmed as the standing wording.\n", "mtime": "2026-11-08T18:12:11+00:00"}, {"path": "knowledge-catalog/decisions/D0012-make-it-adoptable-first-then-dogfood-it-as.md", "meta": {"id": "D0012", "type": "decision", "title": "Make it adoptable first, then dogfood it as an end user", "description": "The library is made installable before the operator's own voice setup is built, and that setup is then built through the published install path.", "timestamp": "2026-11-08", "tags": ["sequencing", "adoption", "imported"], "status": "draft", "resource": "~/.claude/projects/-Users-hootener-Source-hootener-humanize-me/fd429e6f-6113-4db7-b8d7-43a91509d077.jsonl (operator utterance, [answered] \u2014 an AskUserQuestion result, via bin/utterances)", "serves": "../goals/G0002-humanize-me-installs-into-another-project-in-one.md", "invariant": "The operator's own voice setup is built through the same install path an outside project would use.", "constrains": ["skills"]}, "body": "\n# Context\n\nReconstructed from the operator's own words in an earlier session. It arrived\nsideways \u2014 as the free-text note on an answer to a question about something\nelse, which is why it is recoverable at all. Quoted verbatim:\n\n> \"the goal here is to make this an adoptable project, then we'll use the\n> adoptable version to make our own voice setup, like any other end user would\"\n\nThe force is the ordering. Both halves of the work are real, and doing them in\nthe other order is the obvious temptation: the voice skills are the interesting\npart, and the packaging feels like chores.\n\n# Decision\n\nAdoptability comes first. Once the library installs, the operator's own voice\nsetup is built by installing it the way an outside project would, rather than\nby working inside the tree.\n\n# Alternatives\n\n- **Build the voice setup in-tree first, package it afterwards** \u2014 rejected:\n  a setup built in-tree exercises paths no end user has, so the install stays\n  untested in exactly the places it is most likely to be broken, and the first\n  real adopter finds them instead of the operator.\n\n# Consequences\n\n- The install path is the operator's own path, so a defect in it costs them\n  directly and gets found early.\n- Voice work that would be easier to do in-tree waits, or gets done through\n  the install and the friction is treated as a finding about the install.\n\n# Log\n\nStill `draft`. This is a reconstruction from a transcript, accepted by the\noperator for the record but not yet confirmed as the standing wording.\n", "mtime": "2026-11-08T18:12:11+00:00"}, {"path": "knowledge-catalog/decisions/D0013-the-craft-ships-generic-and-the-voice-is.md", "meta": {"id": "D0013", "type": "decision", "title": "The craft ships generic and the voice is a generated profile", "description": "The library ships register skills that hold the craft for everyone; a generator reads the operator's writing and emits only a profile those skills read at write time.", "timestamp": "2026-11-09", "tags": ["voice", "architecture", "profile"], "status": "active", "serves": "../goals/G0003-an-agent-writes-human-facing-prose-in-the.md", "invariant": "A register skill holds no fact about any particular person, and a profile holds no craft instruction.", "constrains": ["skills", "voice/profile"]}, "body": "\n# Context\n\nThe library has to combine two things that change on completely different\nschedules. The craft \u2014 what agent prose does wrong, and what a claim at a given\npitch has to rest on \u2014 is the same for every user and improves as the project\nlearns. The operator's voice is theirs, improves only when they feed it more of\ntheir writing, and is worth hand-editing.\n\nThe tempting shape is one generator that writes three finished skills, each\nholding craft and voice together. It reads well and needs nothing resolved at\nwrite time.\n\nThe force against it is the update path. Craft baked into a generated artifact\nreaches an existing user only if they regenerate, which means every\nimprovement the project makes is an improvement most users never see. It also\nputs the generator on the hook for restating the craft correctly on every run,\nwhere getting it wrong is silent.\n\n# Decision\n\nThe two halves ship separately and meet at write time.\n\nThe library ships the register skills. They hold the craft, name no person, and\nare identical in every install. A generator reads the operator's writing and\nemits **only** a profile \u2014 a description of how that person writes. The skills\nread the profile when they write.\n\nNeither half may take on the other's job: a shipped skill that knows something\nabout a particular person has leaked, and a profile that instructs on craft is\nduplicating what already ships.\n\n# Alternatives\n\n- **The generator writes three self-contained skills** \u2014 rejected: craft\n  improvements then reach nobody who already installed, and the generator has\n  to get the craft right on every run with no way to tell when it did not.\n- **One skill holding all three registers, plus a profile** \u2014 rejected on\n  loading rather than on principle: a register is picked before writing starts,\n  so the other two are dead weight in context. Revisit if the registers turn\n  out to share more than they differ.\n\n# Consequences\n\n- A register skill is reviewable as craft on its own, with no corpus in hand.\n- The profile format is an interface between the two halves, so changing it\n  breaks installed skills and is a versioned change rather than a tidy-up.\n- The library does something useful before any profile exists, which is what\n  [D0015](D0015-a-voice-profile-is-optional-and-the-skills.md) turns into a\n  requirement.\n- Where the profile is *found* is a separate question, settled by\n  [D0019](D0019-humanize-me-ships-as-a-claude-code-plugin.md).\n", "mtime": "2026-11-09T16:53:39+00:00"}, {"path": "knowledge-catalog/decisions/D0014-registers-are-organized-by-burden-of-proof-not.md", "meta": {"id": "D0014", "type": "decision", "title": "Registers are organized by burden of proof, not formality", "description": "The three registers \u2014 casual, professional, research \u2014 are distinguished by what a claim has to rest on, and a register is selected on that rather than on the medium it will be sent through.", "timestamp": "2026-11-09", "tags": ["voice", "registers", "taxonomy"], "status": "active", "serves": "../goals/G0003-an-agent-writes-human-facing-prose-in-the.md", "invariant": "A register is defined and selected by what its claims must rest on, never by medium or formality.", "constrains": ["skills", "voice/profile"]}, "body": "\n# Context\n\nThe registers arrived named for formality: casual for a Slack message,\nprofessional for work, something research-shaped for evidence-heavy writing.\nThree levels of dress.\n\nFormality is the wrong axis to build on. It is surface \u2014 contractions,\ngreetings, whether a message opens with \"Hey\" \u2014 which makes it the easiest\nthing for an agent to imitate and the least valuable thing to get right. An\nagent already does polite registers passably. What it does badly is sit at one\nlevel of confidence regardless of what it actually knows.\n\n# Decision\n\nThree registers, distinguished by how much warrant a claim has to carry.\n\n| Register | A claim rests on |\n|---|---|\n| `casual` | the writer's say-so |\n| `professional` | the writer's judgment, stated as judgment and owned |\n| `research` | evidence outside the writer, cited |\n\nA register is selected by asking what the claims in this piece have to rest on\n\u2014 **not** by asking what application it will be pasted into. Medium and\nregister are independent: a Slack message defending an architecture decision is\ncasual in medium and professional in warrant, because the reader is owed the\nreasoning and not just the conclusion. Formality follows from the medium and\nlives as surface markers inside each register's profile.\n\nThe third register keeps the name `research`. It is what the operator reached\nfor, \"research-level\" reads immediately, and defining it by warrant rather than\nby subject keeps it covering an incident post-mortem or a pricing analysis and\nnot only a paper.\n\n# Alternatives\n\n- **Organize on formality** \u2014 rejected: it is the half an agent already does\n  acceptably, and building the taxonomy on it leaves the actual failure to a\n  style note.\n- **Two registers, collapsing casual into professional** \u2014 rejected: say-so\n  and stated-judgment are different acts. Collapsing them means either the\n  casual writing reads like a memo or the memos never show their reasoning.\n- **Name the third `evidentiary`** \u2014 rejected: precise and stuffy.\n- **Name it `rigorous`** \u2014 rejected: implies the other two are not.\n- **Name it `technical`** \u2014 rejected: names a subject, not a warrant level.\n\n# Consequences\n\n- Each register skill has to state what its claims rest on before it states any\n  style preference, and a register that cannot say this is the wrong shape.\n- Calibration \u2014 how confidence and uncertainty get expressed \u2014 is a required\n  section of every register's profile rather than an optional nicety.\n- Selection logic asks about the claims, so a skill cannot route on file type\n  or destination alone.\n- Corpus filing inherits the axis, which is what\n  [D0016](D0016-the-corpus-is-sorted-into-per-register-folders.md) asks the\n  operator to do by hand.\n", "mtime": "2026-11-09T16:53:39+00:00"}, {"path": "knowledge-catalog/decisions/D0015-a-voice-profile-is-optional-and-the-skills.md", "meta": {"id": "D0015", "type": "decision", "title": "A voice profile is optional and the skills degrade without one", "description": "The register skills do the generic job with no profile present, so installing the library costs one step and never requires gathering a corpus first.", "timestamp": "2026-11-09", "tags": ["voice", "adoption", "profile"], "status": "active", "serves": "../goals/G0002-humanize-me-installs-into-another-project-in-one.md", "invariant": "Every register skill produces useful prose with no profile present, and says which mode it is in.", "constrains": ["skills"]}, "body": "\n# Context\n\n[G0002](../goals/G0002-humanize-me-installs-into-another-project-in-one.md)\nasks that the library install in one step without the adopter reading its\ninternals. The architecture in\n[D0013](D0013-the-craft-ships-generic-and-the-voice-is.md) puts the personal\nhalf in a generated profile.\n\nIf the skills need that profile to function, the two pull against each other.\nInstalling would cost one step plus a corpus-gathering project: sorting\ndocuments, extracting text, running a generator, reviewing output. That is not\none step, and it asks for the investment before the adopter has seen anything\nwork.\n\nIt also gets the value backwards. The craft half \u2014 what agent prose does wrong,\nand what warrant each register owes \u2014 is most of the benefit and needs nothing\nfrom the adopter.\n\n# Decision\n\nA profile is optional. With none present, every register skill does the generic\njob: it writes at the register's level of warrant and avoids what agent prose\ndoes wrong. With a profile, it also sounds like the operator.\n\nA skill states which mode it is in rather than leaving the adopter to guess\nwhether their profile was found.\n\n# Alternatives\n\n- **Require a profile** \u2014 rejected: it makes the install one step plus a\n  project, and asks for the corpus work before the adopter has evidence the\n  library is worth it.\n- **Ship a default profile, generic and overridable** \u2014 rejected: a profile\n  describes a particular person, so a default one describes a person who does\n  not exist. It would read as a voice rather than as an absence, and the\n  adopter would be tuning away from someone imaginary instead of starting from\n  craft.\n\n# Consequences\n\n- The craft in each register skill has to stand alone as prose guidance,\n  reviewable with no corpus in hand.\n- Profile lookup is a miss, not an error. A skill finding nothing proceeds.\n- The adopter's path has a real first stop: install, use it, and gather a\n  corpus later if the generic version earns it.\n- This is what makes the plugin install in\n  [D0019](D0019-humanize-me-ships-as-a-claude-code-plugin.md) safe, since\n  user-scoped skills are present in projects that will never have a profile.\n", "mtime": "2026-11-09T16:54:08+00:00"}, {"path": "knowledge-catalog/decisions/D0016-the-corpus-is-sorted-into-per-register-folders.md", "meta": {"id": "D0016", "type": "decision", "title": "The corpus is sorted into per-register folders by hand", "description": "The operator files each writing sample under the register it teaches, because the filing is a judgment the generator cannot make and should not guess.", "timestamp": "2026-11-09", "tags": ["voice", "corpus", "ingestion"], "status": "active", "serves": "../goals/G0003-an-agent-writes-human-facing-prose-in-the.md", "invariant": "A corpus sample's register is declared by the operator, never inferred by the generator.", "constrains": ["voice/corpus"]}, "body": "\n# Context\n\nA corpus is mixed by nature. A blog post, a client email and an analysis\nwrite-up are three different registers, and they arrive as a pile of files.\nSomething has to decide which sample teaches which register\n([D0014](D0014-registers-are-organized-by-burden-of-proof-not.md)).\n\nThe generator could classify them. It would save the operator some filing and\nit would be right most of the time.\n\nThe force against it is what a misfile costs. A classification error does not\nannounce itself; it quietly teaches one register from the wrong samples, and the\nresulting profile is wrong in a way that reads as a voice rather than as a bug.\nWorse, the axis is warrant, not topic \u2014 and warrant is the harder thing to read\noff a document, because a casual note about a serious subject looks like a\nprofessional one.\n\n# Decision\n\nThe operator sorts the corpus into one folder per register. The generator reads\n`casual/`, `professional/` and `research/` and never decides which a sample\nbelongs to.\n\nThe filing is treated as data rather than as chore. An operator putting a\ndocument under `professional/` is asserting \"this is how I sound when I am\nstaking my judgment on something\" \u2014 a claim about themselves that no classifier\nhas access to.\n\n# Alternatives\n\n- **The generator classifies and the operator confirms** \u2014 rejected: it adds a\n  review pass over every sample, and a misfile the operator skims past poisons\n  a register silently. The confirmation step is the filing, done later and\n  worse.\n- **Per-file front matter or sidecar tags** \u2014 rejected: it survives moving\n  files and allows one sample to serve two registers, but it means editing\n  every sample on the way in, and the binaries that matter most here \u2014 PDFs and\n  Word documents \u2014 cannot carry front matter at all.\n\n# Consequences\n\n- The operator does a few minutes of filing before a first build, and the\n  generator has no classification step to get wrong.\n- An empty register folder is a legible state: that register has no profile and\n  falls back to generic craft under\n  [D0015](D0015-a-voice-profile-is-optional-and-the-skills.md).\n- Writing that never lands in a folder \u2014 anything read live through an\n  integration \u2014 needs its own path, which is\n  [D0017](D0017-writing-reached-through-mcp-is-distilled-in-flight.md).\n- Extracting text from PDFs and Word documents is now on the critical path and\n  is not yet decided.\n", "mtime": "2026-11-09T16:54:08+00:00"}, {"path": "knowledge-catalog/decisions/D0017-writing-reached-through-mcp-is-distilled-in-flight.md", "meta": {"id": "D0017", "type": "decision", "title": "Writing reached through MCP is distilled in flight and never stored", "description": "Mail and documents read through an integration are observed and turned into profile assertions in the session that reads them; no copy of the personal text is written to disk.", "timestamp": "2026-11-09", "tags": ["voice", "corpus", "privacy", "mcp"], "status": "active", "serves": "../goals/G0003-an-agent-writes-human-facing-prose-in-the.md", "invariant": "Personal text reached through an integration is never written to disk, and a profile built that way records that its samples are gone.", "constrains": ["voice/corpus", "voice/profile"]}, "body": "\n# Context\n\nNot all of the operator's writing is a file they can file. The most useful\ncasual corpus anyone has is their sent mail, and it is reachable live through\nan integration rather than as a folder \u2014 the operator's framing was \"go look at\nthese emails.\"\n\nThe obvious shape is an ingest step: pull the threads, strip quoted replies and\nsignatures, write plain text into `voice/corpus/casual/`, and gitignore it.\nThat is reproducible, re-runnable, auditable, and keeps every later check\nworking.\n\nIt also means the operator's mail is sitting in a working directory, where a\ngitignore is the only thing between it and a commit, and where it will be\npicked up by backups, search indexes and every agent that reads the tree\nafterwards. The operator weighed this and chose the other way.\n\n# Decision\n\nWriting reached through an integration is read, observed and distilled within\nthe session that reads it. Observations go into the profile. No copy of the\npersonal text is written to disk \u2014 not raw, not extracted, not redacted.\n\nA profile built this way records that its samples are gone, so a later reader\nknows which of its claims can still be rechecked\n([D0018](D0018-a-voice-profile-states-its-claims-checkably.md)).\n\n# Alternatives\n\n- **Materialize as gitignored plain text** \u2014 rejected by the operator: a\n  gitignore is the only safeguard, and the extracted mail outlives the reason\n  it was fetched.\n- **Materialize with names, addresses and figures stripped** \u2014 rejected: it\n  keeps most of the voice signal and reduces the exposure rather than removing\n  it, while mangling some samples and losing how the operator writes about\n  specific things. The exposure is the part the operator wanted gone.\n\n# Consequences\n\n- A re-run means re-reading the mail. There is no cached corpus to rebuild\n  from, and the integration has to be connected again.\n- Countable markers survive this intact: they are measured while reading and\n  asserted in the profile, and they are checked thereafter against *generated*\n  output, which needs no samples.\n- A held-out comparison against the real writing can only run inside the\n  session that has access. It becomes a dated attestation rather than a\n  repeatable check.\n- The casual register will therefore be the least verifiable one, since it is\n  the register most likely to come from mail. The profile states this rather\n  than hiding it.\n", "mtime": "2026-11-09T16:54:41+00:00"}, {"path": "knowledge-catalog/decisions/D0018-a-voice-profile-states-its-claims-checkably.md", "meta": {"id": "D0018", "type": "decision", "title": "A voice profile states its claims checkably", "description": "A profile asserts what it can in countable form and records how and when it was verified, so a thin register is visible as thin instead of reading as settled.", "timestamp": "2026-11-09", "tags": ["voice", "profile", "verification"], "status": "active", "serves": "../goals/G0003-an-agent-writes-human-facing-prose-in-the.md", "invariant": "Every register profile carries machine-readable markers and a dated record of how it was verified.", "constrains": ["voice/profile"]}, "body": "\n# Context\n\nThe central claim of this library is \"this sounds like you,\" which is the\neasiest kind of claim to assert and the hardest to test. A generator will\nalways produce something confident-looking, and an operator reading their own\nprofile is the worst available judge of whether it is accurate \u2014 it will feel\nright because it was written to.\n\n[D0001](../../example/knowledge-catalog/decisions/D0001-claims-must-be-checkable.md)\napplies directly: a profile whose claims cannot be checked costs its reader the\nthing they would have found by looking at their own writing.\n\nTwo mechanisms are available and they have different requirements. Countable\nmarkers \u2014 sentence length distribution, banned openers, em-dash rate, bullet\nratio \u2014 can be measured in output by a script, with no model and no samples. A\nheld-out comparison \u2014 reserve some samples, regenerate one from its own brief,\ndiff against the real thing \u2014 is a much stronger signal and needs the originals\nto still exist, which under\n[D0017](D0017-writing-reached-through-mcp-is-distilled-in-flight.md) they\nsometimes do not.\n\n# Decision\n\nA register profile states its claims countably wherever a claim can be counted,\nin machine-readable frontmatter, and carries prose only for what genuinely\ncannot be counted.\n\nIt also records its own provenance and verification: what it was built from, how\nmany samples, how many were held out, which checks ran and on what date. A\nregister verified only by markers says so. A register whose held-out comparison\ncannot be re-run says that too.\n\nThe two checks are kept distinct because they survive differently. Markers are\nmeasured once from the writing and checked forever against generated output.\nThe held-out comparison needs the samples and is recorded a
